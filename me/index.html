{id:'oil',i:'🥄',t:'तेल, घी और कढ़ाई',min:2,body:[
 'ICMR 2000 कैलोरी पर रोज़ लगभग 27 ग्राम दिखने वाली चर्बी की अनुमति देता है — प्रति व्यक्ति 5–6 छोटी चम्मच, तेल और घी मिलाकर। ज़्यादातर रसोई इसका दो-तीन गुना इस्तेमाल करती है। एक बड़ी चम्मच = 120 कैलोरी; हर रोटी पर एक चम्मच घी एक कौर ज़्यादा खाए बिना रोज़ 300 कैलोरी जोड़ देता है।',
 'घी ज़हर नहीं और तेल दवा नहीं। दोनों में 9 कैलोरी प्रति ग्राम। घी में ज़्यादातर संतृप्त वसा; मूंगफली, सरसों, तिल, राइस-ब्रान तेल में ज़्यादातर असंतृप्त। साल में दो-तीन तेल बदलते रहें। घी स्वाद के लिए, छोटी चम्मच से।',
 'असली ख़तरा दोबारा इस्तेमाल तेल है। हर बार गर्म करने पर वह काला पड़ता है, ऑक्सीडाइज़ होता है और ट्रांस फैट बनता है। घर पर एक बार तला तेल एक बात; बाहर की कढ़ाई जिसमें हफ़्ते से तेल मिलाया जा रहा है, दूसरी।',
 'नापें। तेल चम्मच से डालें, डिब्बे से नहीं। महीने की एक बोतल रखें और देखें कितनी चले: चार लोगों के परिवार को महीने में लगभग 3 लीटर चाहिए, 6 नहीं।'],
 quiz:[['प्रति व्यक्ति रोज़ दिखने वाली चर्बी?',['5–6 छोटी चम्मच','12 छोटी चम्मच','शून्य सबसे अच्छा'],0],['घी या तेल?',['घी ज़हर है','दोनों 9 कैलोरी/ग्राम; मात्रा ज़्यादा मायने रखती है','तेल दवा है'],1],['सबसे हानिकारक?',['एक बार इस्तेमाल ताज़ा तेल','बार-बार गर्म किया तेल','छोटी चम्मच से घी'],1]]},
{id:'salt',i:'🧂',t:'नमक और ब्लड प्रेशर',min:2,body:[
 'रोज़ एक छोटी चम्मच — 5 ग्राम — सीमा है। भारतीय लगभग दोगुना खाते हैं। ब्लड प्रेशर नमक के पीछे चलता है, और ऊँचा ब्लड प्रेशर लकवे और किडनी फ़ेल का सबसे बड़ा कारण है।',
 'ज़्यादातर नमक नमकदानी से नहीं आता। पापड़, अचार, नमकीन, सेव, चिवड़ा, चिप्स, ब्रेड, बिस्कुट, चीज़, सोया सॉस, पानीपूरी का पानी, मैगी और पैकेट के सूप लाते हैं। एक पापड़ में दिन के नमक का चौथाई; छोटी कटोरी चिवड़े में आधा।',
 'स्वाद तीन हफ़्ते में बदल जाता है। कम नमक डालें; नींबू, अदरक, हरी मिर्च, धनिया, लहसुन और भुने मसालों से स्वाद लाएँ। अचार-पापड़ इतवार के लिए।',
 'गर्भावस्था में ऊँचे ब्लड प्रेशर में नमक कम करना ठीक है, पर खाना कम नहीं — ब्लड प्रेशर के लिए कैलोरी या प्रोटीन कभी न काटें।'],
 quiz:[['रोज़ नमक की सीमा?',['एक छोटी चम्मच','तीन छोटी चम्मच','एक बड़ी चम्मच'],0],['ज़्यादातर नमक कहाँ से?',['मेज़ की नमकदानी','पापड़, अचार, नमकीन, पैकेट','सब्ज़ियाँ'],1],['नमक का स्वाद…',['कभी नहीं बदलता','तीन हफ़्ते में बदलता है','एक दिन में'],1]]},
{id:'preg',i:'🤰',t:'गर्भावस्था में खाना',min:3,body:[
 '"दो के लिए" नहीं। पहले तीन महीने अतिरिक्त कैलोरी बिल्कुल नहीं — सिर्फ़ गुणवत्ता, ख़ास तौर पर फोलेट (साग, दाल, चना, संतरा) और फोलिक एसिड की गोली। चौथे महीने से लगभग 350 कैलोरी ज़्यादा — एक गिलास दूध और मुट्ठी चना, दूसरी थाली नहीं।',
 'प्रोटीन बीच के महीनों में 10 ग्राम और अंत में लगभग 20 ग्राम बढ़ता है: अतिरिक्त कटोरी दाल, दही, पनीर या अंडा। आयरन की ज़रूरत लगभग दोगुनी; कैल्शियम 1000 मिग्रा ही पर सोखना अपने आप बढ़ता है। भारत में आयरन और कैल्शियम की गोलियाँ सामान्य हैं क्योंकि खाने से ये आँकड़े शायद ही मिलें।',
 'हर 2–3 घंटे में थोड़ा खाने से मितली, एसिडिटी और शुगर में आराम। भोजन कभी न छोड़ें; लंबा अंतर मितली बढ़ाता है। बचें: कच्चा या अधपका खाना, कच्चा दूध और उसका पनीर, कच्चे अंकुर, बाहर के कटे फल, लिवर, विटामिन A की बड़ी ख़ुराक, शराब; चाय-कॉफ़ी दो छोटे कप से कम।',
 'सही वज़न बढ़ना: सामान्य वज़न से शुरू किया हो तो कुल लगभग 10–12 किलो; ज़्यादा वज़न हो तो 5–9; कम हो तो ज़्यादा। पहले तीन महीने लगभग नहीं, फिर हफ़्ते में लगभग 400 ग्राम। कम या ज़्यादा हो तो डॉक्टर से मिलें — डाइट न करें।'],
 quiz:[['पहली तिमाही में अतिरिक्त कैलोरी?',['कोई नहीं — गुणवत्ता मायने रखती है','+350','+600'],0],['थोड़ा-थोड़ा बार-बार क्यों?',['मितली, एसिडिटी और शुगर','कुल ज़्यादा खाने','परंपरा'],0],['सामान्य वज़न पर वज़न बढ़ना?',['लगभग 10–12 किलो','20 किलो','कुछ नहीं'],0]]},
{id:'lact',i:'🤱',t:'स्तनपान के दौरान खाना',min:2,body:[
 'पहले छह महीने स्तनपान में रोज़ लगभग 600 कैलोरी ख़र्च होती है — गर्भावस्था से ज़्यादा। इसका हिस्सा गर्भावस्था की चर्बी से आता है; बाक़ी खाने से। भूखी माँ सामान्य है; उसे खिलाएँ।',
 'प्रोटीन सामान्य से 15–20 ग्राम ज़्यादा; कैल्शियम 1200 मिग्रा; आयरन सलाह अनुसार जारी। पानी: हर बार दूध पिलाते समय एक गिलास।',
 'दूध में क्या जाता है: कैफ़ीन (300 मिग्रा — तीन कप से कम), शराब (बचें; ली हो तो हर पेग पर दो घंटे रुकें), विटामिन B12 (शाकाहारी माँ को बच्चे के लिए पूरक ज़रूरी)। क्या नहीं जाता: खाने की "गर्मी" या "ठंडक", मसाले, पत्तागोभी या दाल की "गैस"। परंपरागत रोकों का कोई आधार नहीं और वे भूखी माँ से अच्छा खाना ले लेती हैं।',
 'वज़न घटाने का यह समय नहीं। स्तनपान और सामान्य खाने से वज़न महीनों में धीरे उतरता है। डाइट चर्बी घटाने से पहले दूध घटाती है।'],
 quiz:[['स्तनपान में अतिरिक्त कैलोरी?',['कोई नहीं','लगभग 600','1500'],1],['दूध में क्या जाता है?',['पत्तागोभी की गैस','कैफ़ीन और शराब','खाने की गर्मी'],1],['स्तनपान में डाइट…',['ठीक है','चर्बी से पहले दूध घटाती है','सलाह दी जाती है'],1]]},
{id:'diabetes',i:'📉',t:'डायबिटीज़ और PCOS थाली में',min:3,body:[
 'डायबिटीज़ में समस्या सिर्फ़ चीनी नहीं। सारा कार्बोहाइड्रेट — रोटी, चावल, पोहा, फल, आलू, दूध — ग्लूकोज़ बनता है। सवाल यह है कि कितनी तेज़ी से और एक बार में कितना।',
 'कार्बोहाइड्रेट दिन में बाँटें: तीन भोजन और दो-तीन छोटे नाश्ते, हर एक में लगभग बराबर, बड़ा लंच और छूटा डिनर कभी नहीं। भोजन छोड़ने से अगले भोजन में बड़ा उछाल।',
 'धीमे कार्बोहाइड्रेट चुनें: बाजरा, ज्वार, साबुत गेहूँ, ओट्स, दलिया, साबुत मूंग, चना — मैदा, सफ़ेद ब्रेड, पोहा, साबूदाना, जूस, मिठाई नहीं। हर भोजन में प्रोटीन और सब्ज़ी जोड़ें; वे ग्लूकोज़ धीमा करते हैं। पहले सब्ज़ी और दाल, फिर रोटी।',
 'हर भोजन के बाद 10–15 मिनट चलें। चलती मांसपेशियाँ ग्लूकोज़ ले लेती हैं; असर कुछ दवाओं जैसा। PCOS में वही नियम, और 5–10% वज़न घटने से कई स्त्रियों में ओव्युलेशन वापस आता है।',
 'गर्भावस्था में डायबिटीज़ हो तो कार्बोहाइड्रेट रोज़ लगभग 175 ग्राम से कम नहीं — बच्चे को चाहिए — और सोने से पहले प्रोटीन वाला नाश्ता रात के कीटोन रोकता है।'],
 quiz:[['शुगर कौन बढ़ाता है?',['सिर्फ़ चीनी','सारा कार्बोहाइड्रेट, अलग गति से','सिर्फ़ चावल'],1],['डायबिटीज़ में भोजन छोड़ना…',['दिन की शुगर घटाता है','अगले भोजन में बड़ा उछाल','सलाह दी जाती है'],1],['खाने के बाद…',['लेट जाएँ','10–15 मिनट चलें','मिठाई खाएँ'],1]]},
{id:'myths',i:'🧐',t:'दस मिथक',min:3,body:[
 '**रात में चावल मोटा करता है।** चावल की कैलोरी किसी भी समय समान। मात्रा मायने रखती है, समय नहीं।',
 '**खाने के बाद फल बुरा।** फल किसी भी समय ठीक। समस्या जूस है, समय नहीं।',
 '**घी मोटा करता है, तेल नहीं।** दोनों 9 कैलोरी/ग्राम। दोनों नापें।',
 '**सेहत के लिए प्रोटीन पाउडर ज़रूरी।** सिर्फ़ तब जब खाने से न मिले। दाल, दूध, पनीर, अंडे, सोया सस्ते में करते हैं।',
 '**ब्राउन ब्रेड हेल्दी है।** ज़्यादातर ब्राउन ब्रेड रंग वाली सफ़ेद ब्रेड है। पहले घटक में "whole wheat" देखें — या रोटी खाएँ।',
 '**"शुगर-फ्री" मिठाई ठीक है।** वह अब भी मैदा, चर्बी और अक्सर माल्टिटोल या खजूर है; थोड़ी ही।',
 '**डिटॉक्स शरीर साफ़ करता है।** आपका लिवर और किडनी मुफ़्त में करते हैं। जूस क्लींज़ चीनी जोड़ता और रेशा हटाता है।',
 '**ठंडा पानी, दही और केले से सर्दी होती है।** वायरस से होती है। इन खानों से नहीं।',
 '**कम से कम खाना वज़न घटाने का तरीक़ा।** लगभग 1200 कैलोरी से नीचे शरीर धीमा पड़ता है और मांसपेशी घटती है; वज़न वापस आता है। पर्याप्त प्रोटीन और सब्ज़ी खाएँ, अनाज-तेल-चीनी घटाएँ, और चलें।',
 '**हेल्थ ड्रिंक बच्चों को लंबा करते हैं।** वे विटामिन वाली चीनी हैं। दूध, अंडे, दाल और नींद काम करते हैं।'],
 quiz:[['रात में चावल…',['मोटा करता है','दोपहर जितनी ही कैलोरी','वर्जित'],1],['ब्राउन ब्रेड…',['हमेशा साबुत गेहूँ','अक्सर रंगी सफ़ेद ब्रेड','हेल्थ फ़ूड'],1],['"डिटॉक्स" जूस…',['लिवर साफ़ करता है','चीनी जोड़ता, रेशा हटाता है','दवा है'],1]]},
{id:'outside',i:'🛵',t:'बाहर का खाना: दोहरी मार',min:3,body:[
 'भारत में बाहर खाने में दो ख़तरे एक पर एक चढ़े हैं। पहला सबको आधा पता है: खाना तला, नमकीन, मीठा और बड़ा। दूसरा भारतीय है: उसमें जो है वह शायद खाना ही न हो।',
 '**दोबारा इस्तेमाल तेल।** बाहर की कढ़ाई ख़ाली नहीं होती, भरी जाती है। बार-बार गर्म होता तेल काला पड़ता है, ऑक्सीडाइज़ होता है और ट्रांस फैट बनाता है। आप इसे देखते नहीं; सिर्फ़ कुरकुरापन चखते हैं।',
 '**असली से सस्ती मिलावट।** दूध में डिटर्जेंट, यूरिया और स्टार्च; पनीर और मावे में स्टार्च और कृत्रिम रंग; प्रतिबंधित रंग — बेसन, मिठाई और हल्दी में मेटानिल येलो, सब्ज़ियों पर मैलाकाइट ग्रीन, चटनी-सॉस में रंग; सरसों के तेल में आर्जेमोन; मसालों में चॉक, ईंट का चूरा और लकड़ी का बुरादा; जूस और गोले में सैकरीन और गंदे पानी की बर्फ़; फलों पर कृत्रिम पकाने के रसायन।',
 '**न लेबल, न तारीख़, न नाम।** पैकेट पर बनाने वाला, तारीख़ और सूची होती है। ठेले पर कुछ नहीं। पैकेट से आपको बचाने वाला हर नियम काउंटर पर रुक जाता है।',
 '**ख़ामोश ख़ुराक।** हफ़्ते में एक समोसा कुछ नहीं। दस साल रोज़ दोपहर वड़ा-पाव = 2500 बार अनजान तेल और अनजान रंग। मात्रा ज़हर बनाती है, और आदत मात्रा तय करती है।',
 'इसलिए: बाहर खाएँ, पर तले की जगह भाप में पका, ग्रिल और ताज़ा बना चुनें; जहाँ तेल और रसोई दिखे वहाँ बैठें; चटख रंग की मिठाई, चटनी और पेय छोड़ें; भूख के अंतर के लिए भुने चने या फल साथ रखें जो ठेले की ओर खींचता है। घर पर आसान जाँच: आयोडीन की बूँद से नीला-काला होता पनीर = स्टार्च; झुकी तश्तरी पर लकीर न छोड़ता दूध = पानी; ठंडे पानी में तुरंत रंग छोड़ता मसाला = रंग।'],
 quiz:[['भारत में बाहर खाने का दूसरा ख़तरा…',['क़ीमत','मिलावट और दोबारा इस्तेमाल तेल','मात्रा'],1],['मेटानिल येलो कहाँ मिलता है?',['ताज़ी हल्दी की गाँठ','रंगे बेसन, मिठाई और हल्दी पाउडर','दूध'],1],['सबसे अच्छा बचाव?',['कभी बाहर न खाना','भाप में पका-ताज़ा चुनें; चटख रंग से बचें; नाश्ता साथ रखें','सिर्फ़ मिठाई खाएँ'],1]]},
];
const BASICS_EXTRA_HI=[
 {i:'🚫',h:'ख़राब विकल्प, सीधे-सीधे',b:'बिस्कुट, कुकीज़, क्रोसां, ब्रेड, पेस्ट्री, कोल्ड ड्रिंक, चिप्स और मैगी किसी भी क़ीमत पर ख़राब खाना हैं। सूखा नाश्ता भी — चिवड़ा, चवाणू, सेव, गाठिया, फाफड़ा: सूखा दिखता है इसलिए हानिरहित लगता है, पर तला हुआ है; तेल अंदर समा गया है। गरम नाश्ता — भजिया, गोटा, समोसा, वड़ा — ताज़ा तला, ज़्यादातर दोबारा इस्तेमाल तेल में। भाप में पका गुजराती खाना अपवाद है: ढोकला, खमण, खांडवी, मुठिया, पात्रा, हांडवो (कम तेल), इडली। और इडली तब तक ठीक है जब तक नारियल की चटनी न आए — चर्बी वहाँ है।'},
 {i:'🍉',h:'फल खाने के लिए हैं। पानी पीने के लिए है।',b:'आप पूरा तरबूज़ पी सकते हैं; पूरा खा कभी नहीं सकते। रस = दो मिनट में पाँच फाँकों की चीनी, रेशा कूड़े में। फल चबाएँ।'}];
const DEEP_HI=[
{id:'rda',t:'आँकड़े कहाँ से आते हैं',min:7,body:[
 'इस ऐप का हर लक्ष्य — 55 ग्राम प्रोटीन, 29 मिग्रा आयरन, 1000 मिग्रा कैल्शियम — किसी ने लोगों में नापा हुआ आँकड़ा है। कैसे नापा, यह समझने से आँकड़े आदेश से औज़ार बन जाते हैं।',
 'ज़्यादातर पोषक तत्वों के लिए समिति पूछती है: संतुलन रखने, ख़ून का मार्कर सामान्य रखने या शरीर का भंडार भरने के लिए व्यक्ति को कितना चाहिए? दर्जनों स्वयंसेवकों में इसे नापती है। जवाब अलग होते हैं — शरीर अलग हैं — और घंटी के आकार का वक्र बनाते हैं। उसका बीच **अनुमानित औसत आवश्यकता (EAR)** है: आधे स्वस्थ लोगों को कम चाहिए, आधे को ज़्यादा।',
 'EAR पर लक्ष्य रखें तो आधी आबादी कम रह जाए। इसलिए समिति दो स्टैंडर्ड डेविएशन — लगभग 20–25% — जोड़ती है और उसे **RDA** कहती है। बनावट से ही RDA लगभग 97.5% स्वस्थ लोगों को कवर करता है। यानी किसी एक व्यक्ति के लिए RDA लगभग हमेशा ज़रूरत से ज़्यादा है। यह आबादी का खाना तय करने की सुरक्षित छत है, व्यक्ति की न्यूनतम नहीं।',
 'इसलिए ऐप दोनों दिखाता है। दिन का आयरन EAR के निशान तक पहुँचे तो व्यक्ति शायद ठीक है; RDA तक पहुँचे तो लगभग निश्चित। कैल्शियम के RDA का 85% देने वाली योजना कमी नहीं — वह औसत ज़रूरत से ऊपर है।',
 'कैलोरी अपवाद है। कैलोरी का RDA नहीं; 97.5% लोगों को कवर करने वाली अनुमति ज़्यादातर को मोटा कर देगी। कैलोरी के लक्ष्य औसत पर रखे जाते हैं, इसलिए उन्हें तालिका से पढ़ने की बजाय व्यक्ति — ऊँचाई, वज़न, गतिविधि — के अनुसार समायोजित करना पड़ता है। मिफ़्लिन–सेंट जियोर समीकरण यही करता है, और इसलिए ऐप आपका वज़न-ऊँचाई पूछता है।',
 'ICMR–NIN ने 2020 में भारतीयों के लिए ये प्रकाशित किए, 2010 के आँकड़े बदलकर। प्रोटीन RDA घटा (1.0 → 0.83 ग्राम/किलो), स्त्रियों का आयरन बढ़ा (भारतीय आहार के नए सोखने के डेटा से), कैल्शियम बढ़ा (600 → 1000)। ये फ़ैशन नहीं; माप का अनुसरण हैं।',
 '"My Plate for the Day" (2024) इन आँकड़ों का खाने में अनुवाद है: 2000 कैलोरी पर 250 ग्राम अनाज, 85 दाल, 400 सब्ज़ी, 100 फल, 300 मिली दूध, 35 ग्राम मेवे, 27 ग्राम तेल। आहार अनाज, दाल, मेवे और तेल आपकी कैलोरी के हिसाब से बदलता है, और सब्ज़ी, फल, दूध स्थिर रखता है, क्योंकि वे न्यूनतम हैं, अनुपात नहीं।',
 'आँकड़े जो नहीं कर सकते: आपके बारे में बताना। वे स्वस्थ आबादी का वर्णन हैं। बीमारी, दवाएँ, गर्भावस्था की जटिलताएँ, जीन ज़रूरत बदलते हैं। वहाँ डॉक्टर आता है और तालिका चुप हो जाती है।'],},
{id:'energy',t:'कैलोरी का संतुलन, ईमानदारी से',min:7,body:[
 'महीनों तक अंदर आती और बाहर जाती कैलोरी अलग हो तो वज़न बदलता है। इस वाक्य के दोनों पक्ष नापना लोगों की सोच से कठिन है।',
 'बाहर जाती कैलोरी के तीन हिस्से। विश्राम चयापचय — जीवित रहने की क़ीमत, लगभग 60–70% — मुख्यतः शरीर में कितनी मांसपेशी-ऊतक है इस पर निर्भर, इसलिए मिफ़्लिन–सेंट जियोर समीकरण वज़न, ऊँचाई, उम्र और लिंग लेता है। गतिविधि 15–30%, PAL के रूप में गुणा (1.2 बैठे से 1.9 बहुत सक्रिय)। पाचन का ख़र्च 10%, प्रोटीन पर चर्बी से ज़्यादा।',
 'अंदर आती कैलोरी = खाया घटा न सोखा। खाने की तालिकाएँ नमूनों का औसत हैं; आपकी रोटी तालिका की रोटी नहीं। पकाने से वज़न बदलता है (पानी अंदर-बाहर) पर कैलोरी नहीं, इसलिए तालिका कच्चा वज़न देती है — और आपकी आँख पका हुआ। ईमानदार लेखा भी आमतौर पर सच से 20% कम।',
 '7700 कैलोरी प्रति किलो का नियम — रोज़ 500 कम खाएँ, हफ़्ते में आधा किलो घटे — एक किलो चर्बी की कैलोरी का गणित है। पहले हफ़्तों चलता है, फिर विफल होता है, और कारण इच्छाशक्ति नहीं: वज़न घटते हल्का शरीर कम जलाता है, और शरीर चुपचाप हिलना-डुलना घटाता और विश्राम चयापचय अपेक्षा से थोड़ा ज़्यादा घटाता है — चयापचय अनुकूलन। घाटा अपने आप सिकुड़ता है; ठहराव भौतिकी है, विफलता नहीं।',
 'तराज़ू रोज़ झूठ बोलता है। एक किलो पानी नमक, कार्बोहाइड्रेट (ग्लाइकोजन पानी पकड़ता है), मासिक चक्र और पिछले भोजन के समय से हिलता है। हफ़्ते में एक बार, उसी दिन, उसी समय वज़न लें, और महीने की ढलान देखें, सुबह का आँकड़ा नहीं।',
 'स्त्री के लिए लगभग 1200 कैलोरी से नीचे शरीर मांसपेशी से प्रोटीन लेने लगता है और विश्राम चयापचय और गिरता है; जो घटता है वह अंशतः मांसपेशी होती है और चर्बी बनकर लौटती है। इसलिए ऐप कैलोरी 1200 से नीचे नहीं जाता, घाटा 750 पर रोकता है, घटाने में प्रोटीन 1.2 ग्राम/किलो करता है, छह महीने में 5–10% को यथार्थ लक्ष्य मानता है — और गर्भावस्था, स्तनपान, 18 से नीचे या 60 से ऊपर घाटा लगाने से मना करता है।',
 'सालों तक जो चलता है वह आँकड़ा नहीं। वह थाली का आकार है — ज़्यादा सब्ज़ी, दाल और प्रोटीन, कम अनाज, तेल और चीनी — और रोज़ चलना और पर्याप्त नींद। आँकड़े आकार जाँचने के लिए हैं, जीने के लिए नहीं।'],},
{id:'proteinq',t:'प्रोटीन की गुणवत्ता',min:7,body:[
 'प्रोटीन = ज़ंजीर में बँधे बीस अमीनो एसिड। उनमें नौ शरीर नहीं बना सकता; वे खाने से आने चाहिए। प्रोटीन "पूर्ण" है अगर वह नौ को लगभग उसी अनुपात में लाए जिसमें शरीर बनाता है।',
 'अंडा, दूध, मछली, मांस पूर्ण। अनाज में लाइसिन कम। दालों में मेथियोनीन कम। एक के पास वह है जो दूसरे के पास नहीं — इसलिए दाल-चावल, रोटी-दाल, खिचड़ी, इडली-सांभर, ढोकला और मिस्सी रोटी हर भारतीय रसोई में हैं। वज़न से 3:1 अनाज-दाल अंडे जैसा अमीनो एसिड पैटर्न देता है।',
 'वैज्ञानिक DIAAS से गुणवत्ता नापते हैं। दूध का प्रोटीन और अंडा लगभग 1.0 या ऊपर; सोया लगभग 0.9; अकेला साबुत गेहूँ लगभग 0.45, अकेली दालें 0.6–0.8, दोनों साथ लगभग 0.8–0.9। साथ खाने से जो उछाल आता है वही परंपरागत जोड़ियों का पूरा मतलब है।',
 'पाचनीयता भी मायने रखती है। पौधों का प्रोटीन रेशे और फ़ाइटेट में लिपटा आता है; पकाना, भिगोना, अंकुरित करना और ख़मीर उसे खोलते हैं। अंकुरित मूंग कच्चे से ज़्यादा उपयोगी प्रोटीन देता है; ढोकला सादे बेसन से ज़्यादा।',
 'ICMR का RDA 0.83 ग्राम/किलो अच्छी गुणवत्ता के प्रोटीन के लिए गिना गया है। भारतीय अनाज-दाल आहार कम गुणवत्ता देता है, इसलिए ICMR स्वयं नोट करता है कि ऐसे आहार में लगभग 1 ग्राम/किलो उचित लक्ष्य है — और यही इस ऐप का डिफ़ॉल्ट नियम है। गर्भावस्था में 10–20 ग्राम, स्तनपान में 15–20 जोड़ें, वज़न घटाते समय 1.2 ग्राम/किलो करें ताकि मांसपेशी बचे।',
 'मांसपेशी — जिसकी ज़्यादातर लोगों को चिंता है — दिन में बँटे हर भोजन में 20–30 ग्राम प्रोटीन और प्रतिरोधी काम — उठाना, चढ़ना, उठक-बैठक, पोते को गोद लेना — से अच्छी रहती है। मांसपेशी इस्तेमाल किए बिना खाया प्रोटीन ज़्यादातर महँगे ईंधन की तरह जलता है।',
 'व्यावहारिक नियम: हर भोजन में दाल या दूध-दही या अंडा, अनाज और दाल साथ, जब हो सके अंकुरित करें और ख़मीर लाएँ, और पूरक सिर्फ़ तब जब खाना सही करने के बाद नपी हुई कमी बचे।'],},
{id:'ironchem',t:'आयरन: रसायन का पाठ',min:7,body:[
 'खाने में आयरन दो रूपों में आता है। हीम आयरन — मांस, मछली, मुर्ग़ी से — बाक़ी खाने की लगभग परवाह किए बिना 15–35% सोखा जाता है। नॉन-हीम — शाकाहारी आहार का सब — 2–10% सोखा जाता है, और वह आँकड़ा बाक़ी भोजन के साथ झूलता है।',
 'नॉन-हीम आयरन ज़्यादातर फ़ेरिक (Fe³⁺) होता है और आँत की दीवार पार करने के लिए फ़ेरस (Fe²⁺) बनना पड़ता है। पेट का एसिड शुरू करता है; विटामिन C पूरा करता है और आयरन को घोल में रखता है। "दाल के साथ नींबू" का रसायन यही है: 50 मिग्रा विटामिन C — आधा आँवला, एक अमरूद, एक संतरा — उसी थाली से सोखा आयरन दोगुना कर सकता है।',
 'रोकने वाले बाँधकर काम करते हैं। साबुत अनाज-दाल का फ़ाइटेट, चाय-कॉफ़ी के टैनिन और पॉलीफ़िनॉल, दूध-दही-गोली का कैल्शियम आँत में आयरन बाँध लेते हैं और वह बेकार निकल जाता है। खाने के साथ चाय सोखना 60–70% घटाती है। भिगोना, अंकुरित करना, ख़मीर फ़ाइटेट तोड़ते हैं — परंपरागत तरीक़े आयरन की तकनीक हैं।',
 'सोखने के बाद आयरन फ़ेरिटिन के रूप में जमा होता है। फ़ेरिटिन जाँच भंडार दिखाती है; हीमोग्लोबिन सिर्फ़ घूमता हुआ। भंडार पहले, चुपचाप ख़ाली होता है; हीमोग्लोबिन अंत में गिरता है। इसलिए सामान्य हीमोग्लोबिन वाली स्त्री का भंडार ख़ाली हो सकता है, और इसलिए गर्भावस्था में 30 से नीचे फ़ेरिटिन का इलाज एनीमिया दिखने से पहले होता है। एक चेतावनी: संक्रमण और सूजन में फ़ेरिटिन बढ़ता है, इसलिए बीमार मरीज़ का सामान्य मान कमी छुपा सकता है।',
 'स्त्रियाँ क्यों? महीने में 10–40 मिग्रा मासिक हानि, नौ महीने में बच्चे-प्लेसेंटा-अतिरिक्त ख़ून के लिए लगभग 1000 मिग्रा माँगती गर्भावस्था, और चाय के साथ अनाज-आधारित आहार। भारतीय स्त्रियों के लिए 29 मिग्रा RDA 8% सोखना मानता है; दिन का खाना शायद ही पहुँचे, इसलिए गोली सामान्य।',
 'गोली का अपना रसायन है। सोखना ख़ाली पेट विटामिन C के साथ, चाय-दूध-कैल्शियम से दो घंटे दूर सबसे अच्छा। हाल के अध्ययन दिखाते हैं कि एक दिन छोड़कर गोली रोज़ से ज़्यादा प्रति गोली सोखी जाती है, क्योंकि हर ख़ुराक के बाद आँत का हार्मोन हेप्सिडिन बढ़ता है और अगली रोकता है; जहाँ दुष्प्रभाव रोज़ की गोली रोकते हैं वहाँ यह मानक सलाह बन रही है।',
 'एक पंक्ति में पाठ: आयरन संगत की बात है — नींबू मदद करता है, चाय और दूध रोकते हैं, हीमोग्लोबिन से भंडार ज़्यादा मायने रखता है, और गोली भी रसायन है।'],},
{id:'glucose',t:'ग्लूकोज़, इंसुलिन और ग्लाइसेमिक इंडेक्स',min:8,body:[
 'हर रोटी, चावल का हर दाना, हर केला ख़ून में ग्लूकोज़ बनकर पूरा होता है। सवाल यह कि कितनी तेज़ी से आए और एक बार में कितना, क्योंकि दोनों तय करते हैं कि अग्न्याशय को कितना काम करना है और उछाल का कितना हिस्सा चर्बी बनेगा।',
 'ग्लाइसेमिक इंडेक्स (GI) गति नापता है: खाने के 50 ग्राम कार्बोहाइड्रेट के बाद शुगर कितनी चढ़े, शुद्ध ग्लूकोज़ = 100 के सामने। मैदा, सफ़ेद ब्रेड, कॉर्नफ़्लेक्स, पोहा, साबूदाना, आलू ऊपर (70+); साबुत गेहूँ, बाजरा, ज्वार, ओट्स, दलिया बीच में (50–65); दाल, चना, राजमा, ज़्यादातर फल, दूध नीचे (50 से कम)। रेशा, प्रोटीन, चर्बी और खटास सब चढ़ाई धीमी करते हैं — इसलिए रोटी से पहले दाल, चावल के साथ दही और सब पर नींबू मदद करते हैं।',
 'अकेला GI भ्रम देता है, क्योंकि वह मात्रा नज़रअंदाज़ करता है। ग्लाइसेमिक लोड (GL) गति को मात्रा से गुणा करता है। तरबूज़ का GI ऊँचा पर एक फाँक में सिर्फ़ 6 ग्राम कार्बोहाइड्रेट — कम लोड। अब उसका रस निकालें। आप दो मिनट में पूरा तरबूज़ पी सकते हैं; पूरा खा कभी नहीं सकते। रस में पाँच फाँकों की चीनी, रेशा कूड़े में, और लोड एक साथ अग्न्याशय पर पड़ता है। वही खाना, वही GI, पाँच गुना लोड, ब्रेक बिल्कुल नहीं। **फल खाने के लिए हैं। पानी पीने के लिए है।** यही गणित हर जूस पर लागू, "हेल्दी" समेत।',
 'इंसुलिन वह हार्मोन जो ग्लूकोज़ को ख़ून से मांसपेशी, लिवर और चर्बी में ले जाता है। इंसुलिन प्रतिरोध — टाइप 2 डायबिटीज़, PCOS, मोटापा और हर स्त्री के लिए गर्भावस्था का उत्तरार्ध — यानी कोशिकाएँ दस्तक का जवाब धीरे देती हैं; अग्न्याशय ज़ोर से बोलता है; ग्लूकोज़ ज़्यादा देर ऊँचा रहता है। गर्भावस्था यह जानबूझकर करती है: प्लेसेंटा के हार्मोन इंसुलिन मंद करते हैं ताकि बच्चे की ओर ज़्यादा ग्लूकोज़ बहे। ज़्यादातर स्त्रियों में अग्न्याशय निभा लेता है; न निभाए तो गर्भावस्था का डायबिटीज़ दिखता है, आमतौर पर 24 हफ़्ते बाद, इसलिए जाँच तब।',
 'दो औज़ार बिना दवा काम करते हैं। पहला, कार्बोहाइड्रेट पाँच-छह बार में बाँटने से हर लोड छोटा रहता है। दूसरा, खाने के बाद मांसपेशी चलाना: सिकुड़ती मांसपेशी इंसुलिन के बिना अलग दरवाज़े से ग्लूकोज़ खींचती है। खाने के बाद 10–15 मिनट चलने से कई अध्ययनों में भोजन के बाद का शिखर 20–30 mg/dL घटता है — गोली जैसा। खाने के बाद बैठे रहना सबसे बुरा; लेट जाना उसमें एसिडिटी जोड़ता है।',
 'गर्भावस्था के डायबिटीज़ में लक्ष्य कड़े — ख़ाली पेट 95 से नीचे, खाने के दो घंटे बाद 120 से नीचे — क्योंकि बच्चा माँ के ग्लूकोज़ पर बढ़ता है और ज़्यादा पर ज़्यादा बड़ा होता है। कार्बोहाइड्रेट रोज़ लगभग 175 ग्राम से नीचे न जाए, बच्चे का दिमाग़ उस पर चलता है; तरकीब बँटवारा और गुणवत्ता है, प्रतिबंध नहीं। सोने से पहले प्रोटीन वाला नाश्ता रात के उपवास को कीटोन बनाने से रोकता है।',
 'GI जो नहीं बताएगा: खाने की अच्छाई। चर्बी के कारण आइसक्रीम का GI बाजरे की रोटी से कम। GI एक सुई है। थाली — पहले सब्ज़ी, हर भोजन में दाल, साबुत अनाज, नपा तेल, तरल चीनी नहीं — पूरा यंत्र है।'],},
{id:'pregphys',t:'गर्भावस्था का शरीरविज्ञान थाली में',min:8,body:[
 'गर्भावस्था पूर्ण काल तक लगभग 12 किलो नई सामग्री बनाती है: 3 किलो बच्चा, 0.6 किलो प्लेसेंटा, 0.8 किलो पानी, 1 किलो गर्भाशय और स्तन, 1.5 किलो अतिरिक्त ख़ून, 1.5 किलो अतिरिक्त द्रव, और स्तनपान के भंडार के रूप में 3–4 किलो माँ की चर्बी। उसका हर ग्राम थाली से बनता है। बढ़ना वैकल्पिक नहीं; वह निर्माण है।',
 'ख़ून की मात्रा लगभग डेढ़ गुनी होती है। प्लाज़्मा — पानी वाला हिस्सा — लाल कोशिकाओं से ज़्यादा बढ़ता है, इसलिए पूरी तरह पोषित स्त्री में भी हीमोग्लोबिन की सघनता गिरती है। इसलिए दूसरी तिमाही में एनीमिया की सीमा 10.5 हो जाती है और 20 हफ़्ते पर 11 सामान्य है, कम नहीं। पर असली आयरन की ज़रूरत लगभग दोगुनी: रोज़ 27 मिग्रा, जिसमें गर्भावस्था में लगभग 1000 मिग्रा बच्चे, प्लेसेंटा और नई लाल कोशिकाओं में जाता है। खाना अकेला शायद ही दे, इसलिए हर जगह आयरन की गोली।',
 'फोलेट — विटामिन B9 — गर्भधारण के बाद पहले 28 दिनों में, अक्सर गर्भ पता चलने से पहले, बच्चे की रीढ़ और दिमाग़ की नली बंद करता है। उस अंतराल में कमी से रीढ़ की विकृति होती है। इसलिए गर्भ की योजना बनाती हर स्त्री को और पहले बारह हफ़्ते फोलिक एसिड दिया जाता है, और इसलिए ऐप पहले हफ़्ते से गर्भावस्था का फोलेट लक्ष्य लेता है, चौदहवें से नहीं। साग, दाल, चना मदद करते हैं; गोली अनिवार्य।',
 'कैल्शियम की ज़रूरत 1000 मिग्रा ही रहती है, जो हैरान करता है, क्योंकि बच्चे का कंकाल लगभग 30 ग्राम लेता है। शरीर आँत से कैल्शियम सोखना लगभग दोगुना करके जवाब देता है — हार्मोनल समायोजन जो खाने में सोखने लायक कैल्शियम हो तो मुफ़्त। दूध, दही, रागी, तिल या साग कम हों तो बच्चा माँ की हड्डियों से कैल्शियम लेता है। 14 हफ़्ते से भारतीय गोली इसलिए कि वह आहार आम है, और कम सेवन वाली स्त्रियों में कैल्शियम प्री-एक्लेम्प्सिया का ख़तरा भी घटाता है।',
 'कैलोरी: पहली तिमाही में अतिरिक्त नहीं, दूसरी-तीसरी में लगभग 350 — एक गिलास दूध और मुट्ठी चना, या दाल के साथ एक अतिरिक्त रोटी। "दो के लिए" खाना बढ़त दोगुनी करता है, और अतिरिक्त माँ पर चर्बी बनकर बैठता है, गर्भावस्था के डायबिटीज़, बड़े बच्चों और कठिन प्रसव के ख़तरों के साथ। सामान्य शुरुआती वज़न पर 10–12 किलो, ज़्यादा वज़न पर 5–9।',
 'प्रोटीन: दूसरी तिमाही में लगभग 10 ग्राम और तीसरी में 20 ज़्यादा, क्योंकि बच्चे की बढ़त देर से गति पकड़ती है। अनाज के आहार में यह रोज़ एक अतिरिक्त कटोरी दाल और दही।',
 'प्रोजेस्टेरोन के तहत आँत धीमी पड़ती है — इसलिए क़ब्ज़, एसिडिटी और मितली। थोड़ा, बार-बार; रेशा और पानी; मितली के लिए सुबह सूखा अनाज; एसिडिटी के लिए रात देर कुछ बड़ा नहीं। थोड़ा-बार-बार परंपरा नहीं; धीमी आँत का जवाब है।',
 'और दूर क्या रखें: कच्चा-अधपका खाना, कच्चा दूध (लिस्टेरिया प्लेसेंटा पार करता है), कच्चे अंकुर, लिवर और विटामिन A की बड़ी ख़ुराक (ज़्यादा में विकृति), शराब (सुरक्षित मात्रा नहीं), बड़ी शिकारी मछली (पारा), दो छोटे कप से ज़्यादा चाय-कॉफ़ी।'],},
{id:'milk',t:'माँ का दूध खाने के रूप में',min:6,body:[
 'मानव दूध लगभग 87% पानी, 7% लैक्टोज़, 4% चर्बी और 1% प्रोटीन, साथ खनिजों, विटामिनों, एंटीबॉडी, हार्मोन और जीवित कोशिकाओं की लंबी सूची। चार महीने पर माँ रोज़ लगभग 750 मिली बनाती है। उस दूध की कैलोरी और बनाने की लागत रोज़ लगभग 600 कैलोरी — गर्भावस्था ने कभी नहीं माँगा उतना।',
 'शरीर उसका हिस्सा गर्भावस्था में रखी चर्बी से पूरा करता है, इसलिए स्तनपान कराती स्त्रियाँ बिना कोशिश धीरे वज़न उतारती हैं। बाक़ी खाना पड़ता है। स्तनपान कराती माँ शारीरिक कारण से भूखी है; उसे खिलाना बच्चे को खिलाना है।',
 'माँ जो खाए वह कुछ बदलता है, कुछ नहीं। दूध में प्रोटीन और लैक्टोज़ लगभग स्थिर; कम खाती माँ लगभग सामान्य गुणवत्ता का पर कम दूध बनाती है, और कमी अपने शरीर से लेती है। चर्बी की मात्रा दूध पिलाने और दिन में बदलती है; चर्बी का प्रकार माँ के आहार का अनुसरण करता है — मछली, तिल, अखरोट का ओमेगा-3 दूध में दिखता है। पानी में घुलने वाले विटामिन और B12 सेवन का नज़दीकी अनुसरण करते हैं: B12 कम शाकाहारी माँ B12-कम दूध बनाती है, और बच्चा महीनों में कमी पाता है। भारतीय शाकाहारी माँओं के लिए बच्चे की ख़ातिर लेने लायक यही एक पूरक है।',
 'कैफ़ीन दूध में कम मात्रा में जाता है; रोज़ तीन कप से कम सुरक्षित। शराब खुलकर जाती है और ख़ून की गति से निकलती है — पेग पर लगभग दो घंटे; बचना सबसे आसान। निकोटीन, ज़्यादातर नशीले पदार्थ और थोड़ी दवाएँ जाती हैं; कोई भी पर्ची फ़ार्मासिस्ट जाँच सकता है।',
 'क्या नहीं जाता: खाने की "गर्मी" या "ठंडक", मसाले, पत्तागोभी या दाल की "गैस"। स्वाद हल्के से जाते हैं, और बच्चे स्वीकारते हैं। नई माँ के लिए वर्जित खानों की लंबी परंपरागत सूचियों का दूध के रसायन में कोई आधार नहीं और वे उसी से दाल, सब्ज़ी और फल ले लेती हैं जिसे सबसे ज़्यादा चाहिए।',
 'तरल: हर बार दूध पिलाते समय एक गिलास पानी या दूध पर्याप्त; लीटर ठूँसने से दूध नहीं बढ़ता। आयरन और कैल्शियम जारी; ICMR कैल्शियम 1200 मिग्रा और पहले छह महीने प्रोटीन सामान्य से लगभग 17 ग्राम ज़्यादा रखता है।',
 'डाइट चर्बी घटाने से पहले दूध घटाती है। स्तनपान और सामान्य खाने से छह से बारह महीने में वज़न ठहरता है। धीरज ही शरीरविज्ञान है।'],},
{id:'fibre',t:'रेशा और आँत',min:6,body:[
 'रेशा पौधों के खाने का वह हिस्सा जो आपके एंज़ाइम पचा नहीं सकते। सदी तक इसे निष्क्रिय माना गया — "चोकर"। अब स्पष्ट है कि यह बड़ी आँत के खरबों बैक्टीरिया को खिलाता है, और वे उससे जो बनाते हैं वह पूरे शरीर तक पहुँचता है।',
 'दो प्रकार। अघुलनशील रेशा — गेहूँ का चोकर, सब्ज़ियों के छिलके, साबुत अनाज का खोल — पानी और आयतन पकड़ता है, आँत चलाता है। घुलनशील रेशा — ओट्स, दाल, चना, फल, अलसी, इसबगोल — जेल बनता है जो ग्लूकोज़ और चर्बी का सोखना धीमा करता है और बैक्टीरिया उसे छोटी-श्रृंखला फ़ैटी एसिड में ख़मीर करते हैं: एसीटेट, प्रोपियोनेट, ब्यूटिरेट।',
 'ब्यूटिरेट बड़ी आँत की दीवार की कोशिकाओं को खिलाता है और अवरोध कसा रखता है; प्रोपियोनेट लिवर को कम ग्लूकोज़ बनाने का संकेत देता है; एसीटेट दिमाग़ तक पहुँचता है और भूख पर असर करता है। अच्छे खिलाए बैक्टीरिया सूजन करने वाली प्रजातियों को बाहर करते हैं। कम रेशे का आहार दिनों में इस व्यवस्था को भूखा मार देता है।',
 'ICMR 2000 कैलोरी पर लगभग 30 ग्राम रेशे की सिफ़ारिश करता है। सामान्य परिष्कृत भारतीय आहार 10–15 देता है। अंतर यही है: साबुत दाल और दाल का पानी, रोटी और मैदा, फल और जूस, मुख्य व्यंजन के रूप में सब्ज़ी और सजावट के रूप में सब्ज़ी के बीच का फ़र्क़। हर कटोरी साबुत दाल 4–6 ग्राम; पकी सब्ज़ी की कटोरी 3–4; एक फल 2–3; बाजरे की रोटी 3।',
 'ख़मीर वाले खाने कहानी का दूसरा आधा हिस्सा। दही, छाछ, ढोकला, इडली, डोसा, खमण, कांजी और अचार में जीवित बैक्टीरिया या उनके उत्पाद। ख़मीर अनाज-दाल को पहले से पचाता है, फ़ाइटेट तोड़ता है (आयरन-ज़िंक मुक्त करता है) और B विटामिन बनाता है। गुजराती थाली यहाँ अनायास उत्कृष्ट — जब तक ख़मीर वाला खाना भाप में पका हो, तला नहीं।',
 'रेशा धीरे बढ़ाएँ, हफ़्तों में, पानी के साथ। गैस बैक्टीरिया का उत्सव है; आबादी बदलते ही शांत हो जाती है। गर्भावस्था में प्रोजेस्टेरोन की धीमी आँत का जवाब रेशा और पानी हैं, किसी भी दवा से बेहतर।'],},
{id:'tables',t:'खाने की तालिका कैसे बनती है',min:6,body:[
 'इस ऐप में कच्चे खाने का हर आँकड़ा हैदराबाद के ICMR–NIN द्वारा प्रकाशित Indian Food Composition Tables 2017 से है। वे कैसे बनीं यह जानने से पता चलता है तीसरे दशमलव पर कितना भरोसा करें।',
 'टीम ने भारत के छह क्षेत्रों से 528 खाने लिए, हर खाना हर क्षेत्र के कई बाज़ारों से, अलग मौसमों में, और नमूने मिलाए ताकि तालिका की एक पंक्ति देश का औसत हो, एक दुकान का नहीं। हर मिला नमूना प्रयोगशाला में विश्लेषित हुआ — अनुमान नहीं — लगभग 150 घटकों के लिए: कैलोरी, प्रोटीन, चर्बी, कार्बोहाइड्रेट, रेशा, हर खनिज, हर विटामिन, अमीनो एसिड, फ़ैटी एसिड, कैरोटिनॉइड, फ़ाइटेट, पॉलीफ़िनॉल।',
 'मान खाने योग्य हिस्से के 100 ग्राम, कच्चे के लिए हैं। "खाने योग्य" यानी छिलका, बीज, डंठल जो फेंकते हैं वे पहले ही हटे। "कच्चा" यानी पकाने से पहले। दुनिया भर में यह रिवाज़ है, क्योंकि पकाने से वज़न बदलता है — चावल पानी सोखकर तिगुना, पालक पानी खोकर आधा — पर पोषक तत्व ज़्यादातर रहते हैं। इस ऐप में व्यंजनों के मान कच्चे घटक जोड़कर बनते हैं, इसलिए व्यंजन की मात्रा "30 ग्राम कच्चा" कहलाती है हालाँकि आपके सामने की कटोरी पकी 100 ग्राम हो।',
 'पकाना क्या बदलता है: विटामिन C और फोलेट गर्मी और पानी में समय से घटते हैं; थायमिन खाने के सोडे से; आयरन और कैल्शियम अछूते; प्रोटीन और कैलोरी अछूते। तलना सोखा तेल जोड़ता है — ऐप उसे घटक के रूप में जोड़ता है। ख़मीर और अंकुरण मात्रा से ज़्यादा उपलब्धता बदलते हैं।',
 'दो तालिकाएँ असहमत हों — IFCT, USDA, लेबल — तो आमतौर पर क़िस्म, मिट्टी, मौसम या विधि। भारतीय गेहूँ में अमेरिकी से कम आयरन; भारतीय दूध गाय जितना भैंस का और ज़्यादा चर्बी वाला। इसलिए भारतीय तालिका मायने रखती है, और इसलिए ऐप IFCT चुनता है और लेबल के खानों को वैसा दर्शाता है।',
 'ईमानदार पढ़ाई: कैलोरी और मुख्य पोषक तत्व लगभग 10% तक अच्छे; खनिज 20%; विटामिन 30% या बुरे, क्योंकि ताज़गी से बहुत बदलते हैं। फोलेट लक्ष्य का 92% दिखाती योजना वास्तव में 70 और 115 के बीच कहीं है। पट्टियों को कम्पास की तरह लें, माइक्रोमीटर की तरह नहीं। दिशा भरोसेमंद; दशमलव नहीं।'],},
{id:'upf',t:'अति-प्रसंस्कृत खाना',min:7,body:[
 'ब्राज़ील के शोधकर्ताओं ने 2009 में खाने को पोषक तत्वों से नहीं बल्कि उसके साथ क्या किया गया इससे वर्गीकृत करने का प्रस्ताव दिया। NOVA प्रणाली में चार समूह। समूह 1: अप्रसंस्कृत या न्यूनतम — गेहूँ, दाल, सब्ज़ी, दूध, अंडे, मेवे। समूह 2: रसोई के घटक — तेल, घी, चीनी, नमक। समूह 3: प्रसंस्कृत — ब्रेड, चीज़, अचार, दही; समूह 1 + समूह 2। समूह 4: **अति-प्रसंस्कृत** — खाने से निकाले या बनाए पदार्थों से कारख़ाने में बने मिश्रण: परिष्कृत आटे और स्टार्च, प्रोटीन आइसोलेट, हाइड्रोजनेटेड तेल, चीनी और सिरप, और रंग-स्वाद-बनावट-टिकाऊपन के लिए योजक। बिस्कुट, चिप्स, मैगी, कोल्ड ड्रिंक, कॉर्नफ़्लेक्स, "हेल्थ" ड्रिंक, पैकेट का नमकीन, आइसक्रीम, ज़्यादातर ब्रेड-बेकरी।',
 'कैलोरी समान हो तो वर्ग क्यों मायने रखता है? क्योंकि समान कैलोरी के आहारों की तुलना करने वाले बड़े अध्ययनों ने पाया कि अति-प्रसंस्कृत समूह खुलकर खाने देने पर रोज़ लगभग 500 कैलोरी ज़्यादा खाता है, वज़न बढ़ाता है और ख़ून के मार्कर बुरे दिखाता है। खाना तेज़ी से और मात्रा में खाए जाने के लिए इंजीनियर किया गया: नरम, एकसमान, चबाना नहीं, नमक-चीनी-चर्बी उस अनुपात में जो तृप्ति का संकेत बंद करता है।',
 'बिस्कुट और रोटी में समान कैलोरी हो सकती है। रोटी चबाने में दो मिनट, दाल के साथ आती है, और आपको रोकती है। बिस्कुट दस सेकंड, बारह के पैकेट में आता है, और अगला माँगता है। समान कैलोरी, घंटे बाद अलग भूख।',
 'लेबल उद्योग का जवाब हैं, और वे कमज़ोर हैं। "हाई प्रोटीन" = बिस्कुट में प्रोटीन आइसोलेट मिलाया। "आयरन-विटामिन युक्त" = जिस खाने में कुछ न हो उस पर कुछ मिलीग्राम छिड़के — अनाज अब भी चीनी है। "चीनी नहीं मिलाई" = अक्सर फल का गाढ़ा, जो चीनी है। "मल्टीग्रेन" = कई परिष्कृत अनाज। "शुगर-फ्री" = माल्टिटोल और मैदा। जिस पैकेट को सात दावे चाहिए वह आपको कुछ बता रहा है।',
 'भारतीय रसोई में रेखा सरल। आपकी दादी उसे खाने के रूप में पहचानें और वह हफ़्ते में ख़राब हो जाए, तो समूह 1–3। साल भर टिके, दुकान में न मिलने वाले घटकों की सूची हो, और पैकेट पर कार्टून हो, तो समूह 4। पैकेट का सूखा नाश्ता — चिवड़ा, चवाणू — गुजराती नाम वाला समूह 4।',
 'व्यावहारिक नियम शून्य नहीं। वह है: अति-प्रसंस्कृत खाना कभी-कभार मज़े के लिए, रोज़ के भोजन या नाश्ते के रूप में कभी नहीं, बच्चे के नाश्ते के रूप में कभी नहीं, और जिस खाने की वह नक़ल करता है उससे कभी भ्रमित न हों। ताज़ा फल, भुने चने, मुट्ठी मूंगफली, दही, खाखरा — ये नाश्ते पैकिंग से पहले थे, और अब भी काम करते हैं।'],},
];

/* plate group of a food */
function plateGroup(f){if(['X_icecream','X_amulkool','X_cheese'].includes(f.id))return f.id==='X_cheese'?'milk':'sugar';if(f.id==='X_sev'||f.id==='X_maggi'||f.id==='X_marie')return f.id==='X_sev'?'oil':'cereal';if(f.g==='cer')return 'cereal';if(f.g==='leg'||f.g==='egg'||f.g==='poul'||f.g==='meat'||f.g==='fish')return 'pulse';if(f.g==='glv')return 'glv';if(f.g==='veg')return 'vegg';if(f.g==='root')return 'root';if(f.g==='fru')return 'fruit';if(f.g==='milk')return 'milk';if(f.g==='nut')return 'nuts';if(f.g==='fat')return 'oil';if(f.g==='sug')return 'sugar';return null}
/* ICMR My Plate for 2000 kcal, scaled by energy; grams raw */
function plateTargets(kcal,p){p=p||S.profile;const k=kcal/2000;const gdm=p.cond&&(p.cond.gdm);const cerK=(gdm||(p.cond&&p.cond.pcos))?0.9:1;return {cereal:[250*k*cerK,'g'],pulse:[85*k,'g'],vegg:[400,'g'],glv:[100,'g'],fruit:[100,'g'],milk:[p.stage==='lact'?400:300,'ml'],nuts:[35*Math.min(k,1.3),'g'],oil:[27*k,'g'],sugar:[gdm?0:Math.min(25,25*k),'g']}}
const PLATE_ORDER=['vegg','glv','fruit','cereal','pulse','milk','nuts','oil','sugar'];
const JUNK=new Set(['r_samosa','r_kachori','r_vadapav','r_bhajiya','r_fafda','r_methigota','r_meduvada','r_puri','r_maggi','r_icecream','r_sheera','r_lapsi','r_mohanthal','r_sukhdi','r_basundi','r_shrikhand','r_gajarhalwa','r_kheer','r_puranpoli','r_chikki','r_lassi','r_mangoshake','r_cornflakes','r_breadbutter','r_pavbhaji','r_chai','r_coffee','r_nimbupani','r_dryfruitladdu']);
let S={learn:{layer:'basics',open:null,done:{},ans:{}},lang:'en',profile:{name:'',sex:'f',age:30,ht:155,wt:60,preWt:null,stage:'adult',weeks:20,months:2,act:'sed',diet:'veg',cond:{}},days:{},weights:[],tab:'me',q:'',setup:false};
function load(){try{const a=JSON.parse(localStorage.getItem(KEY)||'null');if(a)S=Object.assign(S,a)}catch(e){}const nl=(navigator.language||'').toLowerCase();if(!S.setup){S.lang=nl.startsWith('gu')?'gu':nl.startsWith('hi')?'hi':'en'}}

/* --- targets --- */
function bmi(){const p=S.profile;const w=p.stage==='preg'&&p.preWt>0?p.preWt:p.wt;return w>0&&p.ht>0?w/((p.ht/100)**2):null}
function targets(){const p=S.profile,ref=REF_DEFAULT;const w=(p.stage==='preg'&&p.preWt>0?+p.preWt:+p.wt)||55;const b=bmi();const rmr=10*w+6.25*(+p.ht||155)-5*(+p.age||30)+(p.sex==='m'?5:-161);const pal={sed:1.375,mod:1.55,heavy:1.725}[p.act]||1.375;let kcal=rmr*pal,addP=0;
 if(p.stage==='preg'){const tri=p.weeks>=28?3:p.weeks>=14?2:1;if(tri>=2){kcal+=(b!==null&&b<18.5)?450:350;addP=tri===3?22:9.5}}
 if(p.stage==='lact'){kcal+=p.months>=6?520:600;addP=p.months>=6?13.2:16.9}
 if((p.stage==='preg'||p.stage==='lact')&&b!==null&&b>=30){const ibw=23*((p.ht/100)**2);const wm=ibw+0.25*(w-ibw);kcal=(10*wm+6.25*(+p.ht||155)-5*(+p.age||30)+(p.sex==='m'?5:-161))*pal+(kcal-rmr*pal)}
 const age=+p.age||30;if((p.stage==='adult'||p.stage==='precon')&&b!==null&&b>=25&&age>=18&&age<=60)kcal=Math.max(1200,kcal-Math.min(500,kcal*0.15));if((p.stage==='adult'||p.stage==='precon')&&b!==null&&b<18.5)kcal+=300;
 const w23=23*((p.ht/100)**2);const refW=(b!==null&&b>=25)?w23+0.4*(w-w23):(b!==null&&b<18.5)?18.5*((p.ht/100)**2):w;const prot=Math.max(refW*1.0,refW*0.83)+addP;
 return {kcal:Math.round(kcal/10)*10,p:Math.round(prot),plate:plateTargets(Math.round(kcal/10)*10,p)}}

function plateSums(items){const s={root:0};PLATE_ORDER.forEach(k=>s[k]=0);let kcal=0,prot=0;for(const it of items)for(const [f,g] of itemNut(it)){if(!f)continue;const pg=plateGroup(f);if(pg){s[pg]+=g;if(pg==='glv')s.vegg+=g}if(f.v[0])kcal+=f.v[0]*g/100;if(f.v[1])prot+=f.v[1]*g/100}return {s,kcal,prot}}
function plateScore(items){const tg=targets().plate,{s}=plateSums(items);const W={vegg:2,pulse:1.5,fruit:1,milk:1,cereal:1,nuts:0.5,oil:1.5,sugar:1.5};let pts=0,n=0;
 for(const k of ['vegg','pulse','fruit','milk','nuts']){n+=W[k];const r=s[k]/tg[k][0];pts+=W[k]*(r>=0.8?1:r>=0.4?0.5:0)}
 {const r=s.cereal/tg.cereal[0];n+=W.cereal;pts+=W.cereal*(r>=0.5&&r<=1.1?1:(r>0.25&&r<=1.4)?0.5:0)}
 for(const k of ['oil','sugar']){n+=W[k];pts+=W[k]*(s[k]<=tg[k][0]?1:s[k]<=tg[k][0]*1.5?0.5:0)}
 const junk=items.filter(it=>it.t==='r'&&JUNK.has(it.id)&&!['r_chai','r_coffee','r_nimbupani'].includes(it.id)).reduce((a,it)=>a+it.q,0);
 return Math.max(0,Math.round(100*pts/n-Math.min(30,8*junk)))}
function dietOk(r){const d=S.profile.diet;if(d==='nonveg')return true;if(d==='egg')return r.d!=='nonveg';if(r.d!=='veg')return false;if(d==='jain'){const bad=['G017','G018','G011','G012','G013','F006','F007','F008','F001','F002','F003','F004','F005','F013','F014','F015','F017','F018','F019','F009','F010','F011','F012','D058'];return r.it.every(([id])=>!bad.includes(id))}return true}
function searchDishes(q){q=q.toLowerCase().trim();const out=[];for(const r of RECIPES){if(!dietOk(r))continue;if(q&&!(r.en+' '+r.tags+' '+r.gu+' '+r.hi).toLowerCase().includes(q))continue;out.push({t:'r',id:r.id,name:S.lang!=='en'&&r[S.lang]?r[S.lang]:r.en,sub:r.por})}

 return out.slice(0,40)}
const QUICK=['r_rotli','r_rice','r_tuvardal','r_moongdal','r_bhindi','r_mixveg','r_salad','r_curd','r_chaas','r_milk','r_chai','r_thepla','r_poha','r_khichdi','r_fruitbowl','r_roastedchana','r_nuts','r_boiledegg','r_paneerbhurji','r_dhokla','r_sprouts','r_chole','r_khakhra','r_bajrarotla'];
function localPortion(s){if(S.lang==='en')return s;const M=t('unit');return s.replace(/\bkatori\b/g,M.katori).replace(/\bglass\b/g,M.glass).replace(/\bcup\b/g,M.cup).replace(/\btsp\b/g,M.tsp).replace(/\btbsp\b/g,M.tbsp).replace(/\bpieces?\b/g,M.piece).replace(/\bplate\b/g,M.plate).replace(/\bbowl\b/g,M.bowl).replace(/\bhandful\b/g,M.handful).replace(/\bslices?\b/g,M.slice)}

function render(){document.documentElement.lang=S.lang;$('appName').textContent=t('app');$('tag').textContent=t('tag');$('foot').textContent=t('installed')+' · '+t('dis');
 $('nav').innerHTML=[['me','👤',t('me')],['today','🍽️',t('today')],['learn','📖',t('learn')],['progress','📈',t('progress')]].map(([k,i,n])=>`<button class="nb ${S.tab===k?'on':''}" data-tab="${k}"><span>${i}</span>${n}</button>`).join('');
 $('langs').innerHTML=['en','gu','hi'].map(l=>`<button class="lb ${S.lang===l?'on':''}" data-lang="${l}">${{en:'EN',gu:'ગુ',hi:'हि'}[l]}</button>`).join('');

function fld(label,key,val,type='number',attrs=''){return `<label class="f"><span>${label}</span><input type="${type}" data-k="${key}" value="${esc(val??'')}" ${attrs}></label>`}
function seg(key,val,opts){return `<div class="seg" data-seg="${key}">${opts.map(([v,n])=>`<button class="${String(val)===String(v)?'on':''}" data-v="${v}">${n}</button>`).join('')}</div>`}
function renderMe(){const p=S.profile,b=bmi(),tg=targets();const bcls=b===null?'':b<18.5?'bmiU':b<23?'bmiN':b<25?'bmiO':'bmiOb';
 const pl=p.stage==='preg'||p.stage==='lact';const needPre=p.stage==='preg'&&!(p.preWt>0);
 return `<section class="card">${fld(t('name'),'name',p.name,'text','maxlength="40"')}<div class="g2">${fld(t('age'),'age',p.age,'number','min="10" max="100"')}<label class="f"><span>${t('sex')}</span>${seg('sex',p.sex,[['f',t('f')],['m',t('m')]])}</label>${fld(t('ht'),'ht',p.ht,'number','min="100" max="220"')}${fld(t('wt'),'wt',p.wt,'number','min="20" max="250" step="0.1"')}</div>
 <label class="f"><span>${t('stage')}</span>${seg('stage',p.stage,p.sex==='m'?[['adult',t('adult')]]:[['adult',t('adult')],['precon',t('precon')],['preg',t('preg')],['lact',t('lact')]])}</label>
 ${p.stage==='preg'?`<div class="g2">${fld(t('weeks'),'weeks',p.weeks,'number','min="1" max="42"')}${fld(t('preWt'),'preWt',p.preWt,'number','min="20" max="250" step="0.1"')}</div>`:''}${p.stage==='lact'?fld(t('months'),'months',p.months,'number','min="0" max="24"'):''}
 <label class="f"><span>${t('act')}</span>${seg('act',p.act,[['sed',t('sed')],['mod',t('mod')],['heavy',t('heavy')]])}</label>
 <label class="f"><span>${t('diet')}</span>${seg('diet',p.diet,[['veg',t('veg')],['jain',t('jain')],['egg',t('egg')],['nonveg',t('nonveg')]])}</label>
 <label class="f"><span>${t('cond')}</span><div class="chips">${['gdm','htn','anaemia','pcos'].map(c=>`<button class="chip ${p.cond[c]?'on':''}" data-cond="${c}" ${c==='pcos'&&p.sex==='m'?'disabled title="Not applicable"':''}>${t(c)}</button>`).join('')}</div></label></section>
 <section class="card"><div class="big"><span>${t('bmi')}${p.stage==='preg'&&p.preWt>0?' <small class="muted">('+t('preWt').split(' (')[0]+')</small>':''}</span><b>${needPre?'—':fmt(b,1)}</b></div>${needPre?`<p class="small muted">${t('needPre')}</p>`:pl?`<p class="${bcls==='bmiN'?'bmiN':''}">${bcls==='bmiU'?t('bmiU'):bcls==='bmiN'?t('bmiN'):t('plNoLoss')}</p>${p.stage==='preg'&&b!==null?`<p class="small">${gainText(b)}</p>`:''}`:`<p class="${bcls}">${bcls?t(bcls):''}</p>`}${p.stage==='preg'?`<p class="small muted">${t('pregTip')}</p>`:''}${(+p.age<18)?`<p class="small muted">${t('young')}</p>`:''}${(+p.age>60)?`<p class="small muted">${t('old')}</p>`:''}</section>
 <section class="card"><h3>${t('targets')}</h3><div class="row2"><div class="kpi"><b>${tg.kcal}</b><span>${t('kcal')} (kcal)</span></div><div class="kpi"><b>${tg.p} g</b><span>${t('protein')}</span></div></div>
 <h3>${t('plate')}</h3><table class="pt">${PLATE_ORDER.map(k=>`<tr><td>${k==='glv'?'↳ '+t('glv'):t(k)}</td><td class="num">${k==='oil'||k==='sugar'?t('max')+' ':''}${fmt(tg.plate[k][0])} ${tg.plate[k][1]}${hint(k,tg.plate[k][0])}</td></tr>`).join('')}</table></section>`}
function cerealHint(g){const eq=Math.round(g/30);const mains=Math.max(1,Math.min(3,Math.round((eq-2)/2.6)));const ex={en:`e.g. breakfast (poha/upma/2 thepla) + ${mains} rotli and 1 ${t('unit').katori} rice at lunch and dinner. Counts rotli, rice, bajra, poha, bread — all cereals together.`,gu:`દા.ત. નાસ્તો (પૌંઆ/ઉપમા/૨ થેપલા) + બપોરે અને રાત્રે ${mains} રોટલી અને ૧ વાટકી ભાત. રોટલી, ભાત, બાજરી, પૌંઆ, બ્રેડ — બધું અનાજ ભેગું ગણાય.`,hi:`जैसे नाश्ता (पोहा/उपमा/2 थेपला) + दोपहर और रात को ${mains} रोटी और 1 कटोरी चावल। रोटी, चावल, बाजरा, पोहा, ब्रेड — सब अनाज मिलाकर।`};return ` (${eq} rotli-eq)<br>${ex[S.lang]||ex.en}`}
function gainText(b){const g=b<18.5?'12.5–18':b<23?'10–12':b<=27.5?'5–9':'5–9';const m={en:`Healthy total weight gain for this pregnancy: about ${g} kg (ICMR–NIN 2024${b<18.5?', IOM':''}).`,gu:`આ ગર્ભાવસ્થામાં કુલ વજન વધારો લગભગ ${g} કિલો યોગ્ય (ICMR–NIN 2024).`,hi:`इस गर्भावस्था में कुल वज़न बढ़ना लगभग ${g} किलो उचित (ICMR–NIN 2024)।`};return m[S.lang]||m.en}
function hint(k,g){const u=t('unit');const m={cereal:cerealHint(g),pulse:` ≈ ${Math.round(g/30)} ${u.katori} dal`,vegg:` ≈ ${Math.round(g/100)} ${u.katori}`,glv:` ≈ 1 ${u.katori}`,fruit:' ≈ 1',milk:` ≈ ${(g/150).toFixed(1).replace('.0','')} ${u.cup}`,nuts:` ≈ 1 ${u.handful}`,oil:` ≈ ${Math.round(g/5)} ${u.tsp}`,sugar:` ≈ ${Math.round(g/5)} ${u.tsp}`};return `<small class="muted">${m[k]||''}</small>`}
function renderToday(){const d=dayRec(),tg=targets(),{s,kcal,prot}=plateSums(d.items);const res=searchDishes(S.q);const quick=S.q?res:QUICK.map(id=>RECIPEMAP[id]).filter(r=>r&&dietOk(r)).map(r=>({t:'r',id:r.id,name:S.lang!=='en'&&r[S.lang]?r[S.lang]:r.en,sub:r.por}));
 const verdict=[];const low=[],high=[];for(const k of ['vegg','pulse','fruit','milk','nuts']){if(s[k]<tg.plate[k][0]*0.6)low.push(t(k))}for(const k of ['cereal','oil','sugar']){if(s[k]>tg.plate[k][0]*1.2)high.push(t(k))}
 return `<section class="card"><h3>${t('verdict')} · ${fmt(kcal)} kcal · ${fmt(prot)} g ${t('protein')}</h3><div class="plate">${PLATE_ORDER.filter(k=>k!=='glv').map(k=>{const r=Math.min(1.5,s[k]/tg.plate[k][0]);const over=(k==='oil'||k==='sugar'||k==='cereal')?r>1.15:false;return `<div class="pr"><span>${t(k)}</span><div class="bar"><i style="width:${Math.min(100,r*100)}%" class="${over?'over':r>=0.8?'ok':''}"></i></div><small>${fmt(s[k])}/${fmt(tg.plate[k][0])}</small></div>`}).join('')}</div>
 ${['gdm','htn','anaemia','pcos'].filter(c=>S.profile.cond[c]).map(c=>`<p class="small muted">• ${t('condTip')[c]}</p>`).join('')}
 <p class="vd">${!d.items.length?'':low.length||high.length?`${low.length?`<b>${t('more')}:</b> ${low.join(', ')}. `:''}${high.length?`<b>${t('less')}:</b> ${high.join(', ')}.`:''}`:t('good')}</p>
 <div class="row2"><label class="f"><span>${t('water')}</span><div class="seg"><button data-water="-1">−</button><b class="wv">${d.water||0}</b><button data-water="1">+</button></div></label><div class="f"><span>${t('score')}</span><b class="sc">${d.items.length?plateScore(d.items):'—'}</b></div></div></section>
 ${d.items.length?`<section class="card"><ul class="ate">${d.items.map((it,i)=>{const r=it.t==='r'?RECIPEMAP[it.id]:FOODMAP[it.id];const nm=it.t==='r'?(S.lang!=='en'&&r[S.lang]?r[S.lang]:r.en):r.n;return `<li><span>${esc(nm)} <small class="muted">${it.t==='r'?(it.q%1?it.q.toFixed(1):it.q)+' × '+esc(localPortion(r.por)):it.q+' g'}</small></span><span><button data-q="${i}" data-d="-0.5">−</button><button data-q="${i}" data-d="0.5">+</button><button data-del="${i}">×</button></span></li>`}).join('')}</ul><button class="btn ghost" data-act="clear">${t('clear')}</button></section>`:''}
 <section class="card"><h3>${t('tapAte')}</h3><input type="search" id="q" placeholder="${t('search')}" value="${esc(S.q)}"><div class="grid">${quick.map(x=>`<button class="dish" data-add="${x.t}:${x.id}:${x.g||1}"><b>${esc(x.name)}</b><small>${esc(localPortion(x.sub))}</small></button>`).join('')||'<p class="muted">—</p>'}</div></section>`}
const LEARN_SRC={en:{L:LESSONS_EN,D:DEEP_EN,B:BASICS_EXTRA_EN},gu:{L:LESSONS_GU,D:DEEP_GU,B:BASICS_EXTRA_GU},hi:{L:LESSONS_HI,D:DEEP_HI,B:BASICS_EXTRA_HI}};
function md(x){return esc(x).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>')}
function renderLearn(){const src=LEARN_SRC[S.lang]||LEARN_SRC.en;const layer=S.learn?.layer||'basics';const open=S.learn?.open;
 const tabs=`<div class="seg ltabs">${[['basics',t('basics')],['lessons',t('lessons')],['deep',t('deep')]].map(([k,n])=>`<button class="${layer===k?'on':''}" data-layer="${k}">${n}</button>`).join('')}</div>`;
 if(layer==='basics')return tabs+`<section class="card"><h3>${t('principles')}</h3><p class="small muted">${t('learnNote')}</p></section>${src.B.map(c=>`<section class="card learn"><div class="ic">${c.i}</div><div><b>${md(c.h)}</b><p>${md(c.b)}</p></div></section>`).join('')}${LEARN.map(c=>{const [h,b]=c[S.lang]||c.en;return `<section class="card learn"><div class="ic">${c.i}</div><div><b>${h}</b><p>${b}</p></div></section>`}).join('')}<section class="card"><h3>${S.lang==='gu'?'માપ':S.lang==='hi'?'मात्रा':'Portions'}</h3><div class="portions">${PORTIONS.map(x=>`<div class="portion">${x.svg}<div>${esc(x[S.lang]||x.en)}</div></div>`).join('')}</div></section>`;
 const list=layer==='lessons'?src.L:src.D;
 if(open){const a=list.find(x=>x.id===open);if(!a){S.learn.open=null;return renderLearn()}const done=S.learn.done||{};const ans=S.learn.ans||{};
  const quiz=a.quiz?`<section class="card"><h3>${t('check')}</h3>${a.quiz.map((q,qi)=>{const k=a.id+':'+qi;const picked=ans[k];return `<div class="q"><p><b>${esc(q[0])}</b></p>${q[1].map((o,oi)=>`<button class="opt ${picked===undefined?'':oi===q[2]?'right':picked===oi?'wrong':''}" data-quiz="${k}" data-oi="${oi}" ${picked!==undefined?'disabled':''}>${esc(o)}</button>`).join('')}${picked!==undefined?`<p class="small ${picked===q[2]?'ok':'bad'}">${picked===q[2]?t('correct'):t('wrong')}</p>`:''}</div>`}).join('')}</section>`:'';
  return `<button class="btn ghost" data-layer="${layer}" data-close="1">${t('back')}</button><section class="card article"><h2>${a.i?a.i+' ':''}${esc(a.t)}</h2><p class="small muted">${a.min} ${t('minRead')}</p>${a.body.map(pg=>`<p>${md(pg)}</p>`).join('')}</section>${quiz}`}
 return tabs+`<section class="card"><p class="small muted">${layer==='lessons'?(S.lang==='gu'?'દરેક પાઠ ૨–૩ મિનિટ, અંતે ત્રણ પ્રશ્નો.':S.lang==='hi'?'हर पाठ 2–3 मिनट, अंत में तीन सवाल।':'Each lesson takes 2–3 minutes, with three questions at the end.'):(S.lang==='gu'?'જિજ્ઞાસુઓ માટે: નિયમો પાછળનું શરીરશાસ્ત્ર અને રસાયણ.':S.lang==='hi'?'जिज्ञासुओं के लिए: नियमों के पीछे का शरीरविज्ञान और रसायन।':'For the curious: the physiology and chemistry behind the rules.')}</p></section>${list.map(a=>{const d=S.learn?.done?.[a.id];return `<button class="card lrow" data-open="${a.id}"><span class="ic">${a.i||'📘'}</span><span><b>${esc(a.t)}</b><br><small class="muted">${a.min} ${t('minRead')}${d?' · ✓':''}</small></span><span class="arrow">›</span></button>`}).join('')}`}
function renderProgress(){const days=Object.keys(S.days).sort().slice(-7);const ws=[...S.weights].sort((a,b)=>a.d.localeCompare(b.d));
 return `<section class="card"><h3>${t('week')}</h3>${days.length?`<div class="days">${days.map(d=>{const r=S.days[d];const sc=r.items.length?plateScore(r.items):null;return `<div class="dc ${sc===null?'':sc>=70?'ok':sc>=40?'mid':'low'}"><small>${d.slice(5)}</small><b>${sc===null?'—':sc}</b></div>`}).join('')}</div><p class="small muted">${t('score')} 0–100 · ${S.lang==='gu'?'૭૦+ સારું':S.lang==='hi'?'70+ अच्छा':'70+ is good'}</p>`:`<p class="muted">${t('noData')}</p>`}</section>
 <section class="card"><h3>${t('wlog')}</h3><div class="row2"><input type="number" id="wIn" step="0.1" min="20" max="250" placeholder="${t('wt')}"><button class="btn" data-act="addW">${t('addw')}</button></div>${ws.length>1?wChart(ws):''}${ws.length?`<ul class="ate">${ws.slice(-8).reverse().map(w=>`<li><span>${w.d}</span><span>${fmt(w.w,1)} kg <button data-delw="${w.d}">×</button></span></li>`).join('')}</ul>`:''}</section>
 <section class="card"><button class="btn" data-act="share">${t('share')}</button> <button class="btn ghost" data-act="reset">${t('reset')}</button></section>`}
function wChart(ws){const W=320,H=120,ml=34,mb=18;const t0=new Date(ws[0].d).getTime(),t1=new Date(ws[ws.length-1].d).getTime()||t0+1;const x=d=>ml+(new Date(d).getTime()-t0)/(t1-t0||1)*(W-ml-8);const ys=ws.map(w=>+w.w),ymin=Math.floor(Math.min(...ys)-1),ymax=Math.ceil(Math.max(...ys)+1),y=k=>H-mb-(k-ymin)/(ymax-ymin)*(H-mb-8);
 return `<svg class="chart" viewBox="0 0 ${W} ${H}"><text x="2" y="${y(ymax)+4}" class="ax">${ymax}</text><text x="2" y="${y(ymin)+4}" class="ax">${ymin}</text><path d="${ws.map((w,i)=>(i?'L':'M')+x(w.d)+','+y(w.w)).join(' ')}" class="line"/>${ws.map(w=>`<circle cx="${x(w.d)}" cy="${y(w.w)}" r="3"/>`).join('')}</svg>`}
function shareText(){const p=S.profile,tg=targets(),d=dayRec(),{s,kcal,prot}=plateSums(d.items);return `${t('app')} · ${p.name||''} · ${today()}\n${t('bmi')} ${fmt(bmi(),1)} · ${t('kcal')} ${tg.kcal} · ${t('protein')} ${tg.p} g\n${t('today')}: ${fmt(kcal)} kcal, ${fmt(prot)} g ${t('protein')}, ${t('score')} ${d.items.length?plateScore(d.items):'—'}\n`+PLATE_ORDER.filter(k=>k!=='glv').map(k=>`${t(k)}: ${fmt(s[k])}/${fmt(tg.plate[k][0])} ${tg.plate[k][1]}`).join('\n')}
/* --- events --- */
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const p=S.profile;
 if(b.dataset.tab){S.tab=b.dataset.tab;if(b.dataset.tab!=='learn'&&S.learn)S.learn.open=null;render();return}
 if(b.dataset.layer!==undefined){S.learn=S.learn||{};S.learn.layer=b.dataset.layer;if(b.dataset.close)S.learn.open=null;render();window.scrollTo(0,0);return}
 if(b.dataset.open){S.learn=S.learn||{};S.learn.open=b.dataset.open;render();window.scrollTo(0,0);return}
 if(b.dataset.quiz){S.learn.ans=S.learn.ans||{};S.learn.ans[b.dataset.quiz]=+b.dataset.oi;const id=b.dataset.quiz.split(':')[0];const src=LEARN_SRC[S.lang]||LEARN_SRC.en;const a=src.L.find(x=>x.id===id);if(a&&a.quiz.every((q,i)=>S.learn.ans[id+':'+i]!==undefined)){S.learn.done=S.learn.done||{};S.learn.done[id]=true}render();return}if(b.dataset.lang){S.lang=b.dataset.lang;S.setup=true;render();return}
 const sg=b.closest('[data-seg]');if(sg&&b.dataset.v!==undefined){p[sg.dataset.seg]=b.dataset.v;if(sg.dataset.seg==='sex'&&b.dataset.v==='m'){p.stage='adult';p.cond.pcos=false}render();return}
 if(b.dataset.cond){if(b.disabled)return;p.cond[b.dataset.cond]=!p.cond[b.dataset.cond];render();return}
 if(b.dataset.add){const [tt,id,g]=b.dataset.add.split(':');const d=dayRec();const ex=d.items.find(i=>i.t===tt&&i.id===id);if(ex&&tt==='r')ex.q+=1;else d.items.push(tt==='r'?{t:'r',id,q:1}:{t:'f',id,q:+g});render();window.scrollTo({top:0,behavior:'smooth'});return}
 if(b.dataset.q!==undefined){const it=dayRec().items[+b.dataset.q];if(it.t==='r')it.q=Math.max(0.5,it.q+ +b.dataset.d);else it.q=Math.max(10,it.q+ +b.dataset.d*50);render();return}
 if(b.dataset.del!==undefined){dayRec().items.splice(+b.dataset.del,1);render();return}
 if(b.dataset.water){const d=dayRec();d.water=Math.max(0,(d.water||0)+ +b.dataset.water);render();return}
 if(b.dataset.delw){S.weights=S.weights.filter(w=>w.d!==b.dataset.delw);render();return}
 switch(b.dataset.act){case 'clear':dayRec().items=[];render();break;
  case 'addW':{const v=parseFloat($('wIn').value);if(v>20&&v<250){S.weights=S.weights.filter(w=>w.d!==today());S.weights.push({d:today(),w:v});p.wt=v;render()}break}
  case 'share':{const txt=shareText();if(navigator.share)navigator.share({text:txt}).catch(()=>{});else{navigator.clipboard?.writeText(txt);alert(txt)}break}
  case 'reset':if(confirm(t('reset')+'?')){localStorage.removeItem(KEY);location.reload()}break}});
document.addEventListener('input',e=>{const el=e.target;if(el.dataset.k){const v=el.type==='number'?parseFloat(el.value):el.value;S.profile[el.dataset.k]=el.type==='number'?(Number.isFinite(v)?v:S.profile[el.dataset.k]):v;save();if(el.dataset.k!=='name'){const tmp=document.createElement('div');tmp.innerHTML=renderMe();const cards=document.querySelectorAll('#view .card');tmp.querySelectorAll('.card').forEach((c,i)=>{if(i>0&&cards[i])cards[i].innerHTML=c.innerHTML})}return}
 if(el.id==='q'){S.q=el.value;const tmp=document.createElement('div');tmp.innerHTML=renderToday();const cards=document.querySelectorAll('#view .card');const last=tmp.querySelectorAll('.card');cards[cards.length-1].querySelector('.grid').innerHTML=last[last.length-1].querySelector('.grid').innerHTML}});
load();render();if('serviceWorker' in navigator&&location.protocol!=='file:')navigator.serviceWorker.register('sw.js').catch(()=>{});
