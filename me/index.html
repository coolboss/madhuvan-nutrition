<style>
:root{--ink:#17313f;--ink2:#52646e;--line:#dbe5e7;--bg:#f4f8f7;--card:#fff;--brand:#0f6b61;--brand2:#13507a;--soft:#e7f3ef;--amber:#b4681a;--red:#b03a3a;--green:#1d6b3a}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans","Noto Sans Gujarati","Noto Sans Devanagari",sans-serif;padding-bottom:84px}
button,input{font:inherit;color:inherit}button{cursor:pointer;border:0;background:none}h3{margin:0 0 8px;font-size:16px}p{margin:6px 0}.muted{color:var(--ink2)}.small{font-size:13px}
header{background:linear-gradient(100deg,#123f55,#0f6b61);color:#fff;padding:12px 16px;display:flex;align-items:center;justify-content:space-between}header h1{margin:0;font-size:20px}header p{margin:0;font-size:12px;opacity:.85}
#langs{display:flex;gap:4px}.lb{padding:5px 9px;border-radius:8px;background:#ffffff22;color:#fff;font-size:13px;font-weight:600}.lb.on{background:#fff;color:var(--brand)}
main{max-width:640px;margin:auto;padding:12px}.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.f{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:600;color:var(--ink2);margin-bottom:10px}.f input,input[type=search],#wIn{width:100%;padding:11px 12px;border:1px solid #c3d2d6;border-radius:10px;font-weight:400;font-size:16px;color:var(--ink);background:#fff}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.row2{display:flex;gap:10px;align-items:center}.row2>*{flex:1}
.seg{display:flex;flex-wrap:wrap;gap:6px;align-items:center}.seg button{padding:9px 12px;border-radius:10px;border:1px solid #c3d2d6;background:#fff;font-size:14px;color:var(--ink)}.seg button.on{background:var(--brand);color:#fff;border-color:var(--brand)}.seg b.wv{min-width:28px;text-align:center;font-size:18px}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chip{padding:7px 11px;border-radius:20px;border:1px solid #c3d2d6;font-size:13px;color:var(--ink)}.chip:disabled{opacity:.35;cursor:not-allowed}.chip.on{background:var(--soft);border-color:var(--brand);color:var(--brand);font-weight:700}
.big{display:flex;justify-content:space-between;align-items:baseline}.big b{font-size:34px}.bmiU,.bmiO{color:var(--amber);font-weight:600}.bmiN{color:var(--green);font-weight:600}.bmiOb{color:var(--red);font-weight:600}
.kpi{background:var(--soft);border-radius:12px;padding:12px;text-align:center}.kpi b{display:block;font-size:26px}.kpi span{font-size:12px;color:var(--ink2)}
.pt{width:100%;border-collapse:collapse;font-size:14px}.pt td{padding:7px 0;border-bottom:1px solid #eef3f3}.pt td:first-child{width:38%}.pt .num{text-align:right}.pt small{display:block;font-size:11px;white-space:normal;color:var(--ink2)}
.plate .pr{display:grid;grid-template-columns:minmax(90px,110px) 1fr 64px;gap:8px;align-items:center;font-size:13px;margin:5px 0}.bar{height:10px;background:#e3ecee;border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:#d08a1a;border-radius:6px}.bar i.ok{background:var(--brand)}.bar i.over{background:var(--red)}.pr small{text-align:right;color:var(--ink2);font-size:11px}
.vd{background:var(--soft);border-radius:10px;padding:10px 12px;font-size:14px}.sc{font-size:26px;color:var(--brand)}
.ate{list-style:none;margin:0;padding:0}.ate li{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #eef3f3;gap:8px;font-size:15px}.ate li>span:last-child{white-space:nowrap;flex-shrink:0}.ate li:last-child{border:0}.ate button{padding:4px 10px;border-radius:8px;border:1px solid var(--line);margin-left:3px;font-size:15px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;margin-top:10px}.dish{text-align:left;padding:10px;border:1px solid var(--line);border-radius:12px;background:#fff;display:flex;flex-direction:column;gap:2px;min-height:64px}.dish:active{background:var(--soft)}.dish b{font-size:14px}.dish small{font-size:11px;color:var(--ink2)}
.btn{background:var(--brand2);color:#fff;border-radius:10px;padding:11px 14px;font-weight:600;font-size:15px}.btn.ghost{background:#eef3f5;color:var(--ink);border:1px solid var(--line)}
.learn{display:flex;gap:12px;align-items:flex-start}.learn .ic{font-size:30px;line-height:1}.learn p{font-size:14px;color:var(--ink2);margin:3px 0 0}
.portions{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.portion{text-align:center;font-size:12px;border:1px solid var(--line);border-radius:10px;padding:6px}.portion svg{width:100%;height:70px}
.days{display:flex;gap:6px}.dc{flex:1;text-align:center;border-radius:10px;padding:8px 2px;background:#eef3f5}.dc b{display:block;font-size:18px}.dc small{font-size:10px;color:var(--ink2)}.dc.ok{background:#d9efe5}.dc.mid{background:#fdebcf}.dc.low{background:#f8dcdc}
.chart{width:100%;height:auto;margin:8px 0}.chart .ax{font-size:10px;fill:#5a6c75}.chart .line{fill:none;stroke:var(--brand2);stroke-width:2}.chart circle{fill:var(--brand2)}
#nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}.nb{flex:1;padding:8px 4px 10px;font-size:12px;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--ink2)}.nb span{font-size:20px}.nb.on{color:var(--brand);font-weight:700}
.ltabs{margin-bottom:12px}.ltabs button{flex:1}.lrow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;cursor:pointer;font:inherit}.lrow .ic{font-size:26px}.lrow .arrow{margin-left:auto;color:var(--ink2);font-size:22px}.article h2{font-size:20px;margin:0 0 4px}.article p{font-size:15.5px;line-height:1.6;margin:10px 0}.q{margin:10px 0 16px}.opt{display:block;width:100%;text-align:left;padding:10px 12px;margin:5px 0;border:1px solid var(--line);border-radius:10px;background:#fff;font-size:15px}.opt.right{background:#d9efe5;border-color:var(--green)}.opt.wrong{background:#f8dcdc;border-color:var(--red)}.ok{color:var(--green)}.bad{color:var(--red)}
#foot{font-size:11px;color:var(--ink2);padding:0 14px 10px;text-align:center}
</style>
</head>

{id:'plate',i:'🍽️',t:'Reading your plate',min:2,body:[
 'Look at a typical Gujarati thali: three or four rotli, a mound of rice, one small katori of dal, a smaller one of shaak, a pickle, and a sweet. Cereals fill two-thirds of it. ICMR says cereals should be under half the day\'s energy, and vegetables plus fruit should be half the plate by volume.',
 'The fix is not to remove rotli. It is to change the proportions: two rotli instead of four, the dal katori as big as the rice, the shaak katori as big as both, and salad or raw vegetables on the side.',
 'A good test: can you see at least three colours on the plate, is there a pulse or dairy at every meal, and does the vegetable take up more space than the cereal? If yes to all three, the plate is right.',
 'The same rule works for breakfast. Poha with peanuts and vegetables beats plain poha. Thepla with dahi beats thepla with chai.'],
 quiz:[['Which should take the most space on a plate?',['Rotli and rice','Vegetables and salad','Dal'],1],['How much of the day\'s energy should cereals give?',['About half or less','Three-quarters','As much as you want'],0],['A pulse or dairy should appear at…',['Lunch only','Every meal','Dinner only'],1]]},
{id:'protein',i:'🫘',t:'Protein without meat',min:3,body:[
 'A vegetarian can get enough protein from Indian food, but not by accident. Rotli has about 3 g of protein; a katori of dal 6–7 g; a glass of milk 6 g; a katori of dahi 3 g; a 50 g piece of paneer 9 g; an egg 6 g; a handful of roasted chana 5 g; soya chunks 13 g per 25 g dry.',
 'Cereals are short of one building block (lysine); pulses are short of another (methionine). Eaten together — dal-bhaat, rotli-dal, khichdi, dhokla, idli-sambhar — they complete each other. The old 3:1 cereal-to-pulse rule exists for this reason.',
 'An adult woman of 55 kg needs about 55 g a day; in pregnancy 10–20 g more; while breastfeeding 15–20 g more. Count a day: 4 rotli (12) + 2 katori dal (13) + milk (6) + dahi (3) + chana (5) = 39 g. Short. Add a second dal, paneer, egg, soya or a protein-rich snack.',
 'Protein should come at every meal, not all at dinner. The body uses about 20–30 g at a time well; the rest is burned as energy.'],
 quiz:[['Why pair cereals with pulses?',['Taste','They complete each other\'s amino acids','Cheaper'],1],['Roughly how much protein in one katori of dal?',['1–2 g','6–7 g','20 g'],1],['Best way to spread protein?',['All at dinner','At every meal','Only at breakfast'],1]]},
{id:'iron',i:'🩸',t:'Iron and anaemia',min:3,body:[
 'Over half of Indian women and children are anaemic. Low iron means tiredness, poor concentration, breathlessness on stairs, and in pregnancy a higher risk of a small baby and heavy bleeding.',
 'Plant iron (dal, greens, til, dates, jaggery) is absorbed poorly — 2 to 10 percent. Three things decide how much gets in. Vitamin C with the meal (lemon, amla, guava, tomato, orange) can double absorption. Tea or coffee within an hour of the meal cuts it by more than half. Calcium at the same time — milk, dahi, a calcium tablet — also blocks it.',
 'So: dal and greens with lemon, not with chai. Milk and dahi at snack time, not with the iron meal. Sprouting and fermenting (sprouted moong, dhokla, idli) reduce the phytate that binds iron.',
 'Diet corrects mild anaemia slowly and cannot correct moderate or severe anaemia. If haemoglobin is below 10, tablets or injections are needed; food is the support, not the treatment. Take iron tablets away from tea, milk and calcium, with a vitamin C food.'],
 quiz:[['What helps absorb iron from dal?',['Chai with the meal','Lemon or amla with the meal','Milk with the meal'],1],['Tea near a meal…',['Improves iron absorption','Blocks it','Has no effect'],1],['Haemoglobin of 9 in pregnancy needs…',['Only more greens','Iron tablets or injection plus diet','Nothing'],1]]},
{id:'sugar',i:'🍬',t:'Sugar you don\'t see',min:3,body:[
 'The limit is 25 g a day — five teaspoons — and it includes everything: the two spoons in each chai, the biscuits, the sweet, the "fruit" drink, the ketchup, the jaggery in dal.',
 'A cup of sweet chai is 8–10 g. Two cups and two biscuits and you are done for the day before lunch. A 300 ml cold drink has 35 g — more than the whole day\'s allowance in one bottle. A packaged "fruit juice" is sugar water with flavour.',
 'Fruit juice from real fruit is not better. You can drink a whole watermelon, but you could never eat a whole one. The juice gives you the sugar of five slices in two minutes, with the fibre thrown away; blood sugar spikes, you are hungry again in an hour. Chewing fruit is slow, filling and comes with fibre.',
 '**Fruit is meant to be eaten. Water is meant to be drunk.**',
 'Jaggery and honey are sugar. They have traces of minerals, but at 5 teaspoons a day the traces do nothing and the sugar does everything. Use them the same way — sparingly.'],
 quiz:[['The daily sugar limit is about…',['5 teaspoons','15 teaspoons','No limit for natural sugar'],0],['Watermelon juice vs slices?',['Juice is healthier','Slices: fibre, slower, filling','Same thing'],1],['Jaggery is…',['Not sugar','Sugar with traces of minerals','A health food'],1]]},
{id:'oil',i:'🥄',t:'Oil, ghee and the frying pan',min:2,body:[
 'ICMR allows about 27 g of visible fat a day at 2000 kcal — 5 to 6 teaspoons per person, oil and ghee together. Most Gujarati kitchens use two to three times that. One tablespoon is 120 kcal; a teaspoon on each rotli adds 300 kcal a day without a bite more food.',
 'Ghee is not poison and oil is not medicine. Both are 9 kcal a gram. Ghee is mostly saturated fat; groundnut, mustard, sesame and rice-bran oils are mostly unsaturated. Rotating two or three oils through the year gives a better mix. Keep ghee for taste, in teaspoons.',
 'The real danger is reused oil. Every reheating darkens it and creates oxidised fats and trans fats. Frying oil used once at home is one thing; the kadhai outside that has been topped up for a week is another.',
 'Measure. Pour oil with a spoon, not from the can. Keep one bottle for the month and watch how long it lasts: a family of four should take about 3 litres a month, not 6.'],
 quiz:[['Daily visible fat per person?',['5–6 teaspoons','12 teaspoons','As little as possible, zero is best'],0],['Ghee vs oil?',['Ghee is poison','Both 9 kcal/g; quantity matters more than type','Oil is medicine'],1],['Most harmful?',['Fresh oil once','Oil reheated many times','Ghee in teaspoons'],1]]},
{id:'salt',i:'🧂',t:'Salt and blood pressure',min:2,body:[
 'One teaspoon a day — 5 g — is the limit. Indians eat about double. Blood pressure follows salt closely, and high blood pressure is the biggest cause of stroke and kidney failure.',
 'Most salt is not from the salt spoon. Papad, pickle, chhundo, namkeen, sev, chevdo, chips, bread, biscuits, cheese, soy sauce, pani puri water, instant noodles and packaged soups carry it. One papad has a quarter of the day\'s salt; a small bowl of chevdo, half.',
 'Taste adapts in three weeks. Cook with less, add lemon, ginger, green chilli, coriander, garlic and roasted spices for flavour. Keep pickle and papad for Sundays.',
 'In pregnancy with high blood pressure, salt restriction is sensible but food is not restricted — never cut calories or protein to control blood pressure.'],
 quiz:[['Daily salt limit?',['One teaspoon','Three teaspoons','One tablespoon'],0],['Where does most salt come from?',['The salt spoon at the table','Papad, pickle, namkeen, packets','Vegetables'],1],['Taste for salt…',['Never changes','Adapts in about three weeks','Adapts in a day'],1]]},
{id:'preg',i:'🤰',t:'Eating in pregnancy',min:3,body:[
 'Not "for two". The first three months need no extra energy at all — only quality, especially folate (greens, dal, chana, orange) and a folic acid tablet. From the fourth month, about 350 kcal extra — a glass of milk and a handful of chana, not a second plate.',
 'Protein need rises by 10 g in the middle months and about 20 g at the end: an extra katori of dal, dahi, paneer or an egg. Iron needs nearly double; calcium stays at 1000 mg but absorption improves on its own. Iron and calcium tablets are standard in India because food alone rarely reaches these numbers.',
 'Small meals every 2–3 hours help nausea, acidity and blood sugar. Never skip meals; a long gap makes nausea worse. Avoid raw or undercooked food, unpasteurised milk and soft cheese from it, raw sprouts, cut fruit from outside, liver, high-dose vitamin A, alcohol, and keep caffeine under two small cups.',
 'Weight gain that is right: about 10–12 kg total if you started at a normal weight; 5–9 kg if overweight; more if underweight. Almost none in the first three months, then about 400 g a week. Too little or too much, see your doctor — do not diet.'],
 quiz:[['Extra energy in the first trimester?',['None — quality matters, not quantity','+350 kcal','+600 kcal'],0],['Why small frequent meals?',['Nausea, acidity and blood sugar','To eat more total','Tradition'],0],['Weight gain with normal starting weight?',['About 10–12 kg','20 kg','None'],0]]},
{id:'lact',i:'🤱',t:'Eating while breastfeeding',min:2,body:[
 'Breastfeeding costs about 600 kcal a day for the first six months — more than pregnancy. The body gives part of it from pregnancy fat stores; the rest must come from food. Hungry mothers are normal; feed them.',
 'Protein need is 15–20 g above normal; calcium 1200 mg; iron continues as advised. Water: a glass each time you feed.',
 'What passes into milk: caffeine (keep under 300 mg — three cups), alcohol (avoid; if taken, wait two hours per drink), vitamin B12 (vegetarian mothers often need a supplement for the baby\'s sake). What does not: the "heat" or "cold" of foods, the spices, the "gas" from cabbage or dal. Most traditional food bans have no basis and remove good food from a hungry mother.',
 'This is not the time to lose weight. Weight settles slowly over months with breastfeeding and normal eating. Dieting reduces milk before it reduces fat.'],
 quiz:[['Extra energy while breastfeeding?',['None','About 600 kcal','1500 kcal'],1],['Which passes into milk?',['The gas from cabbage','Caffeine and alcohol','The heat of food'],1],['Dieting while breastfeeding…',['Is fine','Cuts milk before it cuts fat','Is recommended'],1]]},
{id:'diabetes',i:'📉',t:'Diabetes and PCOS at the table',min:3,body:[
 'In diabetes the problem is not sugar alone. All carbohydrate — rotli, rice, poha, fruit, potato, milk — becomes glucose. The question is how fast and how much at once.',
 'Spread carbohydrate across the day: three meals and two or three small snacks, each with roughly the same amount, never a huge lunch and a skipped dinner. Skipping a meal leads to a bigger spike at the next one.',
 'Choose slow carbohydrates: bajra, jowar, whole wheat, oats, dalia, whole moong, chana, over maida, white bread, poha, sabudana, juice, sweets. Add protein and vegetables to every meal; they slow the glucose. Eat the vegetables and dal first, the rotli after.',
 'Walk 10–15 minutes after each meal. Muscles take up glucose when they move; the effect is as large as some medicines. In PCOS the same rules apply, and losing 5–10% of weight brings back ovulation in many women.',
 'In pregnancy with diabetes, carbohydrate must not fall below about 175 g a day — the baby needs it — and a protein snack at bedtime prevents overnight ketones.'],
 quiz:[['Which raises blood glucose?',['Only sugar','All carbohydrate, at different speeds','Only rice'],1],['Skipping a meal in diabetes…',['Lowers sugar for the day','Causes a bigger spike at the next meal','Is recommended'],1],['After a meal…',['Lie down','Walk 10–15 minutes','Have a sweet'],1]]},
{id:'myths',i:'🧐',t:'Ten myths',min:3,body:[
 '**Rice at night makes you fat.** Rice at any time has the same calories. Portion matters, time does not.',
 '**Fruit after meals is bad.** Fruit is fine any time. Juice is the problem, not timing.',
 '**Ghee makes you fat; oil doesn\'t.** Both are 9 kcal a gram. Measure both.',
 '**Protein powder is needed for health.** Only when food cannot meet the need. Dal, milk, paneer, eggs, soya do it cheaper.',
 '**Brown bread is healthy.** Most brown bread is white bread with colour. Look for "whole wheat" as the first ingredient — or eat rotli.',
 '**"Sugar-free" sweets are fine.** They are still maida, fat and often maltitol or dates; small portions only.',
 '**A detox cleans the body.** Your liver and kidneys do that for free. Juice cleanses add sugar and remove fibre.',
 '**Cold water, curd and bananas cause colds.** Viruses do. These foods do not.',
 '**Eating less and less is the way to lose weight.** Below about 1200 kcal the body slows down and muscle is lost; weight returns. Eat enough protein and vegetables, cut cereal, oil and sugar, and walk.',
 '**Health drinks make children taller.** They are sugar with vitamins. Milk, eggs, dal and sleep do the job.'],
 quiz:[['Rice at night…',['Makes you fat','Same calories as at noon','Is forbidden'],1],['Brown bread is…',['Always whole wheat','Often white bread with colour','A health food'],1],['"Detox" juice…',['Cleans the liver','Adds sugar, removes fibre','Is medicine'],1]]},
{id:'outside',i:'🛵',t:'Eating out: the double whammy',min:3,body:[
 'Eating out in India carries two risks stacked on each other. The first is the one everyone half-knows: the food is fried, salty, sweet and large. The second is Indian: what is in it may not be food at all.',
 '**Reused oil.** The kadhai outside is topped up, not emptied. Oil heated again and again darkens, oxidises and forms trans fats. You never see this; you taste only crispness.',
 '**Adulterants cheaper than the real thing.** Detergent, urea and starch in milk; starch and synthetic colour in paneer and khoya; non-permitted dyes — metanil yellow in besan, sweets and turmeric, malachite green on vegetables, dyes in chutneys and sauces; argemone in mustard oil; chalk, brick powder and sawdust in spices; saccharin and ice from untreated water in juices and gola; artificial ripening agents on fruit.',
 '**No label, no date, no name.** A packet has a maker, a date and a list. A street stall has none. Every rule that protects you from a packet stops at the counter.',
 '**The quiet dose.** A samosa a week is nothing. A vada-pav lunch every working day for ten years is 2500 servings of unknown oil and unknown colour. Dose makes the poison, and habit sets the dose.',
 'So: eat out, but choose steamed, grilled and freshly cooked over fried; sit where you can see the oil and the kitchen; skip brightly coloured sweets, chutneys and drinks; carry roasted chana or a fruit for the hungry gap that drives the impulse buy. At home, simple checks: paneer that turns blue-black with a drop of iodine has starch; milk that leaves a trail on a tilted plate is diluted; spices that colour cold water immediately are dyed.'],
 quiz:[['The second risk of eating out in India is…',['Cost','Adulteration and reused oil','Portion size'],1],['Metanil yellow is found in…',['Fresh turmeric root','Coloured besan, sweets and turmeric powder','Milk'],1],['Best protection?',['Never eat out','Choose steamed and fresh; avoid bright colours; carry a snack','Only eat sweets'],1]]},
];

{id:'rda',t:'Where the numbers come from',min:7,body:[
 'Every target in this app — 55 g protein, 29 mg iron, 1000 mg calcium — is a number that somebody measured in people. Understanding how turns the numbers from commandments into tools.',
 'For most nutrients the committee asks: how much does a person need to stay in balance, or to keep a blood marker normal, or to fill body stores? They measure this in dozens of volunteers. The answers vary — bodies differ — and form a bell curve. The middle of that curve is the **Estimated Average Requirement (EAR)**: half of healthy people need less, half need more.',
 'A target set at the EAR would leave half the population short. So the committee adds two standard deviations — roughly 20–25% — and calls that the **Recommended Dietary Allowance (RDA)**. By construction the RDA covers about 97.5% of healthy people. Which means, for any one individual, the RDA is more than they need in almost all cases. It is a safe ceiling for planning a population\'s food, not the minimum for a person.',
 'This is why the app shows both. When a day\'s iron reaches the EAR mark, that person is probably fine; when it reaches the RDA, almost certainly. A plan that hits 85% of the RDA for calcium is not a deficiency — it is above the average requirement.',
 'Energy is the exception. There is no RDA for energy; an allowance that covers 97.5% of people would make most of them fat. Energy targets are set at the average, which is why they must be adjusted to the person — height, weight, activity — rather than read off a table. That is what the Mifflin–St Jeor equation does, and why the app asks for your weight and height.',
 'ICMR–NIN published these for Indians in 2020, replacing the 2010 figures. The protein RDA fell (1.0 → 0.83 g/kg), iron for women fell (21 → 29 mg? No — it rose, because new absorption data for Indian diets came in), calcium rose (600 → 1000 mg). These are not fashion; they follow measurements. Where Indian data were thin, international values were adapted.',
 '"My Plate for the Day" (2024) is a translation of these numbers into food: 250 g cereals, 85 g pulses, 400 g vegetables, 100 g fruit, 300 ml milk, 35 g nuts, 27 g oil for a 2000 kcal day. Aahar scales the cereal, pulse, nut and oil portions to your energy, and keeps vegetables, fruit and milk fixed, because those are minimums, not proportions.',
 'What the numbers cannot do: tell you about yourself. They describe a healthy population. Illness, medicines, pregnancy complications, genetics shift the need. That is where the doctor comes in and the table goes quiet.'],},
{id:'energy',t:'Energy balance, honestly',min:7,body:[
 'Weight changes when energy in and energy out differ over months. Both sides of that sentence are harder to measure than people think.',
 'Energy out has three parts. Resting metabolism — the cost of being alive, about 60–70% — depends mostly on how much lean tissue you carry, which is why the Mifflin–St Jeor equation uses weight, height, age and sex. Activity, 15–30%, is multiplied in as the PAL (1.2 sedentary to 1.9 very active). Digestion itself costs 10%, more for protein than fat.',
 'Energy in is what you eat minus what you do not absorb. Food tables are averages of samples; your rotli is not the table\'s rotli. Cooking changes weight (water in, water out) but not energy, so tables quote raw weights — and your eye quotes cooked ones. Honest logging is usually 20% under the truth.',
 'The 7700 kcal per kilogram rule — eat 500 kcal a day less, lose half a kilo a week — is arithmetic from the energy in a kilogram of fat. It holds for the first weeks, then fails, for a reason that is not willpower: as you lose weight, a lighter body burns less, and the body also quietly reduces spontaneous movement and lowers resting metabolism a little beyond what the lost weight predicts — metabolic adaptation. The deficit shrinks on its own; the plateau is physics, not failure.',
 'The scale lies day to day. A kilogram of water moves with salt, carbohydrate (glycogen holds water), the menstrual cycle and the time of the last meal. Weigh weekly, same day, same time, and look at the month\'s slope, not the morning\'s number.',
 'Below about 1200 kcal for a woman the body starts to take protein from muscle, and resting metabolism drops further; what you lose becomes partly muscle and comes back as fat. This is why the app floors energy at 1200, caps the deficit at 750, raises protein to 1.2 g/kg during restriction, and treats 5–10% in six months as the realistic goal — and why it refuses to set a deficit in pregnancy, breastfeeding, under 18 or over 60.',
 'What works over years is not a number. It is the shape of the plate — more vegetables, dal and protein, less cereal, oil and sugar — plus daily movement and enough sleep. The numbers are for checking the shape, not for living by.'],},
{id:'proteinq',t:'Protein quality',min:7,body:[
 'Protein is twenty amino acids strung in chains. Nine of them the body cannot make; they must arrive in food. A protein is "complete" if it brings all nine in roughly the proportion the body builds with.',
 'Egg, milk, fish and meat are complete. Cereals are short of lysine. Pulses are short of methionine. Each has what the other lacks — which is why dal-bhaat, rotli-dal, khichdi, idli-sambhar, dhokla and missi roti exist in every Indian kitchen. The 3:1 cereal-to-pulse ratio by weight gives an amino acid pattern close to egg.',
 'Scientists score quality with DIAAS (digestible indispensable amino acid score). Milk protein and egg score about 1.0 or above; soya around 0.9; whole wheat around 0.45 alone, pulses 0.6–0.8 alone, the two together about 0.8–0.9. The jump from eating them together is the whole point of the traditional combinations.',
 'Digestibility matters too. Plant proteins come wrapped in fibre and phytate; cooking, soaking, sprouting and fermenting open them up. Sprouted moong gives more usable protein than raw; dhokla more than plain besan.',
 'The ICMR RDA of 0.83 g/kg is calculated for good-quality protein. Indian cereal-pulse diets deliver lower quality, so ICMR itself notes that about 1 g/kg is a reasonable target on such diets — and that is the default rule this app uses. In pregnancy add 10–20 g, in lactation 15–20 g, during weight loss raise to 1.2 g/kg so that muscle is spared.',
 'Muscle, the organ most people worry about, does best with 20–30 g of protein per meal spread across the day, plus resistance work — carrying, climbing, squatting, lifting the grandchild. Protein eaten without using the muscle is mostly burned as expensive fuel.',
 'The practical rule: a pulse or dairy or egg at every meal, cereal and pulse together, sprout and ferment when you can, and supplements only when a measured gap remains after the food is right.'],},
{id:'ironchem',t:'Iron: a chemistry lesson',min:7,body:[
 'Iron in food comes in two forms. Haem iron, from meat, fish and poultry, is absorbed at 15–35% almost regardless of what else is eaten. Non-haem iron — everything in a vegetarian diet — is absorbed at 2–10%, and that number swings with the rest of the meal.',
 'Non-haem iron is mostly ferric (Fe³⁺) and must be reduced to ferrous (Fe²⁺) to cross the gut wall. Stomach acid starts this; vitamin C finishes it and also holds the iron in solution. That is the chemistry behind "lemon with dal": 50 mg of vitamin C — half an amla, one guava, one orange — can double the iron absorbed from the same plate.',
 'The blockers work by binding. Phytate in whole grains and pulses, tannins and polyphenols in tea and coffee, and calcium from milk, dahi or a tablet all bind iron in the gut so it passes through unused. Tea taken with a meal can cut absorption by 60–70%. Soaking, sprouting and fermenting break down phytate — the traditional methods are iron technology.',
 'Once absorbed, iron is stored as ferritin. A ferritin test shows the stores; haemoglobin shows only what is in circulation. Stores empty first, silently; haemoglobin falls last. That is why a woman with normal haemoglobin can have empty stores, and why ferritin below 30 in pregnancy is treated even before anaemia appears. One caution: ferritin rises with infection and inflammation, so a normal value in a sick patient can hide a deficiency.',
 'Why women? Menstrual loss of 10–40 mg a month, pregnancy demanding about 1000 mg over nine months for the baby, placenta and extra blood, and a cereal-based diet with tea. The RDA of 29 mg for Indian women assumes 8% absorption; a day\'s food rarely reaches it, which is why tablets are routine.',
 'Tablets have their own chemistry. Absorption is best on an empty stomach with vitamin C, away from tea, milk and calcium by two hours. Recent trials show that taking a tablet on alternate days absorbs more per tablet than daily dosing, because the gut hormone hepcidin rises after each dose and blocks the next; this is becoming standard advice where side effects limit daily iron.',
 'The whole lesson in one line: iron is about company — lemon helps, tea and milk hinder, stores matter more than haemoglobin, and tablets are chemistry too.'],},
{id:'glucose',t:'Glucose, insulin and the glycaemic index',min:8,body:[
 'Every rotli, every grain of rice, every banana ends as glucose in the blood. The questions are how fast it arrives and how much arrives at once, because both decide how hard the pancreas must work and how much of the surge is turned into fat.',
 'The glycaemic index (GI) measures speed: how high blood glucose rises after 50 g of carbohydrate from a food, compared with pure glucose at 100. Maida, white bread, cornflakes, poha, sabudana and potato sit high (70+); whole wheat, bajra, jowar, oats, dalia in the middle (50–65); dal, chana, rajma, most fruit, milk low (under 50). Fibre, protein, fat and acid all slow the rise — which is why dal before rotli, dahi with rice and lemon on everything help.',
 'GI alone misleads, because it ignores quantity. Glycaemic load (GL) multiplies speed by amount. Watermelon has a high GI but a slice carries only 6 g of carbohydrate — low load. Now juice it. You can drink a whole watermelon in two minutes; you could never eat one. The juice carries the sugar of five slices, the fibre is in the bin, and the load lands on the pancreas all at once. Same food, same GI, five times the load, none of the braking. **Fruit is meant to be eaten. Water is meant to be drunk.** The same arithmetic applies to any juice, including the "healthy" ones.',
 'Insulin is the hormone that moves glucose from blood into muscle, liver and fat. Insulin resistance — in type 2 diabetes, PCOS, obesity and, for every woman, the second half of pregnancy — means the cells answer the knock more slowly; the pancreas shouts louder; glucose stays high longer. Pregnancy does this on purpose: placental hormones blunt insulin so that more glucose flows to the baby. In most women the pancreas keeps up; when it cannot, gestational diabetes appears, usually after 24 weeks, which is why screening is timed then.',
 'Two tools work without any medicine. First, spreading carbohydrate across five or six eatings keeps each load small. Second, moving muscle after a meal: contracting muscle pulls glucose in through a separate door that does not need insulin. A 10–15 minute walk after eating lowers the post-meal peak by 20–30 mg/dL in many studies — comparable to a tablet. Sitting after a meal is the worst possible choice; lying down adds reflux to the list.',
 'In gestational diabetes, the targets are tight — fasting under 95, two hours after meals under 120 — because the baby grows on the mother\'s glucose and grows too large on too much. The carbohydrate cannot fall below about 175 g a day, because the baby\'s brain runs on it; the trick is distribution and quality, not restriction. A bedtime snack with protein stops the overnight fast from producing ketones.',
 'What the GI will not tell you: a food\'s goodness. Ice cream has a lower GI than bajra rotla because of its fat. GI is one dial. The plate — vegetables first, pulse at every meal, whole grain, measured oil, no liquid sugar — is the whole instrument.'],},
{id:'pregphys',t:'Pregnancy physiology at the plate',min:8,body:[
 'A pregnancy builds roughly 12 kilograms of new material by term: a 3 kg baby, a 0.6 kg placenta, 0.8 kg of amniotic fluid, 1 kg of uterus and breast, 1.5 kg of extra blood, 1.5 kg of extra fluid, and 3–4 kg of maternal fat laid down as the energy reserve for breastfeeding. Every gram of that is made from the plate. The gain is not optional; it is the build.',
 'Blood volume rises by nearly half. The plasma — the watery part — rises more than the red cells, so haemoglobin concentration falls even in a perfectly nourished woman. This is why the anaemia cut-off drops to 10.5 g/dL in the second trimester and why a value of 11 at 20 weeks is normal, not low. True iron need, however, roughly doubles: 27 mg a day, of which about 1000 mg over the pregnancy goes into the baby, placenta and new red cells. Food alone rarely delivers it, hence the universal iron tablet.',
 'Folate — vitamin B9 — closes the neural tube, the baby\'s spine and brain, in the first 28 days after conception, often before the pregnancy is known. Deficiency in that window causes spina bifida and anencephaly. This is why folic acid is given to every woman planning a pregnancy and through the first twelve weeks, and why the app uses pregnancy folate targets from the first week, not the fourteenth. Greens, dal and chana help; the tablet is non-negotiable.',
 'Calcium need stays at 1000 mg, which surprises people, because the baby\'s skeleton takes about 30 g. The body answers by nearly doubling calcium absorption from the gut — a hormonal adjustment that costs nothing if the diet contains calcium to absorb. With little milk, dahi, ragi, til or greens, the baby takes calcium from the mother\'s bones. The Indian tablet from 14 weeks exists because that diet is common, and because calcium also lowers the risk of pre-eclampsia in low-intake women.',
 'Energy: no extra in the first trimester, about 350 kcal in the second and third — one glass of milk and a handful of chana, or an extra rotli with dal. "Eating for two" doubles the gain, and the extra lands on the mother as fat, with higher risks of gestational diabetes, large babies and difficult births. Weight gain of 10–12 kg for a normal starting weight, 5–9 kg if overweight.',
 'Protein: about 10 g extra in the second trimester and 20 g in the third, because the baby\'s growth accelerates late. In a cereal diet that is an extra katori of dal and a dahi every day.',
 'The gut slows under progesterone — hence constipation, reflux and nausea. Small, frequent meals; fibre and water; dry starch early in the morning for nausea; nothing large late at night for reflux. Small-frequent is not a tradition; it is the answer to a slowed gut.',
 'And what to keep away: raw and undercooked food, unpasteurised milk (listeria crosses the placenta), raw sprouts, liver and high-dose vitamin A (teratogenic in excess), alcohol (no safe level), large predatory fish (mercury), more than two small cups of tea or coffee.'],},
{id:'milk',t:'Breast milk as food',min:6,body:[
 'Human milk is about 87% water, 7% lactose, 4% fat and 1% protein, with a long list of minerals, vitamins, antibodies, hormones and living cells. A mother makes about 750 ml a day at four months. The energy in that milk, plus the cost of making it, comes to roughly 600 kcal a day — more than pregnancy ever asked.',
 'The body meets part of it from the fat laid down in pregnancy, which is why breastfeeding women lose weight slowly without trying. The rest must be eaten. A breastfeeding mother is hungry for a physiological reason; feeding her is feeding the baby.',
 'What the mother eats changes some things and not others. Protein and lactose in milk are almost fixed; a poorly fed mother makes milk of nearly normal quality but less of it, and takes the shortfall from her own body. Fat quantity varies through the feed and the day; fat type follows the mother\'s diet — the omega-3 from fish, til and walnuts appears in the milk. Water-soluble vitamins and B12 follow intake closely: a vegetarian mother low in B12 makes B12-poor milk, and the baby can become deficient within months. This is the one supplement most Indian vegetarian mothers should take for the baby\'s sake.',
 'Caffeine passes into milk at low levels; under three cups a day is safe. Alcohol passes freely and leaves at the same rate as from blood — about two hours per drink; avoiding it is simplest. Nicotine, most street drugs and a short list of medicines pass; a pharmacist can check any prescription.',
 'What does not pass: the "heat" or "cold" of foods, the spice, the "gas" from cabbage or dal. Flavours do pass, mildly, and babies accept them. The long traditional lists of banned foods for new mothers have no basis in milk chemistry and remove dal, vegetables and fruit from the one person who needs them most.',
 'Fluids: a glass of water or milk each time you feed is enough; forcing litres does not increase milk. Iron and calcium continue; ICMR sets calcium at 1200 mg and protein about 17 g above normal in the first six months.',
 'Dieting reduces milk before it reduces fat. The weight settles over six to twelve months with breastfeeding and normal eating. Patience is the physiology.'],},
{id:'fibre',t:'Fibre and the gut',min:6,body:[
 'Fibre is the part of plant food your enzymes cannot digest. For a century it was thought inert — "roughage". It is now clear that it feeds the trillions of bacteria in the large intestine, and that what they make from it reaches the whole body.',
 'Two kinds. Insoluble fibre — wheat bran, vegetable skins, whole grain husks — holds water and bulk, moving the gut along. Soluble fibre — in oats, dal, chana, fruit, flaxseed, isabgol — dissolves into a gel that slows glucose and fat absorption and is fermented by bacteria into short-chain fatty acids: acetate, propionate and butyrate.',
 'Butyrate feeds the cells lining the colon and keeps the barrier tight; propionate signals the liver to make less glucose; acetate reaches the brain and influences appetite. Bacteria fed well also crowd out the species that cause inflammation. A low-fibre diet starves this ecosystem within days.',
 'ICMR recommends about 30 g of fibre per 2000 kcal. A typical refined Indian diet delivers 10–15. The gap is the difference between whole dal and dal water, between rotli and maida, between fruit and juice, between vegetables as the main dish and vegetables as garnish. Each katori of whole dal gives 4–6 g; each katori of cooked vegetable 3–4 g; a fruit 2–3 g; a bajra rotla 3 g.',
 'Fermented foods are the other half of the story. Dahi, chaas, dhokla, idli, dosa, khaman, kanji and pickled vegetables carry live bacteria or their products. Fermentation also predigests the grain and pulse, breaks down phytate (freeing iron and zinc) and makes B vitamins. The Gujarati table is accidentally excellent here — as long as the fermented food is steamed, not fried.',
 'Increase fibre slowly, over weeks, with water. Gas is the bacteria celebrating; it settles as the population shifts. In pregnancy fibre and water are the answer to progesterone\'s slow gut, far better than any laxative.'],},
{id:'tables',t:'How a food table is made',min:6,body:[
 'Every number in this app for a raw food comes from the Indian Food Composition Tables 2017, published by ICMR–NIN in Hyderabad. Knowing how they were made tells you how much to trust the third decimal.',
 'The team collected 528 foods from six regions of India, each food from several markets in each region, in different seasons, and pooled the samples so that one line in the table represents the country\'s average, not one shop\'s. Each pooled sample went through laboratory analysis — not estimation — for about 150 components: energy, protein, fat, carbohydrate, fibre, each mineral, each vitamin, amino acids, fatty acids, carotenoids, phytate, polyphenols.',
 'The values are for 100 g of the edible portion, raw. "Edible" means the peel, seeds and stalk you would discard are already removed. "Raw" means before cooking. This is the convention worldwide, because cooking changes weight — rice triples by absorbing water, spinach halves by losing it — while the nutrients mostly stay. Dish values in this app are built by adding raw ingredients, which is why a dish\'s portion is described as "30 g raw" even though the katori in front of you weighs 100 g cooked.',
 'What cooking does change: vitamin C and folate fall with heat and time in water; thiamine with baking soda; iron and calcium are untouched; protein and energy are untouched. Frying adds the oil absorbed — the app adds it as an ingredient. Fermentation and sprouting change availability more than amount.',
 'Where two tables disagree — IFCT versus USDA versus a label — it is usually the variety, soil, season or method. Indian wheat has less iron than American; Indian milk is from buffalo as often as cow and has more fat. This is why an Indian table matters, and why the app prefers IFCT and marks label foods as such.',
 'The honest reading: energy and macronutrients are good to about 10%; minerals to 20%; vitamins to 30% or worse, because they vary so much with freshness. A plan that shows 92% of the folate target is, in reality, somewhere between 70 and 115. Use the bars as a compass, not a micrometer. The direction is reliable; the decimal is not.'],},
{id:'upf',t:'Ultra-processed food',min:7,body:[
 'Brazilian researchers in 2009 proposed classifying food not by nutrients but by what has been done to it. The NOVA system has four groups. Group 1: unprocessed or minimally processed — wheat, dal, vegetables, milk, eggs, nuts. Group 2: culinary ingredients — oil, ghee, sugar, salt. Group 3: processed — bread, cheese, pickles, dahi; a group-1 food plus group-2 ingredients. Group 4: **ultra-processed** — formulations made in factories from substances extracted or synthesised from food: refined flours and starches, protein isolates, hydrogenated oils, sugars and syrups, plus additives for colour, flavour, texture and shelf life. Biscuits, chips, instant noodles, cold drinks, breakfast cereals, "health" drinks, packaged namkeen, ice cream, most bread and bakery.',
 'Why does the category matter if the calories are the same? Because large studies that compared people on equal-calorie diets found that the ultra-processed group ate about 500 kcal a day more when allowed to eat freely, gained weight, and showed worse blood markers. The food is engineered to be eaten fast and in quantity: soft, uniform, no chewing, salt-sugar-fat in the ratio that disables the fullness signal.',
 'A biscuit and a rotli can carry the same calories. The rotli takes two minutes to chew, comes with dal, and stops you. The biscuit takes ten seconds, arrives in a sleeve of twelve, and asks for the next one. Same calories, different hunger an hour later.',
 'Labels are the industry\'s reply, and they are weak. "High protein" means protein isolate was added to a biscuit. "Fortified with iron and vitamins" means a few milligrams were sprayed on a food that would otherwise have none — the cereal is still sugar. "No added sugar" often means fruit concentrate, which is sugar. "Multigrain" means several refined grains. "Sugar-free" means maltitol and maida. A packet that needs seven claims is telling you something.',
 'In an Indian kitchen the line is simple. If your grandmother would recognise it as food, and it would spoil in a week, it is group 1–3. If it has a shelf life of a year, a list of ingredients you cannot buy in a shop, and a cartoon on the packet, it is group 4. Koro nasto in a packet — chevdo, chavanu — is group 4 with a Gujarati name.',
 'The practical rule is not zero. It is: ultra-processed food as an occasional treat, never as a daily meal or snack, never as a child\'s breakfast, and never confused with the food it imitates. Fresh fruit, roasted chana, a handful of peanuts, dahi, a khakhra — these are the snacks that existed before packaging, and they still work.'],},

{id:'plate',i:'🍽️',t:'તમારી થાળી વાંચો',min:2,body:[
 'સામાન્ય ગુજરાતી થાળી જુઓ: ત્રણ-ચાર રોટલી, ભાતનો ઢગલો, દાળની એક નાની વાટકી, તેનાથી પણ નાની શાકની, અથાણું અને મીઠાઈ. અનાજ થાળીનો બે-તૃતીયાંશ ભાગ રોકે છે. ICMR કહે છે અનાજ દિવસની અડધાથી ઓછી કેલરી આપે અને શાક-ફળ થાળીનો અડધો ભાગ હોય.',
 'ઉપાય રોટલી કાઢી નાખવાનો નથી, પ્રમાણ બદલવાનો છે: ચારને બદલે બે રોટલી, દાળની વાટકી ભાત જેટલી, શાકની વાટકી બંને જેટલી, અને બાજુમાં સલાડ કે કાચું શાક.',
 'એક સરળ કસોટી: થાળીમાં ત્રણ રંગ દેખાય છે? દરેક ભોજનમાં દાળ-કઠોળ કે દૂધ-દહીં છે? શાક અનાજથી વધુ જગ્યા લે છે? ત્રણેના જવાબ હા હોય તો થાળી સાચી છે.',

 quiz:[['થાળીમાં સૌથી વધુ જગ્યા કોને મળવી જોઈએ?',['રોટલી અને ભાત','શાક અને સલાડ','દાળ'],1],['દિવસની કેલરીમાં અનાજનો ભાગ કેટલો?',['અડધો કે તેથી ઓછો','ત્રણ-ચતુર્થાંશ','મન ફાવે તેટલો'],0],['દાળ-કઠોળ કે દૂધ-દહીં ક્યારે હોવું જોઈએ?',['માત્ર બપોરે','દરેક ભોજનમાં','માત્ર રાત્રે'],1]]},
{id:'protein',i:'🫘',t:'માંસ વિના પ્રોટીન',min:3,body:[
 'શાકાહારી ભારતીય ખોરાકમાંથી પૂરતું પ્રોટીન મળે છે, પણ આપમેળે નહીં. એક રોટલીમાં લગભગ ૩ ગ્રામ પ્રોટીન; એક વાટકી દાળમાં ૬–૭; એક ગ્લાસ દૂધમાં ૬; એક વાટકી દહીંમાં ૩; ૫૦ ગ્રામ પનીરમાં ૯; એક ઈંડામાં ૬; મુઠ્ઠી શેકેલા ચણામાં ૫; ૨૫ ગ્રામ સૂકા સોયા ચંક્સમાં ૧૩.',
 'અનાજમાં એક ઘટક (લાયસિન) ઓછું હોય છે; કઠોળમાં બીજું (મિથિયોનીન). સાથે ખાવાથી — દાળ-ભાત, રોટલી-દાળ, ખીચડી, ઢોકળા, ઈડલી-સાંભાર — બંને પૂરાં થાય. ૩:૧ અનાજ-કઠોળનો જૂનો નિયમ આ કારણે છે.',
 '૫૫ કિલોની સ્ત્રીને રોજ લગભગ ૫૫ ગ્રામ જોઈએ; ગર્ભાવસ્થામાં ૧૦–૨૦ વધુ; સ્તનપાનમાં ૧૫–૨૦ વધુ. એક દિવસ ગણો: ૪ રોટલી (૧૨) + ૨ વાટકી દાળ (૧૩) + દૂધ (૬) + દહીં (૩) + ચણા (૫) = ૩૯ ગ્રામ. ઓછું. બીજી દાળ, પનીર, ઈંડું, સોયા કે પ્રોટીનવાળો નાસ્તો ઉમેરો.',
 'પ્રોટીન દરેક ભોજનમાં હોવું જોઈએ, બધું રાત્રે નહીં. શરીર એક વખતે ૨૦–૩૦ ગ્રામ બરાબર વાપરે; બાકીનું બળી જાય.'],
 quiz:[['અનાજ અને કઠોળ સાથે કેમ?',['સ્વાદ','એકબીજાના એમિનો એસિડ પૂરા કરે','સસ્તું'],1],['એક વાટકી દાળમાં પ્રોટીન લગભગ?',['૧–૨ ગ્રામ','૬–૭ ગ્રામ','૨૦ ગ્રામ'],1],['પ્રોટીન કેવી રીતે વહેંચવું?',['બધું રાત્રે','દરેક ભોજનમાં','માત્ર સવારે'],1]]},
{id:'iron',i:'🩸',t:'લોહતત્વ અને પાંડુરોગ',min:3,body:[
 'ભારતની અડધાથી વધુ સ્ત્રીઓ અને બાળકોમાં લોહી ઓછું છે. લોહતત્વ ઓછું હોય તો થાક, ધ્યાન ન રહે, દાદર ચડતાં શ્વાસ ચડે, અને ગર્ભાવસ્થામાં નાના બાળક અને વધુ રક્તસ્ત્રાવનું જોખમ.',
 'વનસ્પતિનું લોહતત્વ (દાળ, ભાજી, તલ, ખજૂર, ગોળ) માત્ર ૨–૧૦ ટકા શોષાય છે. ત્રણ બાબતો નક્કી કરે કે કેટલું અંદર જાય. જમવા સાથે વિટામિન C (લીંબુ, આમળા, જામફળ, ટામેટું, નારંગી) શોષણ બમણું કરે. જમ્યાના એક કલાકમાં ચા કે કૉફી અડધાથી વધુ ઘટાડે. સાથે કેલ્શિયમ — દૂધ, દહીં, કેલ્શિયમની ગોળી — પણ રોકે.',
 'તેથી: દાળ-ભાજી લીંબુ સાથે, ચા સાથે નહીં. દૂધ-દહીં નાસ્તાના સમયે, લોહતત્વવાળા ભોજન સાથે નહીં. ફણગાવવું અને આથો લાવવો (ફણગાવેલા મગ, ઢોકળા, ઈડલી) લોહતત્વને બાંધતું ફાયટેટ ઘટાડે.',
 'ખોરાકથી હળવો પાંડુરોગ ધીમે સુધરે; મધ્યમ કે ગંભીર સુધરતો નથી. હિમોગ્લોબિન ૧૦થી ઓછું હોય તો ગોળી કે ઈન્જેક્શન જરૂરી; ખોરાક સહારો છે, સારવાર નહીં. લોહતત્વની ગોળી ચા, દૂધ અને કેલ્શિયમથી દૂર, વિટામિન C વાળા ખોરાક સાથે લો.'],
 quiz:[['દાળનું લોહતત્વ શોષવામાં શું મદદ કરે?',['જમવા સાથે ચા','જમવા સાથે લીંબુ કે આમળા','જમવા સાથે દૂધ'],1],['જમવા નજીક ચા…',['શોષણ વધારે','શોષણ રોકે','કોઈ અસર નહીં'],1],['ગર્ભાવસ્થામાં હિમોગ્લોબિન ૯ હોય તો…',['માત્ર વધુ ભાજી','ગોળી કે ઈન્જેક્શન + ખોરાક','કશું નહીં'],1]]},
{id:'sugar',i:'🍬',t:'ન દેખાતી ખાંડ',min:3,body:[
 'મર્યાદા રોજ ૨૫ ગ્રામ — પાંચ નાની ચમચી — અને તેમાં બધું ગણાય: દરેક ચામાં બે ચમચી, બિસ્કિટ, મીઠાઈ, "ફ્રૂટ" ડ્રિંક, કેચઅપ, દાળનો ગોળ.',
 'એક કપ મીઠી ચા = ૮–૧૦ ગ્રામ. બે કપ અને બે બિસ્કિટ — બપોર પહેલાં દિવસની મર્યાદા પૂરી. ૩૦૦ મિલી ઠંડા પીણામાં ૩૫ ગ્રામ — એક બોટલમાં આખા દિવસથી વધુ. પેકેટનો "ફ્રૂટ જ્યુસ" સ્વાદવાળું ખાંડનું પાણી છે.',
 'સાચા ફળનો રસ પણ સારો નથી. તમે આખું તરબૂચ પી શકો, પણ આખું ખાઈ ન શકો. રસમાં પાંચ ચીરીની ખાંડ બે મિનિટમાં મળે, રેસા કચરામાં; સુગર ઊછળે, કલાકમાં ફરી ભૂખ. ફળ ચાવવું ધીમું છે, પેટ ભરે છે અને રેસા સાથે આવે છે.',
 '**ફળ ખાવા માટે છે. પાણી પીવા માટે છે.**',
 'ગોળ અને મધ પણ ખાંડ છે. તેમાં ખનિજના અંશ હોય, પણ દિવસની ૫ ચમચીમાં અંશ કશું કરતા નથી અને ખાંડ બધું કરે છે. એ જ રીતે વાપરો — ઓછાં.'],
 quiz:[['રોજની ખાંડની મર્યાદા લગભગ…',['૫ નાની ચમચી','૧૫ નાની ચમચી','કુદરતી ખાંડની મર્યાદા નહીં'],0],['તરબૂચનો રસ કે ચીરી?',['રસ વધુ સારો','ચીરી: રેસા, ધીમું, પેટ ભરે','બંને સરખાં'],1],['ગોળ…',['ખાંડ નથી','ખનિજના અંશ સાથેની ખાંડ','આરોગ્યપ્રદ ખોરાક'],1]]},
{id:'oil',i:'🥄',t:'તેલ, ઘી અને કઢાઈ',min:2,body:[
 'ICMR ૨૦૦૦ કેલરી માટે રોજ લગભગ ૨૭ ગ્રામ દેખાતી ચરબીની છૂટ આપે — માણસ દીઠ ૫–૬ નાની ચમચી, તેલ અને ઘી મળીને. મોટા ભાગનાં ગુજરાતી રસોડાં તેના બે-ત્રણ ગણાં વાપરે. એક મોટી ચમચી = ૧૨૦ કેલરી; દરેક રોટલી પર એક ચમચી ઘી એક કોળિયો વધુ ખાધા વિના રોજ ૩૦૦ કેલરી ઉમેરે.',
 'ઘી ઝેર નથી અને તેલ દવા નથી. બંનેમાં ગ્રામે ૯ કેલરી. ઘીમાં મુખ્યત્વે સંતૃપ્ત ચરબી; સિંગતેલ, રાઈ, તલ, રાઈસ-બ્રાન તેલમાં મુખ્યત્વે અસંતૃપ્ત. વર્ષ દરમિયાન બે-ત્રણ તેલ બદલતા રહો. ઘી સ્વાદ માટે, નાની ચમચીથી.',
 'સાચું જોખમ ફરી વપરાતું તેલ છે. દરેક વખતે ગરમ કરતાં તે કાળું પડે, ઓક્સિડાઈઝ થાય અને ટ્રાન્સ ફેટ બને. ઘરે એક વાર તળેલું તેલ એક વાત; બહારની કઢાઈ જે અઠવાડિયાથી ઉમેરાતી જાય છે તે બીજી.',
 'માપો. તેલ ચમચીથી રેડો, ડબ્બામાંથી નહીં. મહિનાની એક બોટલ રાખો અને જુઓ કેટલું ચાલે: ચાર જણના કુટુંબમાં મહિને લગભગ ૩ લિટર જોઈએ, ૬ નહીં.'],
 quiz:[['માણસ દીઠ રોજ દેખાતી ચરબી?',['૫–૬ નાની ચમચી','૧૨ નાની ચમચી','શૂન્ય સૌથી સારું'],0],['ઘી કે તેલ?',['ઘી ઝેર છે','બંને ૯ કેલરી/ગ્રામ; માત્રા વધુ મહત્વની','તેલ દવા છે'],1],['સૌથી હાનિકારક?',['એક વાર વપરાયેલું તાજું તેલ','વારંવાર ગરમ કરેલું તેલ','નાની ચમચીથી ઘી'],1]]},
{id:'salt',i:'🧂',t:'મીઠું અને બ્લડ પ્રેશર',min:2,body:[
 'રોજ એક નાની ચમચી — ૫ ગ્રામ — મર્યાદા છે. ભારતીયો લગભગ બમણું ખાય છે. બ્લડ પ્રેશર મીઠાની પાછળ ચાલે છે, અને ઊંચું બ્લડ પ્રેશર લકવા અને કિડની ફેલ થવાનું સૌથી મોટું કારણ છે.',
 'મોટા ભાગનું મીઠું મીઠાની ચમચીથી નથી આવતું. પાપડ, અથાણું, છૂંદો, નમકીન, સેવ, ચેવડો, ચિપ્સ, બ્રેડ, બિસ્કિટ, ચીઝ, સોયા સોસ, પાણીપુરીનું પાણી, મેગી અને પેકેટનાં સૂપ લાવે છે. એક પાપડમાં દિવસના મીઠાનો ચોથો ભાગ; નાની વાટકી ચેવડામાં અડધો.',
 'સ્વાદ ત્રણ અઠવાડિયામાં બદલાય. ઓછું મીઠું નાખો; લીંબુ, આદુ, મરચું, કોથમીર, લસણ અને શેકેલા મસાલાથી સ્વાદ લાવો. અથાણું-પાપડ રવિવાર માટે.',
 'ગર્ભાવસ્થામાં ઊંચું બ્લડ પ્રેશર હોય તો મીઠું ઓછું કરવું યોગ્ય, પણ ખોરાક ઓછો નહીં — બ્લડ પ્રેશર માટે કેલરી કે પ્રોટીન કદી ન કાપો.'],
 quiz:[['રોજ મીઠાની મર્યાદા?',['એક નાની ચમચી','ત્રણ નાની ચમચી','એક મોટી ચમચી'],0],['મોટા ભાગનું મીઠું ક્યાંથી?',['ટેબલની મીઠાની ચમચી','પાપડ, અથાણું, નમકીન, પેકેટ','શાકભાજી'],1],['મીઠાનો સ્વાદ…',['કદી બદલાતો નથી','ત્રણ અઠવાડિયામાં બદલાય','એક દિવસમાં બદલાય'],1]]},
{id:'preg',i:'🤰',t:'ગર્ભાવસ્થામાં ખોરાક',min:3,body:[
 '"બે જણ માટે" નહીં. પહેલા ત્રણ મહિનામાં વધારાની કેલરી બિલકુલ નહીં — માત્ર ગુણવત્તા, ખાસ કરીને ફોલેટ (ભાજી, દાળ, ચણા, નારંગી) અને ફોલિક એસિડની ગોળી. ચોથા મહિનાથી લગભગ ૩૫૦ કેલરી વધુ — એક ગ્લાસ દૂધ અને મુઠ્ઠી ચણા, બીજી થાળી નહીં.',
 'પ્રોટીન વચલા મહિનામાં ૧૦ ગ્રામ અને અંતે લગભગ ૨૦ ગ્રામ વધે: વધારાની વાટકી દાળ, દહીં, પનીર કે ઈંડું. લોહતત્વની જરૂર લગભગ બમણી; કેલ્શિયમ ૧૦૦૦ મિગ્રા જ રહે પણ શોષણ આપમેળે વધે. ભારતમાં લોહતત્વ અને કેલ્શિયમની ગોળી સામાન્ય છે કારણ કે ખોરાકથી આ આંકડા ભાગ્યે જ મળે.',
 'દર ૨–૩ કલાકે થોડું ખાવાથી ઊબકા, એસિડિટી અને સુગરમાં રાહત. ભોજન કદી ન છોડો; લાંબો ગાળો ઊબકા વધારે. ટાળો: કાચો કે અધકચરો ખોરાક, કાચું દૂધ અને તેનું પનીર, કાચા ફણગા, બહારના કાપેલા ફળ, લિવર, વિટામિન A ની મોટી માત્રા, દારૂ; ચા-કૉફી બે નાના કપથી ઓછી.',
 'યોગ્ય વજન વધારો: સામાન્ય વજનથી શરૂ કર્યું હોય તો કુલ લગભગ ૧૦–૧૨ કિલો; વધુ વજન હોય તો ૫–૯; ઓછું હોય તો વધુ. પહેલા ત્રણ મહિનામાં લગભગ નહીં, પછી અઠવાડિયે લગભગ ૪૦૦ ગ્રામ. ઓછું કે વધુ હોય તો ડૉક્ટરને મળો — ડાયટ ન કરો.'],
 quiz:[['પહેલા ત્રિમાસિકમાં વધારાની કેલરી?',['કોઈ નહીં — ગુણવત્તા મહત્વની','+૩૫૦','+૬૦૦'],0],['થોડું થોડું વારંવાર કેમ?',['ઊબકા, એસિડિટી અને સુગર','કુલ વધુ ખાવા','રિવાજ'],0],['સામાન્ય વજને વજન વધારો?',['લગભગ ૧૦–૧૨ કિલો','૨૦ કિલો','કશું નહીં'],0]]},
{id:'lact',i:'🤱',t:'સ્તનપાન દરમિયાન ખોરાક',min:2,body:[
 'પહેલા છ મહિના સ્તનપાનમાં રોજ લગભગ ૬૦૦ કેલરી ખર્ચાય — ગર્ભાવસ્થાથી વધુ. તેનો ભાગ ગર્ભાવસ્થાની ચરબીમાંથી આવે; બાકીનું ખોરાકમાંથી. ભૂખી માતા સામાન્ય છે; તેને ખવડાવો.',
 'પ્રોટીન સામાન્યથી ૧૫–૨૦ ગ્રામ વધુ; કેલ્શિયમ ૧૨૦૦ મિગ્રા; લોહતત્વ સલાહ મુજબ ચાલુ. પાણી: દર વખતે સ્તનપાન કરાવો ત્યારે એક ગ્લાસ.',
 'દૂધમાં શું જાય છે: કૅફીન (૩૦૦ મિગ્રા — ત્રણ કપથી ઓછું), દારૂ (ટાળો; લીધો હોય તો દર પેગે બે કલાક રાહ), વિટામિન B12 (શાકાહારી માતાને બાળક માટે પૂરક જરૂરી). શું નથી જતું: ખોરાકની "ગરમી" કે "ઠંડક", મસાલા, કોબી કે દાળનો "વાયુ". રિવાજી પ્રતિબંધોને કોઈ આધાર નથી અને તે ભૂખી માતા પાસેથી સારો ખોરાક લઈ લે છે.',
 'વજન ઘટાડવાનો આ સમય નથી. સ્તનપાન અને સામાન્ય ખોરાકથી વજન મહિનાઓમાં ધીમે ઊતરે. ડાયટ ચરબી ઘટાડતા પહેલાં દૂધ ઘટાડે.'],
 quiz:[['સ્તનપાનમાં વધારાની કેલરી?',['કોઈ નહીં','લગભગ ૬૦૦','૧૫૦૦'],1],['દૂધમાં શું જાય?',['કોબીનો વાયુ','કૅફીન અને દારૂ','ખોરાકની ગરમી'],1],['સ્તનપાનમાં ડાયટ…',['બરાબર છે','ચરબી પહેલાં દૂધ ઘટાડે','સલાહભર્યું'],1]]},
{id:'diabetes',i:'📉',t:'ડાયાબિટીસ અને PCOS થાળીમાં',min:3,body:[
 'ડાયાબિટીસમાં સમસ્યા માત્ર ખાંડ નથી. બધા કાર્બોહાઈડ્રેટ — રોટલી, ભાત, પૌંઆ, ફળ, બટાકા, દૂધ — ગ્લુકોઝ બને છે. પ્રશ્ન એ છે કે કેટલું ઝડપથી અને એક વખતે કેટલું.',
 'કાર્બોહાઈડ્રેટ દિવસમાં વહેંચો: ત્રણ ભોજન અને બે-ત્રણ નાના નાસ્તા, દરેકમાં લગભગ સરખું, મોટું બપોરનું જમણ અને રાતનું છોડવું કદી નહીં. ભોજન છોડવાથી પછીના ભોજનમાં મોટો ઉછાળો.',
 'ધીમા કાર્બોહાઈડ્રેટ પસંદ કરો: બાજરી, જુવાર, આખું ઘઉં, ઓટ્સ, દળિયા, આખા મગ, ચણા — મેંદો, સફેદ બ્રેડ, પૌંઆ, સાબુદાણા, જ્યુસ, મીઠાઈ નહીં. દરેક ભોજનમાં પ્રોટીન અને શાક ઉમેરો; તે ગ્લુકોઝ ધીમો કરે. પહેલાં શાક અને દાળ, પછી રોટલી.',
 'દરેક ભોજન પછી ૧૦–૧૫ મિનિટ ચાલો. હલતા સ્નાયુ ગ્લુકોઝ લઈ લે; અસર કેટલીક દવા જેવી. PCOS માં એ જ નિયમો, અને ૫–૧૦% વજન ઘટવાથી ઘણી સ્ત્રીઓમાં ઓવ્યુલેશન પાછું આવે.',
 'ગર્ભાવસ્થામાં ડાયાબિટીસ હોય તો કાર્બોહાઈડ્રેટ રોજ લગભગ ૧૭૫ ગ્રામથી ઓછું નહીં — બાળકને જોઈએ — અને સૂતા પહેલાં પ્રોટીનવાળો નાસ્તો રાતના કીટોન રોકે.'],
 quiz:[['સુગર કોણ વધારે?',['માત્ર ખાંડ','બધા કાર્બોહાઈડ્રેટ, અલગ ઝડપે','માત્ર ભાત'],1],['ડાયાબિટીસમાં ભોજન છોડવું…',['દિવસની સુગર ઘટાડે','પછીના ભોજનમાં મોટો ઉછાળો','સલાહભર્યું'],1],['જમ્યા પછી…',['સૂઈ જાઓ','૧૦–૧૫ મિનિટ ચાલો','મીઠાઈ ખાઓ'],1]]},
{id:'myths',i:'🧐',t:'દસ માન્યતાઓ',min:3,body:[
 '**રાત્રે ભાત ખાવાથી જાડા થવાય.** ભાતની કેલરી કોઈ પણ સમયે સરખી. માત્રા મહત્વની, સમય નહીં.',
 '**જમ્યા પછી ફળ ખરાબ.** ફળ કોઈ પણ સમયે બરાબર. સમસ્યા જ્યુસ છે, સમય નહીં.',
 '**ઘીથી જાડા થવાય, તેલથી નહીં.** બંને ૯ કેલરી/ગ્રામ. બંને માપો.',
 '**આરોગ્ય માટે પ્રોટીન પાવડર જરૂરી.** માત્ર જ્યારે ખોરાકથી ન પહોંચે. દાળ, દૂધ, પનીર, ઈંડાં, સોયા સસ્તામાં કરે.',
 '**બ્રાઉન બ્રેડ આરોગ્યપ્રદ.** મોટા ભાગની બ્રાઉન બ્રેડ રંગ નાખેલી સફેદ બ્રેડ છે. પહેલા ઘટકમાં "whole wheat" જુઓ — કે રોટલી ખાઓ.',
 '**"સુગર-ફ્રી" મીઠાઈ બરાબર.** તે હજી મેંદો, ચરબી અને ઘણીવાર માલ્ટિટોલ કે ખજૂર છે; થોડી જ.',
 '**ડિટોક્સ શરીર સાફ કરે.** તમારું લિવર અને કિડની મફતમાં કરે છે. જ્યુસ ક્લીન્ઝ ખાંડ ઉમેરે અને રેસા કાઢે.',
 '**ઠંડું પાણી, દહીં અને કેળાંથી શરદી થાય.** વાઈરસથી થાય. આ ખોરાકથી નહીં.',
 '**ઓછું ને ઓછું ખાવું વજન ઘટાડવાનો રસ્તો.** લગભગ ૧૨૦૦ કેલરીથી નીચે શરીર ધીમું પડે અને સ્નાયુ ઘટે; વજન પાછું આવે. પૂરતું પ્રોટીન અને શાક ખાઓ, અનાજ-તેલ-ખાંડ ઘટાડો અને ચાલો.',
 '**હેલ્થ ડ્રિંકથી બાળકો ઊંચાં થાય.** તે વિટામિન સાથેની ખાંડ છે. દૂધ, ઈંડાં, દાળ અને ઊંઘ કામ કરે.'],
 quiz:[['રાત્રે ભાત…',['જાડા કરે','બપોર જેટલી જ કેલરી','વર્જિત'],1],['બ્રાઉન બ્રેડ…',['હંમેશ આખા ઘઉંની','ઘણીવાર રંગેલી સફેદ બ્રેડ','આરોગ્યપ્રદ ખોરાક'],1],['"ડિટોક્સ" જ્યુસ…',['લિવર સાફ કરે','ખાંડ ઉમેરે, રેસા કાઢે','દવા છે'],1]]},
{id:'outside',i:'🛵',t:'બહારનું ખાવું: બેવડો માર',min:3,body:[
 'ભારતમાં બહાર ખાવામાં બે જોખમ એક પર એક ચડેલાં છે. પહેલું બધાને અડધું ખબર છે: ખોરાક તળેલો, ખારો, ગળ્યો અને મોટો. બીજું ભારતીય છે: તેમાં જે છે તે કદાચ ખોરાક જ ન હોય.',
 '**ફરી વપરાતું તેલ.** બહારની કઢાઈ ખાલી નથી થતી, ઉમેરાતી જાય છે. વારંવાર ગરમ થતું તેલ કાળું પડે, ઓક્સિડાઈઝ થાય અને ટ્રાન્સ ફેટ બનાવે. તમે તે જોતા નથી; માત્ર કરકરાપણું ચાખો છો.',
 '**અસલી કરતાં સસ્તી ભેળસેળ.** દૂધમાં ડિટર્જન્ટ, યુરિયા અને સ્ટાર્ચ; પનીર અને માવામાં સ્ટાર્ચ અને કૃત્રિમ રંગ; પ્રતિબંધિત રંગો — બેસન, મીઠાઈ અને હળદરમાં મેટાનિલ યલો, શાક પર મેલાકાઈટ ગ્રીન, ચટણી-સોસમાં રંગ; રાઈના તેલમાં આર્જેમોન; મસાલામાં ચૉક, ઈંટનો ભૂકો અને લાકડાનો વહેર; જ્યુસ અને ગોલામાં સેકરિન અને ગંદા પાણીનો બરફ; ફળ પર કૃત્રિમ પકવવાનાં રસાયણ.',
 '**લેબલ નહીં, તારીખ નહીં, નામ નહીં.** પેકેટ પર બનાવનાર, તારીખ અને યાદી હોય. લારી પર કશું નહીં. પેકેટથી તમને બચાવતો દરેક નિયમ કાઉન્ટર પર અટકી જાય.',
 '**શાંત માત્રા.** અઠવાડિયે એક સમોસું કશું નથી. દસ વર્ષ રોજ બપોરે વડાપાંઉ = ૨૫૦૦ વખત અજાણ્યું તેલ અને અજાણ્યો રંગ. માત્રા ઝેર બનાવે છે, અને ટેવ માત્રા નક્કી કરે છે.',
 'તેથી: બહાર ખાઓ, પણ તળેલાને બદલે બાફેલું, શેકેલું અને તાજું રાંધેલું પસંદ કરો; જ્યાં તેલ અને રસોડું દેખાય ત્યાં બેસો; ભડક રંગની મીઠાઈ, ચટણી અને પીણાં છોડો; ભૂખના ગાળા માટે શેકેલા ચણા કે ફળ સાથે રાખો જે લારી તરફ ખેંચે છે. ઘરે સરળ તપાસ: આયોડિનના ટીપાથી કાળું-ભૂરું થતું પનીર = સ્ટાર્ચ; ઢળતી રકાબી પર લીટો ન મૂકતું દૂધ = પાણી; ઠંડા પાણીમાં તરત રંગ છોડતો મસાલો = રંગ.'],
 quiz:[['ભારતમાં બહાર ખાવાનું બીજું જોખમ…',['કિંમત','ભેળસેળ અને ફરી વપરાતું તેલ','માત્રા'],1],['મેટાનિલ યલો ક્યાં મળે?',['તાજી હળદરની ગાંઠ','રંગેલા બેસન, મીઠાઈ અને હળદર પાવડર','દૂધ'],1],['સૌથી સારું રક્ષણ?',['કદી બહાર ન ખાવું','બાફેલું-તાજું પસંદ કરો; ભડક રંગ ટાળો; નાસ્તો સાથે રાખો','માત્ર મીઠાઈ ખાઓ'],1]]},
];
const BASICS_EXTRA_GU=[
 {i:'🚫',h:'ખરાબ પસંદગી, સીધેસીધી',b:'બિસ્કિટ, કૂકીઝ, ક્રોસાં, બ્રેડ, પેસ્ટ્રી, ઠંડાં પીણાં, ચિપ્સ અને મેગી કોઈ પણ ભાવે ખરાબ ખોરાક છે. કોરો નાસ્તો પણ — ચેવડો, ચવાણું, સેવ, ગાંઠિયા, ફાફડા: સૂકો દેખાય એટલે નિર્દોષ લાગે, પણ તે તળેલો છે; તેલ અંદર ઊતરી ગયું છે. ગરમ નાસ્તો — ભજિયાં, ગોટા, સમોસાં, વડાં — તાજો તળેલો, મોટે ભાગે ફરી વપરાતા તેલમાં. બાફેલું ગુજરાતી ખાણું અપવાદ છે: ઢોકળાં, ખમણ, ખાંડવી, મુઠિયાં, પાતરાં, હાંડવો (ઓછા તેલે), ઈડલી. અને ઈડલી ત્યાં સુધી બરાબર જ્યાં સુધી નારિયેળની ચટણી ન આવે — ચરબી ત્યાં છે.'},
 {i:'🍉',h:'ફળ ખાવા માટે છે. પાણી પીવા માટે છે.',b:'તમે આખું તરબૂચ પી શકો; આખું ખાઈ કદી ન શકો. રસ = બે મિનિટમાં પાંચ ચીરીની ખાંડ, રેસા કચરામાં. ફળ ચાવો.'}];

{id:'rda',t:'આંકડા ક્યાંથી આવે છે',min:7,body:[
 'આ એપનું દરેક લક્ષ્ય — ૫૫ ગ્રામ પ્રોટીન, ૨૯ મિગ્રા લોહતત્વ, ૧૦૦૦ મિગ્રા કેલ્શિયમ — કોઈએ માણસોમાં માપેલો આંકડો છે. કેવી રીતે માપ્યો તે સમજવાથી આંકડા આદેશમાંથી સાધન બને છે.',
 'મોટા ભાગનાં પોષકતત્વો માટે સમિતિ પૂછે: વ્યક્તિને સંતુલન જાળવવા, લોહીનું માર્કર સામાન્ય રાખવા કે શરીરનો સંગ્રહ ભરવા કેટલું જોઈએ? ડઝનબંધ સ્વયંસેવકોમાં આ માપે. જવાબો જુદા પડે — શરીર જુદાં છે — અને ઘંટાકાર વળાંક બનાવે. તેની વચ્ચેનો આંકડો **અંદાજિત સરેરાશ જરૂરિયાત (EAR)**: અડધા સ્વસ્થ લોકોને ઓછું જોઈએ, અડધાને વધુ.',
 'EAR પર લક્ષ્ય રાખીએ તો અડધી વસ્તી ઓછી પડે. તેથી સમિતિ બે સ્ટાન્ડર્ડ ડેવિએશન — લગભગ ૨૦–૨૫% — ઉમેરે અને તેને **RDA** કહે. બનાવટથી જ RDA લગભગ ૯૭.૫% સ્વસ્થ લોકોને આવરે. એટલે કોઈ એક વ્યક્તિ માટે RDA મોટે ભાગે જરૂરિયાતથી વધુ છે. તે વસ્તીનો ખોરાક ગોઠવવાની સલામત છત છે, વ્યક્તિની લઘુતમ નહીં.',
 'તેથી એપ બંને દેખાડે છે. દિવસનું લોહતત્વ EAR ના નિશાને પહોંચે તો વ્યક્તિ કદાચ ઠીક છે; RDA પહોંચે તો લગભગ ચોક્કસ. કેલ્શિયમના RDA ના ૮૫% વાળી યોજના ઊણપ નથી — તે સરેરાશ જરૂરિયાતથી ઉપર છે.',
 'કેલરી અપવાદ છે. કેલરીનો RDA નથી; ૯૭.૫% લોકોને આવરતી છૂટ મોટા ભાગનાને જાડા કરે. કેલરીનાં લક્ષ્ય સરેરાશ પર રાખવામાં આવે, તેથી તે કોષ્ટકમાંથી વાંચવાને બદલે વ્યક્તિ — ઊંચાઈ, વજન, પ્રવૃત્તિ — પ્રમાણે ગોઠવવાં પડે. મિફ્લિન–સેંટ જ્યોર સમીકરણ એ કરે છે, અને તેથી એપ તમારું વજન-ઊંચાઈ પૂછે છે.',
 'ICMR–NIN એ ૨૦૨૦ માં ભારતીયો માટે આ પ્રકાશિત કર્યાં, ૨૦૧૦ ના આંકડા બદલીને. પ્રોટીન RDA ઘટ્યો (૧.૦ → ૦.૮૩ ગ્રામ/કિલો), સ્ત્રીઓનું લોહતત્વ વધ્યું (ભારતીય આહારના નવા શોષણ ડેટાથી), કેલ્શિયમ વધ્યું (૬૦૦ → ૧૦૦૦). આ ફેશન નથી; માપને અનુસરે છે.',
 '"My Plate for the Day" (૨૦૨૪) આ આંકડાનું ખોરાકમાં ભાષાંતર છે: ૨૦૦૦ કેલરી માટે ૨૫૦ ગ્રામ અનાજ, ૮૫ કઠોળ, ૪૦૦ શાક, ૧૦૦ ફળ, ૩૦૦ મિલી દૂધ, ૩૫ ગ્રામ મેવો, ૨૭ ગ્રામ તેલ. આહાર અનાજ, કઠોળ, મેવો અને તેલ તમારી કેલરી પ્રમાણે બદલે છે, અને શાક, ફળ, દૂધ સ્થિર રાખે છે, કારણ કે તે લઘુતમ છે, પ્રમાણ નહીં.',
 'આંકડા જે ન કરી શકે: તમારા વિશે કહેવું. તે સ્વસ્થ વસ્તીનું વર્ણન છે. બીમારી, દવા, ગર્ભાવસ્થાની ગૂંચ, જનીન જરૂરિયાત બદલે. ત્યાં ડૉક્ટર આવે અને કોષ્ટક મૂંગું થાય.'],},
{id:'energy',t:'કેલરીનું સંતુલન, પ્રામાણિકપણે',min:7,body:[
 'મહિનાઓ સુધી અંદર જતી અને બહાર જતી કેલરી જુદી પડે ત્યારે વજન બદલાય. આ વાક્યની બંને બાજુ માપવી લોકો ધારે તેથી અઘરી છે.',
 'બહાર જતી કેલરીના ત્રણ ભાગ. વિશ્રામ ચયાપચય — જીવતા રહેવાનો ખર્ચ, લગભગ ૬૦–૭૦% — મુખ્યત્વે શરીરમાં કેટલું સ્નાયુ-પેશી છે તેના પર આધારિત, તેથી મિફ્લિન–સેંટ જ્યોર સમીકરણ વજન, ઊંચાઈ, ઉંમર અને લિંગ વાપરે. પ્રવૃત્તિ ૧૫–૩૦%, PAL તરીકે ગુણાય (૧.૨ બેઠાડુથી ૧.૯ ખૂબ સક્રિય). પાચનનો ખર્ચ ૧૦%, પ્રોટીન માટે ચરબીથી વધુ.',
 'અંદર જતી કેલરી = ખાધું બાદ ન શોષાયું. ખોરાકનાં કોષ્ટક નમૂનાની સરેરાશ છે; તમારી રોટલી કોષ્ટકની રોટલી નથી. રાંધવાથી વજન બદલાય (પાણી અંદર-બહાર) પણ કેલરી નહીં, તેથી કોષ્ટક કાચું વજન આપે — અને તમારી આંખ રાંધેલું. પ્રામાણિક નોંધ પણ સામાન્ય રીતે સત્યથી ૨૦% ઓછી.',
 '૭૭૦૦ કેલરી પ્રતિ કિલોનો નિયમ — રોજ ૫૦૦ ઓછી ખાઓ, અઠવાડિયે અડધો કિલો ઘટે — એક કિલો ચરબીની કેલરીનું ગણિત છે. પહેલાં અઠવાડિયાં ચાલે, પછી નિષ્ફળ જાય, અને કારણ ઇચ્છાશક્તિ નથી: વજન ઘટતાં હલકું શરીર ઓછું બાળે, અને શરીર ચૂપચાપ હલનચલન ઘટાડે અને વિશ્રામ ચયાપચય અપેક્ષાથી થોડો વધુ ઘટાડે — ચયાપચય અનુકૂલન. ખાધ પોતે સંકોચાય; અટકવું ભૌતિકશાસ્ત્ર છે, નિષ્ફળતા નહીં.',
 'કાંટો રોજ જૂઠું બોલે. એક કિલો પાણી મીઠું, કાર્બોહાઈડ્રેટ (ગ્લાયકોજન પાણી પકડે), માસિક ચક્ર અને છેલ્લા ભોજનના સમય સાથે ફરે. અઠવાડિયે એક વાર, એ જ દિવસે, એ જ સમયે વજન કરો, અને મહિનાનો ઢાળ જુઓ, સવારનો આંકડો નહીં.',
 'સ્ત્રી માટે લગભગ ૧૨૦૦ કેલરીથી નીચે શરીર સ્નાયુમાંથી પ્રોટીન લેવા માંડે અને વિશ્રામ ચયાપચય વધુ ઘટે; જે ઘટે તે અંશતઃ સ્નાયુ હોય અને ચરબી તરીકે પાછું આવે. તેથી એપ કેલરી ૧૨૦૦ થી નીચે નથી જતી, ખાધ ૭૫૦ પર અટકાવે, ઘટાડા દરમિયાન પ્રોટીન ૧.૨ ગ્રામ/કિલો કરે, છ મહિનામાં ૫–૧૦% ને વાસ્તવિક લક્ષ્ય ગણે — અને ગર્ભાવસ્થા, સ્તનપાન, ૧૮ થી નીચે કે ૬૦ થી ઉપર ખાધ મૂકવાની ના પાડે.',
 'વર્ષો સુધી જે ચાલે તે આંકડો નથી. તે થાળીનો આકાર છે — વધુ શાક, દાળ અને પ્રોટીન, ઓછું અનાજ, તેલ અને ખાંડ — અને રોજ હલનચલન અને પૂરતી ઊંઘ. આંકડા આકાર તપાસવા માટે છે, જીવવા માટે નહીં.'],},
{id:'proteinq',t:'પ્રોટીનની ગુણવત્તા',min:7,body:[
 'પ્રોટીન = સાંકળમાં બાંધેલા વીસ એમિનો એસિડ. તેમાંથી નવ શરીર બનાવી શકતું નથી; તે ખોરાકમાંથી આવવા જોઈએ. પ્રોટીન "સંપૂર્ણ" છે જો તે નવેય શરીર જે પ્રમાણમાં બાંધે તેની નજીકના પ્રમાણમાં લાવે.',
 'ઈંડું, દૂધ, માછલી, માંસ સંપૂર્ણ. અનાજમાં લાયસિન ઓછું. કઠોળમાં મિથિયોનીન ઓછું. એક પાસે તે છે જે બીજા પાસે નથી — તેથી દાળ-ભાત, રોટલી-દાળ, ખીચડી, ઈડલી-સાંભાર, ઢોકળાં અને મિસ્સી રોટી દરેક ભારતીય રસોડામાં છે. વજનથી ૩:૧ અનાજ-કઠોળ ઈંડા જેવી એમિનો એસિડ ભાત આપે.',
 'વૈજ્ઞાનિકો DIAAS થી ગુણવત્તા માપે. દૂધનું પ્રોટીન અને ઈંડું લગભગ ૧.૦ કે વધુ; સોયા લગભગ ૦.૯; એકલું આખું ઘઉં લગભગ ૦.૪૫, એકલાં કઠોળ ૦.૬–૦.૮, બંને સાથે લગભગ ૦.૮–૦.૯. સાથે ખાવાથી જે ઉછાળો આવે તે જ પરંપરાગત જોડીઓનો આખો મુદ્દો.',
 'પાચ્યતા પણ મહત્વની. વનસ્પતિ પ્રોટીન રેસા અને ફાયટેટમાં વીંટળાયેલું આવે; રાંધવું, પલાળવું, ફણગાવવું અને આથો લાવવો તેને ખોલે. ફણગાવેલા મગ કાચા કરતાં વધુ વાપરી શકાય તેવું પ્રોટીન આપે; ઢોકળાં સાદા બેસનથી વધુ.',
 'ICMR નો RDA ૦.૮૩ ગ્રામ/કિલો સારી ગુણવત્તાના પ્રોટીન માટે ગણાયો છે. ભારતીય અનાજ-કઠોળ આહાર ઓછી ગુણવત્તા આપે, તેથી ICMR પોતે નોંધે છે કે આવા આહારમાં લગભગ ૧ ગ્રામ/કિલો યોગ્ય લક્ષ્ય — અને આ એપનો મૂળ નિયમ એ જ છે. ગર્ભાવસ્થામાં ૧૦–૨૦ ગ્રામ, સ્તનપાનમાં ૧૫–૨૦ ઉમેરો, વજન ઘટાડતી વખતે ૧.૨ ગ્રામ/કિલો કરો જેથી સ્નાયુ બચે.',
 'સ્નાયુ — જેની મોટા ભાગના લોકોને ચિંતા — દિવસમાં વહેંચાયેલા ભોજન દીઠ ૨૦–૩૦ ગ્રામ પ્રોટીન અને પ્રતિકારક કામ — ઉપાડવું, ચડવું, બેસવું-ઊઠવું, પૌત્રને ઊંચકવું — થી સારો રહે. સ્નાયુ વાપર્યા વિના ખાધેલું પ્રોટીન મોટે ભાગે મોંઘા બળતણ તરીકે બળે.',
 'વ્યવહારુ નિયમ: દરેક ભોજનમાં કઠોળ કે દૂધ-દહીં કે ઈંડું, અનાજ અને કઠોળ સાથે, બને ત્યારે ફણગાવો અને આથો લાવો, અને પૂરક માત્ર ત્યારે જ્યારે ખોરાક બરાબર કર્યા પછી માપેલી ખોટ રહે.'],},
{id:'ironchem',t:'લોહતત્વ: રસાયણનો પાઠ',min:7,body:[
 'ખોરાકમાં લોહતત્વ બે રૂપે આવે. હીમ લોહતત્વ — માંસ, માછલી, મરઘીમાંથી — બીજું જે ખાઓ તેની લગભગ પરવા વિના ૧૫–૩૫% શોષાય. નૉન-હીમ — શાકાહારી આહારનું બધું — ૨–૧૦% શોષાય, અને તે આંકડો બાકીના ભોજન સાથે ઝૂલે.',
 'નૉન-હીમ લોહતત્વ મોટે ભાગે ફેરિક (Fe³⁺) હોય અને આંતરડાની દીવાલ ઓળંગવા ફેરસ (Fe²⁺) બનવું પડે. પેટનો એસિડ શરૂ કરે; વિટામિન C પૂરું કરે અને લોહતત્વને દ્રાવણમાં રાખે. "દાળ સાથે લીંબુ" પાછળનું રસાયણ આ છે: ૫૦ મિગ્રા વિટામિન C — અડધું આમળું, એક જામફળ, એક નારંગી — એ જ થાળીમાંથી શોષાતું લોહતત્વ બમણું કરી શકે.',
 'રોકનારાં બાંધીને કામ કરે. આખા અનાજ-કઠોળનું ફાયટેટ, ચા-કૉફીનાં ટેનિન અને પોલિફિનોલ, દૂધ-દહીં-ગોળીનું કેલ્શિયમ આંતરડામાં લોહતત્વને બાંધે અને તે વણવપરાયેલું નીકળી જાય. જમવા સાથે ચા શોષણ ૬૦–૭૦% ઘટાડે. પલાળવું, ફણગાવવું, આથો લાવવો ફાયટેટ તોડે — પરંપરાગત રીતો લોહતત્વની ટેકનોલોજી છે.',
 'શોષાયા પછી લોહતત્વ ફેરિટિન તરીકે સંગ્રહાય. ફેરિટિન ટેસ્ટ સંગ્રહ બતાવે; હિમોગ્લોબિન માત્ર ફરતું બતાવે. સંગ્રહ પહેલાં, મૂંગે મોઢે ખાલી થાય; હિમોગ્લોબિન છેલ્લે ઘટે. તેથી સામાન્ય હિમોગ્લોબિન વાળી સ્ત્રીનો સંગ્રહ ખાલી હોઈ શકે, અને તેથી ગર્ભાવસ્થામાં ૩૦ થી નીચેનું ફેરિટિન પાંડુરોગ દેખાય તે પહેલાં સારવાર પામે. એક ચેતવણી: ચેપ અને સોજામાં ફેરિટિન વધે, તેથી બીમાર દર્દીનું સામાન્ય મૂલ્ય ઊણપ છુપાવી શકે.',
 'સ્ત્રીઓ કેમ? મહિને ૧૦–૪૦ મિગ્રા માસિક નુકસાન, નવ મહિનામાં બાળક-ઓર-વધારાના લોહી માટે લગભગ ૧૦૦૦ મિગ્રા માગતી ગર્ભાવસ્થા, અને ચા સાથે અનાજ આધારિત આહાર. ભારતીય સ્ત્રીઓ માટે ૨૯ મિગ્રા RDA ૮% શોષણ ધારે; દિવસનો ખોરાક ભાગ્યે જ પહોંચે, તેથી ગોળી સામાન્ય.',
 'ગોળીનું પોતાનું રસાયણ છે. શોષણ ખાલી પેટે વિટામિન C સાથે, ચા-દૂધ-કેલ્શિયમથી બે કલાક દૂર શ્રેષ્ઠ. હાલના અભ્યાસ બતાવે છે કે એકાંતરે દિવસે ગોળી રોજ કરતાં ગોળી દીઠ વધુ શોષાય, કારણ કે દરેક માત્રા પછી આંતરડાનો હોર્મોન હેપ્સિડિન વધે અને આગલી રોકે; જ્યાં આડઅસર રોજની ગોળી અટકાવે ત્યાં આ પ્રમાણભૂત સલાહ બનતી જાય છે.',
 'એક લીટીમાં પાઠ: લોહતત્વ સંગાથની વાત છે — લીંબુ મદદ કરે, ચા અને દૂધ રોકે, હિમોગ્લોબિનથી સંગ્રહ વધુ મહત્વનો, અને ગોળી પણ રસાયણ છે.'],},
{id:'glucose',t:'ગ્લુકોઝ, ઈન્સ્યુલિન અને ગ્લાયસેમિક ઇન્ડેક્સ',min:8,body:[
 'દરેક રોટલી, ભાતનો દરેક દાણો, દરેક કેળું લોહીમાં ગ્લુકોઝ બનીને પૂરું થાય. પ્રશ્ન એ કે કેટલું ઝડપથી આવે અને એક વખતે કેટલું, કારણ કે બંને નક્કી કરે કે સ્વાદુપિંડે કેટલું કામ કરવું અને ઉછાળાનો કેટલો ભાગ ચરબી બને.',
 'ગ્લાયસેમિક ઇન્ડેક્સ (GI) ઝડપ માપે: ખોરાકના ૫૦ ગ્રામ કાર્બોહાઈડ્રેટ પછી સુગર કેટલી ચડે, શુદ્ધ ગ્લુકોઝ = ૧૦૦ સામે. મેંદો, સફેદ બ્રેડ, કોર્નફ્લેક્સ, પૌંઆ, સાબુદાણા, બટાકા ઊંચે (૭૦+); આખું ઘઉં, બાજરી, જુવાર, ઓટ્સ, દળિયા વચ્ચે (૫૦–૬૫); દાળ, ચણા, રાજમા, મોટા ભાગનાં ફળ, દૂધ નીચે (૫૦ થી ઓછા). રેસા, પ્રોટીન, ચરબી અને ખટાશ બધાં ચઢાણ ધીમું કરે — તેથી રોટલી પહેલાં દાળ, ભાત સાથે દહીં અને બધા પર લીંબુ મદદ કરે.',
 'એકલો GI ભ્રમ પેદા કરે, કારણ કે તે માત્રા અવગણે. ગ્લાયસેમિક લોડ (GL) ઝડપને માત્રાથી ગુણે. તરબૂચનો GI ઊંચો પણ એક ચીરીમાં માત્ર ૬ ગ્રામ કાર્બોહાઈડ્રેટ — ઓછો લોડ. હવે તેનો રસ કાઢો. તમે બે મિનિટમાં આખું તરબૂચ પી શકો; આખું ખાઈ કદી ન શકો. રસમાં પાંચ ચીરીની ખાંડ, રેસા કચરામાં, અને લોડ એક સાથે સ્વાદુપિંડ પર પડે. એ જ ખોરાક, એ જ GI, પાંચ ગણો લોડ, બ્રેક બિલકુલ નહીં. **ફળ ખાવા માટે છે. પાણી પીવા માટે છે.** એ જ ગણિત દરેક જ્યુસને લાગુ, "હેલ્ધી" સહિત.',
 'ઈન્સ્યુલિન એ હોર્મોન જે ગ્લુકોઝને લોહીમાંથી સ્નાયુ, લિવર અને ચરબીમાં ખસેડે. ઈન્સ્યુલિન પ્રતિરોધ — ટાઈપ ૨ ડાયાબિટીસ, PCOS, મેદસ્વિતા અને દરેક સ્ત્રી માટે ગર્ભાવસ્થાનો ઉત્તરાર્ધ — એટલે કોષો ટકોરાનો જવાબ ધીમે આપે; સ્વાદુપિંડ મોટેથી બોલે; ગ્લુકોઝ વધુ વાર ઊંચું રહે. ગર્ભાવસ્થા આ હેતુપૂર્વક કરે: ઓરના હોર્મોન ઈન્સ્યુલિન મંદ કરે જેથી બાળક તરફ વધુ ગ્લુકોઝ વહે. મોટા ભાગની સ્ત્રીઓમાં સ્વાદુપિંડ પહોંચી વળે; ન પહોંચે ત્યારે ગર્ભાવસ્થાનો ડાયાબિટીસ દેખાય, સામાન્ય રીતે ૨૪ અઠવાડિયા પછી, તેથી તપાસ ત્યારે.',
 'બે સાધન કોઈ દવા વિના કામ કરે. પહેલું, કાર્બોહાઈડ્રેટ પાંચ-છ વખતમાં વહેંચવાથી દરેક લોડ નાનો રહે. બીજું, જમ્યા પછી સ્નાયુ હલાવવા: સંકોચાતો સ્નાયુ ઈન્સ્યુલિન વિનાના અલગ દરવાજેથી ગ્લુકોઝ ખેંચે. જમ્યા પછી ૧૦–૧૫ મિનિટ ચાલવાથી ઘણા અભ્યાસમાં ભોજન પછીનું શિખર ૨૦–૩૦ mg/dL ઘટે — ગોળી જેવું. જમ્યા પછી બેસી રહેવું સૌથી ખરાબ; સૂઈ જવું તેમાં એસિડિટી ઉમેરે.',
 'ગર્ભાવસ્થાના ડાયાબિટીસમાં લક્ષ્ય કડક — ઉપવાસી ૯૫ થી નીચે, જમ્યાના બે કલાકે ૧૨૦ થી નીચે — કારણ કે બાળક માતાના ગ્લુકોઝ પર ઊગે અને વધુ પર વધુ મોટું થાય. કાર્બોહાઈડ્રેટ રોજ લગભગ ૧૭૫ ગ્રામથી નીચે ન જાય, બાળકનું મગજ તેના પર ચાલે; યુક્તિ વહેંચણી અને ગુણવત્તા છે, બંધી નહીં. સૂતા પહેલાં પ્રોટીનવાળો નાસ્તો રાતનો ઉપવાસ કીટોન ન બનાવે તે જુએ.',
 'GI જે નહીં કહે: ખોરાકની સારાઈ. ચરબીને કારણે આઈસક્રીમનો GI બાજરીના રોટલાથી ઓછો. GI એક કાંટો છે. થાળી — પહેલાં શાક, દરેક ભોજનમાં કઠોળ, આખું અનાજ, માપેલું તેલ, પ્રવાહી ખાંડ નહીં — આખું સાધન છે.'],},
{id:'pregphys',t:'ગર્ભાવસ્થાનું શરીરશાસ્ત્ર થાળીમાં',min:8,body:[
 'ગર્ભાવસ્થા પૂર્ણ સમયે લગભગ ૧૨ કિલો નવી સામગ્રી બનાવે: ૩ કિલો બાળક, ૦.૬ કિલો ઓર, ૦.૮ કિલો પાણી, ૧ કિલો ગર્ભાશય અને સ્તન, ૧.૫ કિલો વધારાનું લોહી, ૧.૫ કિલો વધારાનું પ્રવાહી, અને સ્તનપાનના ભંડાર તરીકે ૩–૪ કિલો માતાની ચરબી. તેનો દરેક ગ્રામ થાળીમાંથી બને. વધારો વૈકલ્પિક નથી; તે બાંધકામ છે.',
 'લોહીનું પ્રમાણ લગભગ દોઢું થાય. પ્લાઝ્મા — પાણીવાળો ભાગ — લાલ કોષોથી વધુ વધે, તેથી સંપૂર્ણ પોષિત સ્ત્રીમાં પણ હિમોગ્લોબિનની સાંદ્રતા ઘટે. તેથી બીજા ત્રિમાસિકમાં પાંડુરોગની મર્યાદા ૧૦.૫ થાય અને ૨૦ અઠવાડિયે ૧૧ સામાન્ય છે, ઓછું નહીં. પણ સાચી લોહતત્વની જરૂર લગભગ બમણી: રોજ ૨૭ મિગ્રા, જેમાંથી ગર્ભાવસ્થામાં લગભગ ૧૦૦૦ મિગ્રા બાળક, ઓર અને નવા લાલ કોષોમાં જાય. ખોરાક એકલો ભાગ્યે જ આપે, તેથી સર્વત્ર લોહતત્વની ગોળી.',
 'ફોલેટ — વિટામિન B9 — ગર્ભધારણ પછીના પહેલા ૨૮ દિવસમાં, ઘણીવાર ગર્ભ જણાય તે પહેલાં, બાળકની કરોડ અને મગજની નળી બંધ કરે. એ ગાળામાં ઊણપથી કરોડની ખોડ થાય. તેથી ગર્ભ વિચારતી દરેક સ્ત્રીને અને પહેલાં બાર અઠવાડિયાં ફોલિક એસિડ અપાય, અને તેથી એપ પહેલા અઠવાડિયાથી ગર્ભાવસ્થાનું ફોલેટ લક્ષ્ય વાપરે, ચૌદમાથી નહીં. ભાજી, દાળ, ચણા મદદ કરે; ગોળી અનિવાર્ય.',
 'કેલ્શિયમની જરૂર ૧૦૦૦ મિગ્રા જ રહે, જે નવાઈ પમાડે, કારણ કે બાળકનું હાડપિંજર લગભગ ૩૦ ગ્રામ લે. શરીર આંતરડાથી કેલ્શિયમ શોષણ લગભગ બમણું કરીને જવાબ આપે — હોર્મોનલ ગોઠવણ જે ખોરાકમાં શોષવા જેટલું કેલ્શિયમ હોય તો મફત. દૂધ, દહીં, રાગી, તલ કે ભાજી ઓછી હોય તો બાળક માતાનાં હાડકાંમાંથી કેલ્શિયમ લે. ૧૪ અઠવાડિયાથી ભારતીય ગોળી એટલે કે એ આહાર સામાન્ય છે, અને ઓછા સેવનવાળી સ્ત્રીઓમાં કેલ્શિયમ પ્રી-એક્લેમ્પ્સિયાનું જોખમ પણ ઘટાડે.',
 'કેલરી: પહેલા ત્રિમાસિકમાં વધારાની નહીં, બીજા-ત્રીજામાં લગભગ ૩૫૦ — એક ગ્લાસ દૂધ અને મુઠ્ઠી ચણા, કે દાળ સાથે વધારાની રોટલી. "બે જણ માટે" ખાવું વધારો બમણો કરે, અને વધારાનું માતા પર ચરબી તરીકે બેસે, ગર્ભાવસ્થાના ડાયાબિટીસ, મોટાં બાળકો અને અઘરી પ્રસૂતિનાં જોખમ સાથે. સામાન્ય શરૂઆતી વજને ૧૦–૧૨ કિલો, વધુ વજને ૫–૯.',
 'પ્રોટીન: બીજા ત્રિમાસિકમાં લગભગ ૧૦ ગ્રામ અને ત્રીજામાં ૨૦ વધુ, કારણ કે બાળકની વૃદ્ધિ મોડી ઝડપ પકડે. અનાજના આહારમાં તે રોજ વધારાની વાટકી દાળ અને દહીં.',
 'પ્રોજેસ્ટેરોન હેઠળ આંતરડું ધીમું પડે — તેથી કબજિયાત, એસિડિટી અને ઊબકા. થોડું, વારંવાર; રેસા અને પાણી; ઊબકા માટે વહેલી સવારે સૂકું અનાજ; એસિડિટી માટે રાત્રે મોડું મોટું કશું નહીં. થોડું-વારંવાર રિવાજ નથી; ધીમા આંતરડાનો જવાબ છે.',
 'અને દૂર શું રાખવું: કાચો-અધકચરો ખોરાક, કાચું દૂધ (લિસ્ટેરિયા ઓર ઓળંગે), કાચા ફણગા, લિવર અને વિટામિન A ની મોટી માત્રા (વધારે હોય તો ખોડ કરે), દારૂ (સલામત માત્રા નથી), મોટી શિકારી માછલી (પારો), બે નાના કપથી વધુ ચા-કૉફી.'],},
{id:'milk',t:'માતાનું દૂધ ખોરાક તરીકે',min:6,body:[
 'માનવ દૂધ લગભગ ૮૭% પાણી, ૭% લેક્ટોઝ, ૪% ચરબી અને ૧% પ્રોટીન, સાથે ખનિજો, વિટામિન, એન્ટિબોડી, હોર્મોન અને જીવતા કોષોની લાંબી યાદી. ચાર મહિને માતા રોજ લગભગ ૭૫૦ મિલી બનાવે. એ દૂધની કેલરી અને બનાવવાનો ખર્ચ રોજ લગભગ ૬૦૦ કેલરી — ગર્ભાવસ્થાએ કદી માગ્યું તેથી વધુ.',
 'શરીર તેનો ભાગ ગર્ભાવસ્થામાં મૂકેલી ચરબીમાંથી પૂરે, તેથી સ્તનપાન કરાવતી સ્ત્રીઓ પ્રયત્ન વિના ધીમે વજન ઉતારે. બાકીનું ખાવું પડે. સ્તનપાન કરાવતી માતા શારીરિક કારણે ભૂખી છે; તેને ખવડાવવું બાળકને ખવડાવવું છે.',
 'માતા જે ખાય તે કેટલુંક બદલે, કેટલુંક નહીં. દૂધમાં પ્રોટીન અને લેક્ટોઝ લગભગ નિશ્ચિત; ઓછું ખાતી માતા લગભગ સામાન્ય ગુણવત્તાનું પણ ઓછું દૂધ બનાવે, અને ખોટ પોતાના શરીરમાંથી લે. ચરબીની માત્રા ધાવણ અને દિવસ દરમિયાન બદલાય; ચરબીનો પ્રકાર માતાના આહારને અનુસરે — માછલી, તલ, અખરોટનું ઓમેગા-૩ દૂધમાં દેખાય. પાણીમાં દ્રાવ્ય વિટામિન અને B12 સેવનને નજીકથી અનુસરે: B12 ઓછી શાકાહારી માતા B12-ઓછું દૂધ બનાવે, અને બાળક મહિનાઓમાં ઊણપ પામે. ભારતીય શાકાહારી માતાઓએ બાળક માટે લેવા જેવું આ એક પૂરક.',
 'કૅફીન દૂધમાં ઓછી માત્રામાં જાય; રોજ ત્રણ કપથી ઓછું સલામત. દારૂ મુક્તપણે જાય અને લોહીની ઝડપે નીકળે — પેગ દીઠ લગભગ બે કલાક; ટાળવું સૌથી સરળ. નિકોટિન, મોટા ભાગની નશીલી દવા અને થોડી દવાઓ જાય; કોઈ પણ પ્રિસ્ક્રિપ્શન ફાર્માસિસ્ટ તપાસી શકે.',
 'શું નથી જતું: ખોરાકની "ગરમી" કે "ઠંડક", મસાલા, કોબી કે દાળનો "વાયુ". સ્વાદ હળવા જાય, અને બાળકો સ્વીકારે. નવી માતા માટે પ્રતિબંધિત ખોરાકની લાંબી રિવાજી યાદીઓને દૂધના રસાયણમાં કોઈ આધાર નથી અને તે જેને સૌથી વધુ જોઈએ તેની પાસેથી દાળ, શાક અને ફળ લઈ લે.',
 'પ્રવાહી: દર વખતે ધવડાવો ત્યારે એક ગ્લાસ પાણી કે દૂધ પૂરતું; લિટર ઠાંસવાથી દૂધ વધતું નથી. લોહતત્વ અને કેલ્શિયમ ચાલુ; ICMR કેલ્શિયમ ૧૨૦૦ મિગ્રા અને પહેલા છ મહિના પ્રોટીન સામાન્યથી લગભગ ૧૭ ગ્રામ વધુ રાખે.',
 'ડાયટ ચરબી ઘટાડતા પહેલાં દૂધ ઘટાડે. સ્તનપાન અને સામાન્ય ખોરાકથી છથી બાર મહિનામાં વજન ઠરે. ધીરજ એ શરીરશાસ્ત્ર છે.'],},
{id:'fibre',t:'રેસા અને આંતરડું',min:6,body:[
 'રેસા વનસ્પતિ ખોરાકનો એ ભાગ જે તમારા ઉત્સેચકો પચાવી ન શકે. સદી સુધી તે નિષ્ક્રિય ગણાયા — "ભૂસું". હવે સ્પષ્ટ છે કે તે મોટા આંતરડાના કરોડો બેક્ટેરિયાને ખવડાવે, અને તેમાંથી તે જે બનાવે તે આખા શરીરે પહોંચે.',
 'બે પ્રકાર. અદ્રાવ્ય રેસા — ઘઉંનું ભૂસું, શાકની છાલ, આખા અનાજનું કવચ — પાણી અને જથ્થો પકડે, આંતરડું ચલાવે. દ્રાવ્ય રેસા — ઓટ્સ, દાળ, ચણા, ફળ, અળસી, ઈસબગોલ — જેલ બને જે ગ્લુકોઝ અને ચરબીનું શોષણ ધીમું કરે અને બેક્ટેરિયા તેને ટૂંકી સાંકળના ફેટી એસિડમાં આથો લાવે: એસિટેટ, પ્રોપિયોનેટ, બ્યુટિરેટ.',
 'બ્યુટિરેટ મોટા આંતરડાની દીવાલના કોષોને ખવડાવે અને અવરોધ ચુસ્ત રાખે; પ્રોપિયોનેટ લિવરને ઓછું ગ્લુકોઝ બનાવવા સંકેત આપે; એસિટેટ મગજે પહોંચે અને ભૂખ પર અસર કરે. સારા ખવાયેલા બેક્ટેરિયા સોજો કરતી જાતોને હાંકે. ઓછા રેસાનો આહાર દિવસોમાં આ વ્યવસ્થાને ભૂખે મારે.',
 'ICMR ૨૦૦૦ કેલરી માટે લગભગ ૩૦ ગ્રામ રેસાની ભલામણ કરે. સામાન્ય શુદ્ધ ભારતીય આહાર ૧૦–૧૫ આપે. ખોટ એ છે: આખી દાળ અને દાળનું પાણી, રોટલી અને મેંદો, ફળ અને જ્યુસ, મુખ્ય વાનગી તરીકે શાક અને સજાવટ તરીકે શાક વચ્ચેનો તફાવત. દરેક વાટકી આખી દાળ ૪–૬ ગ્રામ; રાંધેલા શાકની વાટકી ૩–૪; એક ફળ ૨–૩; બાજરીનો રોટલો ૩.',
 'આથાવાળો ખોરાક બીજો અડધો ભાગ. દહીં, છાશ, ઢોકળાં, ઈડલી, ઢોસા, ખમણ, કાંજી અને અથાણાંમાં જીવતા બેક્ટેરિયા કે તેમનાં ઉત્પાદન. આથો અનાજ-કઠોળ અગાઉથી પચાવે, ફાયટેટ તોડે (લોહતત્વ-જસત મુક્ત કરે) અને B વિટામિન બનાવે. ગુજરાતી થાળી અહીં અનાયાસે ઉત્તમ — જ્યાં સુધી આથાવાળો ખોરાક બાફેલો હોય, તળેલો નહીં.',
 'રેસા ધીમે વધારો, અઠવાડિયાંમાં, પાણી સાથે. વાયુ બેક્ટેરિયાની ઉજવણી છે; વસ્તી બદલાતાં શમે. ગર્ભાવસ્થામાં પ્રોજેસ્ટેરોનના ધીમા આંતરડાનો જવાબ રેસા અને પાણી, કોઈ પણ દવાથી સારો.'],},
{id:'tables',t:'ખોરાકનું કોષ્ટક કેવી રીતે બને',min:6,body:[
 'આ એપમાં કાચા ખોરાકનો દરેક આંકડો હૈદરાબાદની ICMR–NIN એ પ્રકાશિત કરેલા Indian Food Composition Tables 2017 માંથી છે. તે કેવી રીતે બન્યાં તે જાણવાથી ખબર પડે ત્રીજા દશાંશ પર કેટલો ભરોસો રાખવો.',
 'ટીમે ભારતના છ પ્રદેશોમાંથી ૫૨૮ ખોરાક લીધા, દરેક ખોરાક દરેક પ્રદેશના અનેક બજારોમાંથી, જુદી ઋતુમાં, અને નમૂના ભેળવ્યા જેથી કોષ્ટકની એક લીટી દેશની સરેરાશ હોય, એક દુકાનની નહીં. દરેક ભેળવેલો નમૂનો પ્રયોગશાળામાં પૃથક્કરણ પામ્યો — અંદાજ નહીં — લગભગ ૧૫૦ ઘટક માટે: કેલરી, પ્રોટીન, ચરબી, કાર્બોહાઈડ્રેટ, રેસા, દરેક ખનિજ, દરેક વિટામિન, એમિનો એસિડ, ફેટી એસિડ, કેરોટિનોઈડ, ફાયટેટ, પોલિફિનોલ.',
 'મૂલ્યો ખાદ્ય ભાગના ૧૦૦ ગ્રામ, કાચા માટે છે. "ખાદ્ય" એટલે છાલ, બી, દાંડી જે ફેંકો તે કાઢી નાખેલાં. "કાચું" એટલે રાંધતાં પહેલાં. દુનિયાભરની આ પ્રથા, કારણ કે રાંધવાથી વજન બદલાય — ભાત પાણી શોષીને ત્રણ ગણો, પાલક પાણી ગુમાવી અડધી — પણ પોષકતત્વો મોટે ભાગે રહે. આ એપમાં વાનગીનાં મૂલ્ય કાચા ઘટકો ઉમેરીને બને, તેથી વાનગીની માત્રા "૩૦ ગ્રામ કાચું" કહેવાય જોકે તમારી સામેની વાટકી રાંધેલી ૧૦૦ ગ્રામ હોય.',
 'રાંધવું શું બદલે: વિટામિન C અને ફોલેટ ગરમી અને પાણીમાં સમય સાથે ઘટે; થાયમિન ખાવાના સોડાથી; લોહતત્વ અને કેલ્શિયમ અસ્પૃશ્ય; પ્રોટીન અને કેલરી અસ્પૃશ્ય. તળવું શોષાયેલું તેલ ઉમેરે — એપ તેને ઘટક તરીકે ઉમેરે. આથો અને ફણગા માત્રા કરતાં ઉપલબ્ધતા બદલે.',
 'બે કોષ્ટક અસંમત હોય — IFCT, USDA, લેબલ — તો સામાન્ય રીતે જાત, માટી, ઋતુ કે પદ્ધતિ. ભારતીય ઘઉંમાં અમેરિકન કરતાં ઓછું લોહતત્વ; ભારતીય દૂધ ગાય જેટલું ભેંસનું અને વધુ ચરબીવાળું. તેથી ભારતીય કોષ્ટક મહત્વનું, અને તેથી એપ IFCT પસંદ કરે અને લેબલના ખોરાકને તેમ દર્શાવે.',
 'પ્રામાણિક વાંચન: કેલરી અને મુખ્ય પોષકતત્વો લગભગ ૧૦% સુધી સારાં; ખનિજ ૨૦%; વિટામિન ૩૦% કે ખરાબ, કારણ કે તાજગી સાથે ખૂબ બદલાય. ફોલેટ લક્ષ્યના ૯૨% બતાવતી યોજના ખરેખર ૭૦ અને ૧૧૫ વચ્ચે કશેક છે. પટ્ટીઓને હોકાયંત્ર તરીકે વાપરો, માઈક્રોમીટર તરીકે નહીં. દિશા ભરોસાપાત્ર; દશાંશ નહીં.'],},
{id:'upf',t:'અતિ-પ્રોસેસ્ડ ખોરાક',min:7,body:[
 'બ્રાઝિલના સંશોધકોએ ૨૦૦૯ માં ખોરાકને પોષકતત્વોથી નહીં પણ તેની સાથે શું કરાયું તેથી વર્ગીકૃત કરવા સૂચવ્યું. NOVA પદ્ધતિમાં ચાર જૂથ. જૂથ ૧: અપ્રોસેસ્ડ કે ન્યૂનતમ — ઘઉં, દાળ, શાક, દૂધ, ઈંડાં, મેવો. જૂથ ૨: રસોઈના ઘટક — તેલ, ઘી, ખાંડ, મીઠું. જૂથ ૩: પ્રોસેસ્ડ — બ્રેડ, ચીઝ, અથાણું, દહીં; જૂથ ૧ + જૂથ ૨. જૂથ ૪: **અતિ-પ્રોસેસ્ડ** — ખોરાકમાંથી કાઢેલા કે બનાવેલા પદાર્થોથી કારખાનામાં બનેલાં મિશ્રણ: શુદ્ધ લોટ અને સ્ટાર્ચ, પ્રોટીન આઈસોલેટ, હાઈડ્રોજનેટેડ તેલ, ખાંડ અને સિરપ, અને રંગ-સ્વાદ-પોત-ટકાઉપણા માટેનાં ઉમેરણ. બિસ્કિટ, ચિપ્સ, મેગી, ઠંડાં પીણાં, કોર્નફ્લેક્સ, "હેલ્થ" ડ્રિંક, પેકેટનું નમકીન, આઈસક્રીમ, મોટા ભાગની બ્રેડ-બેકરી.',
 'કેલરી સરખી હોય તો વર્ગ કેમ મહત્વનો? કારણ કે સરખી કેલરીના આહારની તુલના કરતા મોટા અભ્યાસોએ જોયું કે અતિ-પ્રોસેસ્ડ જૂથ મુક્તપણે ખાવા દેતાં રોજ લગભગ ૫૦૦ કેલરી વધુ ખાય, વજન વધારે અને લોહીનાં માર્કર ખરાબ બતાવે. ખોરાક ઝડપથી અને જથ્થામાં ખવાય તે રીતે બનાવાયો: નરમ, એકસરખો, ચાવવાનું નહીં, મીઠું-ખાંડ-ચરબી એ પ્રમાણમાં જે તૃપ્તિનો સંકેત બંધ કરે.',
 'બિસ્કિટ અને રોટલીમાં સરખી કેલરી હોઈ શકે. રોટલી ચાવવામાં બે મિનિટ, દાળ સાથે આવે, અને તમને રોકે. બિસ્કિટ દસ સેકન્ડ, બારના પેકેટમાં આવે, અને આગલું માગે. સરખી કેલરી, કલાક પછી જુદી ભૂખ.',
 'લેબલ ઉદ્યોગનો જવાબ છે, અને તે નબળો છે. "હાઈ પ્રોટીન" = બિસ્કિટમાં પ્રોટીન આઈસોલેટ ઉમેર્યું. "લોહતત્વ-વિટામિન યુક્ત" = જે ખોરાકમાં કશું ન હોય તેના પર થોડા મિલિગ્રામ છાંટ્યા — અનાજ હજી ખાંડ છે. "ખાંડ ઉમેરેલી નથી" = ઘણીવાર ફળનું ઘટ્ટ, જે ખાંડ છે. "મલ્ટિગ્રેન" = અનેક શુદ્ધ અનાજ. "સુગર-ફ્રી" = માલ્ટિટોલ અને મેંદો. જે પેકેટને સાત દાવા જોઈએ તે તમને કશુંક કહે છે.',
 'ભારતીય રસોડામાં રેખા સરળ. તમારી દાદી તેને ખોરાક તરીકે ઓળખે અને તે અઠવાડિયામાં બગડે, તો જૂથ ૧–૩. એક વર્ષ ટકે, દુકાનમાં ન મળે તેવા ઘટકોની યાદી હોય, અને પેકેટ પર કાર્ટૂન હોય, તો જૂથ ૪. પેકેટનો કોરો નાસ્તો — ચેવડો, ચવાણું — ગુજરાતી નામ સાથેનું જૂથ ૪.',
 'વ્યવહારુ નિયમ શૂન્ય નથી. તે છે: અતિ-પ્રોસેસ્ડ ખોરાક ક્યારેક મજા તરીકે, કદી રોજના ભોજન કે નાસ્તા તરીકે નહીં, કદી બાળકના નાસ્તા તરીકે નહીં, અને જે ખોરાકની નકલ કરે તેની સાથે કદી ભેળવવો નહીં. તાજું ફળ, શેકેલા ચણા, મુઠ્ઠી સિંગ, દહીં, ખાખરો — આ નાસ્તા પેકિંગ પહેલાં હતા, અને હજી કામ કરે છે.'],},
];
