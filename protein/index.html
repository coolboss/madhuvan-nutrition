<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Protein Planner</title>
<meta name="description" content="Daily protein plan from Indian home food, with low-cost supplements only to fill the gap. Pregnancy, breastfeeding and adults.">
<meta name="theme-color" content="#2E6A4B">
<script src="clinic-config.js"></script>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hind+Vadodara:wght@400;500;600;700&family=Hind:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#F4F6F1; --surface:#FFFFFF; --sunk:#E9EDE5; --line:#D5DDD3;
  --fg:#18231C; --muted:#5A6A5F;
  --mung:#2E6A4B; --mung-soft:#DCEBDF; --mung-ink:#FFFFFF;
  --saffron:#C9781A; --saffron-soft:#F7E6CC;
  --warn:#A9461F; --warn-soft:#F6E0D6;
  --body:"Hind Vadodara","Hind","Noto Sans Gujarati","Noto Sans Devanagari","Segoe UI",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111813; --surface:#19221C; --sunk:#202B23; --line:#2E3B32;
  --fg:#E4ECE6; --muted:#9AAC9F;
  --mung:#74C79B; --mung-soft:#203A2B; --mung-ink:#0E1510;
  --saffron:#EAA449; --saffron-soft:#3A2B16;
  --warn:#EE8E66; --warn-soft:#3B2219; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111813; --surface:#19221C; --sunk:#202B23; --line:#2E3B32;
  --fg:#E4ECE6; --muted:#9AAC9F;
  --mung:#74C79B; --mung-soft:#203A2B; --mung-ink:#0E1510;
  --saffron:#EAA449; --saffron-soft:#3A2B16;
  --warn:#EE8E66; --warn-soft:#3B2219; color-scheme:dark}

*{box-sizing:border-box}
html{scroll-padding-top:12px}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-top:calc(16px + env(safe-area-inset-top,0px));padding-bottom:calc(48px + env(safe-area-inset-bottom,0px))}
.wrap{max-width:1140px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{margin:0;line-height:1.2;text-wrap:balance}
h1{font-size:clamp(1.5rem,4vw,2.1rem);font-weight:700;letter-spacing:-.01em}
h2{font-size:1.2rem;font-weight:700}
h3{font-size:1rem;font-weight:600}
p{margin:0}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:.875rem}
[hidden]{display:none!important}
button{font-family:inherit}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--saffron);outline-offset:2px}

header.top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:12px}
.clinic{font-size:.85rem;color:var(--mung);font-weight:600}
.toprow{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
nav.tabs{display:flex;gap:4px;background:var(--sunk);padding:4px;border-radius:12px;flex-wrap:wrap}
nav.tabs button{border:0;background:transparent;color:var(--muted);font-weight:600;font-size:.95rem;padding:8px 13px;border-radius:9px;cursor:pointer}
nav.tabs button[aria-selected="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.langsel{width:auto;font-size:.9rem;font-weight:600;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px}

.banner{background:var(--mung);color:var(--mung-ink);padding:10px 14px;border-radius:12px;font-weight:600;display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}
.banner small{font-weight:400;opacity:.9}

.grid{display:grid;grid-template-columns:330px minmax(0,1fr);gap:22px;align-items:start}
@media (max-width:860px){.grid{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:16px;min-width:0}
@media (min-width:861px){.inputs{position:sticky;top:12px;max-height:calc(100vh - 24px);overflow:auto}}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>label,.lbl{font-size:.85rem;font-weight:600;color:var(--muted)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
input[type=number],input[type=search],input[type=text],select,textarea{width:100%;font:500 1rem var(--body);color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 11px}
textarea{min-height:64px;resize:vertical}
.seg{display:flex;background:var(--sunk);border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:transparent;color:var(--muted);font-weight:600;font-size:.9rem;padding:7px 4px;border-radius:8px;cursor:pointer;min-width:0;line-height:1.25}
.seg button[aria-pressed="true"]{background:var(--mung);color:var(--mung-ink)}
.seg button .small{display:block;font-weight:500;font-size:.75rem;opacity:.85}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--bg);color:var(--fg);font-weight:500;font-size:.85rem;padding:5px 11px;border-radius:999px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--warn-soft);border-color:var(--warn);color:var(--warn);text-decoration:line-through}
.chip.on[aria-pressed="true"]{background:var(--mung-soft);border-color:var(--mung);color:var(--mung);text-decoration:none}
.slider{display:flex;align-items:center;gap:10px}
.slider input{flex:1;accent-color:var(--mung)}
.slider output{font-weight:700;min-width:4.6em;text-align:right}
.hint{font-size:.82rem;color:var(--muted);line-height:1.4}
details.doc{border:1px solid var(--line);border-radius:12px;padding:0}
details.doc summary{cursor:pointer;padding:10px 12px;font-weight:600;list-style:none;display:flex;justify-content:space-between;align-items:center}
details.doc summary::after{content:"+";font-size:1.2rem;color:var(--muted)}
details.doc[open] summary::after{content:"–"}
details.doc>.in{padding:0 12px 12px;display:flex;flex-direction:column;gap:12px}
.prices{display:grid;grid-template-columns:minmax(0,1fr) 92px;gap:6px 10px;align-items:center;font-size:.85rem}
.prices input{padding:6px 8px;font-size:.95rem}

/* result */
.result{display:flex;flex-direction:column;gap:18px;min-width:0}
.target{display:flex;flex-wrap:wrap;gap:14px 28px;align-items:flex-end;padding:20px;border-radius:14px;background:var(--mung-soft)}
.big{font-weight:700;font-size:clamp(3rem,9vw,4.4rem);line-height:.95;color:var(--mung);letter-spacing:-.03em}
.big small{font-size:.32em;font-weight:600;letter-spacing:0;margin-left:5px}
.target .why{flex:1;min-width:220px;display:flex;flex-direction:column;gap:4px;font-size:.9rem}
.bar{position:relative;height:16px;background:var(--sunk);border-radius:8px;display:flex}
.bar span{height:100%}
.bar .f{background:var(--mung);border-radius:8px 0 0 8px}
.bar .s{background:var(--saffron)}
.bar .mark{position:absolute;top:-5px;bottom:-5px;width:2px;background:var(--fg)}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:.85rem;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.alert{padding:12px 14px;border-radius:10px;background:var(--warn-soft);color:var(--fg);border-left:4px solid var(--warn);font-size:.92rem}
.days{display:flex;gap:4px;background:var(--sunk);padding:4px;border-radius:12px;overflow-x:auto}
.days button{flex:1;min-width:44px;border:0;background:transparent;color:var(--muted);font-weight:600;font-size:.9rem;padding:7px 4px;border-radius:9px;cursor:pointer}
.days button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.meals{display:flex;flex-direction:column}
.meal{display:grid;grid-template-columns:105px minmax(0,1fr);gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.meal:first-child{border-top:0}
@media (max-width:520px){.meal{grid-template-columns:minmax(0,1fr);gap:6px}}
.meal .when{font-weight:700;font-size:.95rem}
.meal .when .t{display:block;font-weight:400;font-size:.8rem;color:var(--muted)}
.items{display:flex;flex-direction:column;gap:6px}
.item{border-radius:10px}
.item .line{display:flex;gap:10px;align-items:baseline;justify-content:space-between;width:100%;border:0;background:transparent;color:inherit;text-align:left;padding:4px 6px;border-radius:8px;cursor:pointer;font-size:1rem}
.item .line:hover{background:var(--sunk)}
.item .nm{min-width:0;line-height:1.35}
.item .nm b{font-weight:600}
.item .gu{display:block;font-size:.85rem;color:var(--muted)}
.pg{flex:none;font-weight:600;font-size:.9rem;padding:2px 9px;border-radius:999px;background:var(--mung-soft);color:var(--mung)}
.pg.supp{background:var(--saffron-soft);color:var(--saffron)}
.tag{font-size:.72rem;font-weight:600;color:var(--saffron);margin-left:6px}
.tag.ed{color:var(--muted)}
.editor{margin:4px 6px 6px;padding:10px;background:var(--sunk);border-radius:10px;display:flex;flex-direction:column;gap:8px;font-size:.9rem}
.editor .row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.editor .lbl{min-width:70px}
.mini{border:1px solid var(--line);background:var(--surface);color:var(--fg);font-weight:600;font-size:.85rem;padding:5px 10px;border-radius:8px;cursor:pointer}
.mini[aria-pressed="true"]{background:var(--mung);color:var(--mung-ink);border-color:var(--mung)}
.mini.warn{color:var(--warn);border-color:var(--warn)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.stat .v{font-weight:700;font-size:1.5rem}
.notes{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:.93rem}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{border:0;background:var(--mung);color:var(--mung-ink);font-weight:600;font-size:.95rem;padding:10px 16px;border-radius:10px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--mung);border:1px solid var(--mung)}
.btn.sm{padding:7px 12px;font-size:.88rem}
textarea.copyfb{width:100%;min-height:160px;font-size:.85rem}
.stop{padding:24px;border-radius:14px;background:var(--warn-soft);border:1px solid var(--warn);display:flex;flex-direction:column;gap:8px}
.msg{font-size:.88rem;color:var(--muted)}

/* tally */
.tally-top{display:flex;flex-direction:column;gap:10px}
.trow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 2px;border-top:1px solid var(--line)}
.trow .ctr{display:flex;align-items:center;gap:4px}
.trow .ctr button{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--fg);font-size:1.2rem;font-weight:600;cursor:pointer}
.trow .ctr output{min-width:2.2em;text-align:center;font-weight:700}
.trow.has{background:var(--mung-soft);border-radius:10px;padding-left:8px;padding-right:8px}
.sugg{display:flex;flex-wrap:wrap;gap:6px}

/* food list */
.flist{display:flex;flex-direction:column}
.frow{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1.3fr) 70px 60px;gap:10px;padding:10px 4px;border-top:1px solid var(--line);align-items:baseline}
.frow.head{font-size:.8rem;font-weight:600;color:var(--muted);border-top:0}
.frow .p{font-weight:700;color:var(--mung);text-align:right}
.frow .k{text-align:right;color:var(--muted)}
.dot{display:inline-block;width:10px;height:10px;border:1.5px solid;border-radius:2px;margin-right:6px;position:relative;vertical-align:0}
.dot::after{content:"";position:absolute;inset:2px;border-radius:50%;background:currentColor}
.dot.veg{color:#2E8B3E}.dot.egg{color:var(--saffron)}.dot.nonveg{color:#A33A2A}
.fnote{grid-column:1/-1;font-size:.82rem;color:var(--warn);margin-top:-4px}
@media (max-width:560px){.frow{grid-template-columns:minmax(0,1fr) 64px}.frow .srv,.frow .k{display:none}}
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.filters>*{flex:1 1 170px}

/* value */
.vbars{display:flex;flex-direction:column;gap:10px}
.vrow{display:grid;grid-template-columns:minmax(0,220px) minmax(0,1fr) 64px;gap:12px;align-items:center}
@media (max-width:560px){.vrow{grid-template-columns:minmax(0,1fr) 60px}.vrow .track{grid-column:1/-1;order:3}}
.track{height:12px;background:var(--sunk);border-radius:6px}
.track span{display:block;height:100%;border-radius:6px;background:var(--mung)}
.track span.s{background:var(--saffron)}.track span.x{background:var(--warn)}
.vrow .val{text-align:right;font-weight:700}
footer{font-size:.8rem;color:var(--muted);line-height:1.5;max-width:75ch}
@media (prefers-reduced-motion:no-preference){.bar span,.track span{transition:width .35s ease}}

/* print handout */
.print-head{display:none}
@media print{
  body{background:#fff;color:#000;padding:0;font-size:12pt}
  header.top,nav.tabs,.toprow,form.inputs,.actions,.editor,.days,.banner,#view-tally,#view-foods,#view-value,footer,.stats,.alert,#copyFb,.dayNote{display:none!important}
  .grid{display:block}
  .print-head{display:block;border-bottom:2px solid #000;padding-bottom:6px;margin-bottom:10px}
  .print-head h1{font-size:16pt}
  .panel,.stat,.target{border:0;padding:0;background:none;box-shadow:none}
  .target{display:flex;gap:20px;align-items:baseline;margin-bottom:8px}
  .big{font-size:28pt;color:#000}
  .bar{display:none}
  .meal{grid-template-columns:90pt 1fr;padding:6px 0;border-top:1px solid #999;break-inside:avoid}
  .item .line{padding:1px 0}
  .pg{background:none;color:#000;padding:0;font-weight:600}
  .pg.supp{color:#000}
  .tag{color:#000}
  .notes{font-size:10.5pt}
  .gu{color:#333}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="print-head"><h1 id="phTitle"></h1><p id="phSub" class="small"></p></div>

  <header class="top">
    <div>
      <div class="clinic" id="clinicLine"></div>
      <h1 data-t="appName"></h1>
      <p class="muted small" data-t="tagline" style="margin-top:4px"></p>
    </div>
    <div class="toprow">
      <nav class="tabs" role="tablist">
        <button role="tab" aria-selected="true" data-view="plan" data-t="tabPlan"></button>
        <button role="tab" aria-selected="false" data-view="tally" data-t="tabTally"></button>
        <button role="tab" aria-selected="false" data-view="foods" data-t="tabFoods"></button>
        <button role="tab" aria-selected="false" data-view="value" data-t="tabValue"></button>
      </nav>
      <select id="lang" class="langsel" aria-label="Language">
        <option value="en">English</option><option value="gu">ગુજરાતી</option><option value="hi">हिन्दी</option>
      </select>
    </div>
  </header>

  <div class="banner" id="banner" hidden><span id="bannerText"></span><button class="btn sm ghost" id="bannerEdit" style="background:var(--surface)" data-t="bannerEdit"></button></div>

  <!-- PLAN -->
  <section id="view-plan" class="grid">
    <form class="panel inputs" id="form" onsubmit="return false">
      <div class="field"><span class="lbl" data-t="who"></span>
        <div class="seg" id="mode">
          <button type="button" data-v="preg" data-t="preg"></button>
          <button type="button" data-v="lact" data-t="lact"></button>
          <button type="button" data-v="gen" data-t="gen"></button>
        </div></div>
      <div class="row2">
        <div class="field"><label for="wt" data-t="weight"></label><input id="wt" type="number" inputmode="decimal" min="30" max="160" step="0.5"></div>
        <div class="field"><label for="ht"><span data-t="height"></span> <span class="muted" style="font-weight:400" data-t="optional"></span></label><input id="ht" type="number" inputmode="decimal" min="120" max="210" placeholder="158"></div>
      </div>
      <div class="field" id="triBox"><span class="lbl" data-t="trimester"></span>
        <div class="seg" id="tri">
          <button type="button" data-v="1"><span data-t="t1"></span><span class="small" data-t="w1"></span></button>
          <button type="button" data-v="2"><span data-t="t2"></span><span class="small" data-t="w2"></span></button>
          <button type="button" data-v="3"><span data-t="t3"></span><span class="small" data-t="w3"></span></button>
        </div></div>
      <div class="field" id="lactBox" hidden><span class="lbl" data-t="babyAge"></span>
        <div class="seg" id="lact">
          <button type="button" data-v="1" data-t="m06"></button>
          <button type="button" data-v="2" data-t="m612"></button>
        </div></div>
      <div class="field"><span class="lbl" data-t="how"></span>
        <div class="seg" id="method">
          <button type="button" data-v="auto" data-t="auto"></button>
          <button type="button" data-v="perkg" data-t="perkg"></button>
          <button type="button" data-v="fixed" data-t="fixed"></button>
        </div>
        <div class="slider" id="perkgBox" hidden><input id="perkg" type="range" min="0.8" max="1.2" step="0.05" aria-label="g per kg"><output id="perkgOut" class="num"></output></div>
        <div id="fixedBox" hidden><input id="fixed" type="number" inputmode="numeric" min="20" max="200" step="1"></div>
        <div class="hint" id="methodHint"></div>
      </div>
      <div class="field"><span class="lbl" data-t="habit"></span>
        <div class="seg" id="diet"><button type="button" data-v="veg" data-t="veg"></button><button type="button" data-v="nonveg" data-t="nonveg"></button></div></div>
      <div class="field"><span class="lbl" data-t="eggs"></span>
        <div class="seg" id="eggs"><button type="button" data-v="no" data-t="noEggs"></button><button type="button" data-v="yes" data-t="yesEggs"></button></div></div>
      <div class="field"><span class="lbl" data-t="supp"></span>
        <div class="seg" id="supp"><button type="button" data-v="none" data-t="sNone"></button><button type="button" data-v="balanced" data-t="sBal"></button><button type="button" data-v="easy" data-t="sEasy"></button></div>
        <div class="hint" id="suppHint"></div></div>
      <div class="field"><span class="lbl" data-t="shop"></span>
        <div class="seg" id="shop"><button type="button" data-v="local" data-t="shopLocal"></button><button type="button" data-v="online" data-t="shopOnline"></button></div>
        <div class="hint" id="shopHint"></div></div>
      <div class="field"><span class="lbl" data-t="leaveOut"></span><div class="chips" id="excl"></div></div>
      <div class="field"><span class="lbl" data-t="conditions"></span>
        <div class="chips" id="cond">
          <button type="button" class="chip on" data-v="gdm" data-t="gdm"></button>
          <button type="button" class="chip on" data-v="kidney" data-t="kidney"></button>
          <button type="button" class="chip on" data-v="lactose" data-t="lactose"></button>
        </div></div>

      <details class="doc" id="docBox">
        <summary data-t="docTitle"></summary>
        <div class="in">
          <p class="hint" data-t="docSub"></p>
          <div class="field"><label for="pname" data-t="patName"></label><input id="pname" type="text" maxlength="60" autocomplete="off"></div>
          <div class="field"><label for="pnote" data-t="docNote"></label><textarea id="pnote" maxlength="300"></textarea></div>
          <div class="actions"><button type="button" class="btn sm" id="copyLink" data-t="copyLink"></button><button type="button" class="btn sm ghost" id="waLink" data-t="waLink"></button></div>
          <div class="msg" id="linkMsg"></div>
          <div class="field"><span class="lbl" data-t="custTitle"></span>
            <div id="custList" class="chips"></div>
            <div class="row2"><input id="cn" type="text" maxlength="40" data-ph="custName"><select id="cw"><option value="local">—</option><option value="online">—</option></select></div>
            <div class="row2"><input id="cp" type="number" min="1" max="60" step="0.5" data-ph="custP"><input id="cc" type="number" min="0" step="1" data-ph="custC"></div>
            <div class="actions"><button type="button" class="btn sm ghost" id="cadd" data-t="custAdd"></button></div></div>
          <div class="field"><span class="lbl" data-t="prices"></span>
            <div class="prices" id="priceGrid"></div></div>
        </div>
      </details>
    </form>
    <div class="result" id="result" aria-live="polite"></div>
  </section>

  <!-- TALLY -->
  <section id="view-tally" class="panel" hidden>
    <div><h2 data-t="tallyTitle"></h2><p class="muted small" data-t="tallySub" style="margin-top:4px"></p></div>
    <div class="tally-top" id="tallyTop"></div>
    <div class="filters">
      <input id="tq" type="search" data-ph="searchFoods" aria-label="Search">
      <select id="tcat" aria-label="Category"></select>
    </div>
    <div id="tlist"></div>

/* ============ TARGET ============ */
function target(){
  const w=Math.min(160,Math.max(30,+st.wt||60));
  let we=w, bmiNote="";
  const h=+st.ht;
  if(h>=120&&h<=210){
    const bmi=w/((h/100)**2);
    if(bmi>=30){ we=r1(23*(h/100)**2); bmiNote=t("bmiNote",{bmi:r1(bmi),we,w}); }
    else if(bmi<18.5){ bmiNote=t("underNote",{bmi:r1(bmi)}); }
  }
  const preg=st.mode!=="gen";
  let T,why;
  if(st.method==="auto"&&st.mode==="gen") st.method="perkg";
  if(st.method==="auto"){
    const add=st.mode==="preg"?{1:0,2:9.5,3:22}[st.tri]:{1:16.9,2:13.2}[st.lact];
    const icmr=0.83*we+add, rule=1.0*we;
    T=Math.max(icmr,rule);
    const lab=st.mode==="preg"?t("labT")[st.tri]:(st.lact==="1"?t("labL1"):t("labL2"));
    why=t(icmr>rule?"whyHigh":"whyRule",{lab,we,add,icmr:r1(icmr),rule:r1(rule)});
  }else if(st.method==="perkg"){
    T=st.perkg*we; why=t("whyPerkg",{pk:(+st.perkg).toFixed(2),we});
  }else{
    T=Math.max(20,+st.fixed||0); why=t("whyFixed",{t:Math.round(T)});
    const r=preg?1.3:1.5, cap=r*we;
    if(T>cap){ why+=t("whyCap",{cap:Math.round(cap),r}); T=cap; }
  }
  return {t:Math.round(T),we,bmiNote,why,preg};
}

/* ============ PLAN ============ */
function allowed(s,ctx){
  if(s.need==="egg"&&!ctx.eggs) return false;
  if(s.need==="nonveg"&&!ctx.nv) return false;
  if(s.grp&&ctx.ex.has(s.grp)) return false;
  if(s.supp&&st.supp==="none") return false;
  if(s.supp&&s.where==="online"&&st.shop==="local") return false;
  if(s.gdm&&ctx.gdm) return false;
  if(ctx.lf&&s.grp==="milk"&&!s.supp) return false;
  return true;
}
function build(T,d){
  syncCustom();
  const ctx={eggs:st.eggs==="yes",nv:st.diet==="nonveg",gdm:st.cond.includes("gdm"),lf:st.cond.includes("lactose"),ex:new Set(st.excl)};
  const plan=[]; let total=0,supp=0,rtd=0;
  const unavailable=new Set([...st.removed,...Object.keys(st.swap)]);
  const used=new Set(), slots=new Set();
  const mult=k=>+(st.mult[k]||1);
  const add=k=>{ const s=resolve(k,d), m=mult(k); const p=r1(s.p*m), kcal=Math.round(s.kcal*m);
    plan.push({k,...s,p,kcal,m,cost:s.cost?()=>s.cost()*m:null}); total+=p; if(s.supp){supp+=p; if(s.rtd) rtd++;} used.add(k); if(s.slot) slots.add(s.slot); };
  const can=k=>!used.has(k)&&!unavailable.has(k)&&allowed(S[k],ctx)&&!(S[k].slot&&slots.has(S[k].slot));
  // foundation
  for(const k of ["rotliL","dal","rotliD"]) if(can(k)) add(k);
  if(!ctx.lf){ if(can("milkBf")) add("milkBf"); } else if(can("milkLF")) add("milkLF");
  // forced by swaps
  for(const k of Object.values(st.swap)) if(can(k)) add(k);
  // priority queue
  const Q=[];
  if(ctx.eggs) Q.push("eggs2"); else Q.push("chilla");
  Q.push("dahi");
  const CUST=Object.keys(S).filter(k=>/^c\d+$/.test(k));
  if(st.supp==="easy") Q.push(...CUST,"hpBm","indWhey","whey","hpPan","sattu","hpLassi","skyr","hpMilk","shake","kool");
  if(ctx.nv){ if(d%2) Q.push("fish","chicken"); else Q.push("chicken","fish"); }
  Q.push("paneer","chana","sprouts","milkBed","almonds");
  if(st.supp==="balanced") Q.push(...CUST,"hpBm","sattu","hpPan");
  Q.push("chaas","soya"); if(ctx.eggs) Q.push("chilla");
  if(st.supp==="balanced") Q.push("indWhey","whey","hpLassi","skyr","hpMilk","shake","kool");
  Q.push("egg3","kathol","dahi2","peanuts","pumpkin","skyr","chanaSalad","khichdi","tofu","kadhi");
  if(ctx.lf) Q.splice(Q.indexOf("chana")+1,0,"kathol");
  const cand=()=>Q.filter((k,i)=>Q.indexOf(k)===i&&can(k)
    &&!(S[k].supp&&(supp+S[k].p*mult(k)>T/3+0.5||(S[k].rtd&&rtd>=2)))
    &&!((k==="soya"||k==="tofu")&&(used.has("milkLF")||used.has("soya")||used.has("tofu")))&&!(k==="hpMilk"&&used.has("milkBed"))&&!(k==="milkBed"&&used.has("hpMilk"))&&!(k==="khichdi"&&(used.has("rotliD")||used.has("dal")&&d%3)));
  let guard=0;
  while(T-total>1&&guard++<40){
    const c=cand(); if(!c.length) break;
    const gap=T-total; let k=c[0];
    if(gap<8){ const fits=a=>a.filter(x=>resolve(x,d).p*mult(x)>=gap-0.5).sort((a,b)=>resolve(a,d).p-resolve(b,d).p)[0]; k=fits(c.filter(x=>!S[x].supp))||fits(c)||c[0]; }
    add(k);
  }
  return {plan,total:r1(total),supp:r1(supp),ctx};
}
function altsFor(k,B,d){
  const s=S[k]; return Object.keys(S).filter(x=>x!==k&&S[x].meal===s.meal&&!B.plan.some(p=>p.k===x)&&allowed(S[x],B.ctx)&&!(S[x].slot&&B.plan.some(p=>p.slot===S[x].slot&&p.k!==k)));
}

/* ============ NOTES ============ */
function notes(B){
  const N=[], preg=st.mode==="preg", lact=st.mode==="lact";
  const ks=new Set(B.plan.map(p=>p.k));
  if(ks.has("eggs2")||ks.has("egg3")) N.push(preg?t("nEggsPreg"):t("nEggs"));
  if(ks.has("sprouts")) N.push(t("nSprouts",{p:preg?t("nSproutsP"):""}));
  if(ks.has("fish")) N.push((preg||lact)?t("nFishPreg"):t("nFish"));
  if(ks.has("chicken")) N.push(t("nChicken"));
  if(["dahi","paneer","milkBf","milkBed","chaas","dahi2"].some(k=>ks.has(k))) N.push(t("nMilk"));
  if(ks.has("soya")||ks.has("milkLF")) N.push(t("nSoya"));
  if(ks.has("shake")||ks.has("kool")) N.push(t("nShake",{p:preg?t("nShakeP"):""}));
  if(ks.has("whey")) N.push(t("nWhey"));
  if(ks.has("indWhey")) N.push(t("nIndWhey"));
  if(ks.has("sattu")) N.push(t("nSattu"));
  if(st.cond.includes("gdm")) N.push(t("nGdm"));
  if(st.cond.includes("lactose")) N.push(t("nLactose"));
  if(ks.has("peanuts")) N.push(t("nPeanuts"));
  if(preg&&st.tri!=="1") N.push(t("nKcalPreg"));
  N.push(t("nEnergy"));
  return N;
}

/* ============ RENDER PLAN ============ */
let openEditor=null, lastText="", weekText="";
const li=()=>LI[lang];
const whoText=()=>st.mode==="preg"?t("waPreg",{tri:[ "",t("t1"),t("t2"),t("t3")][st.tri]}):st.mode==="lact"?t("waLact"):t("waGen");
function planText(T,B,d,withDay){
  const byMeal=MEALS.map(([k,tm])=>({k,tm,items:B.plan.filter(p=>p.meal===k)})).filter(m=>m.items.length);
  return (withDay?`*${t("waDay")} ${d+1} — ${t("days")[d]}*\n`:"")+byMeal.map(m=>`*${t("m_"+m.k)}* (${m.tm})\n`+m.items.map(p=>`• ${p.n[li()]} — ${p.q[li()]}${p.m!==1?" ×"+p.m:""} (${p.p} g)`).join("\n")).join("\n\n");
}
function renderPlan(){

  if(st.cond.includes("kidney")){
    R.innerHTML=`<div class="stop"><h2>${t("stopTitle")}</h2><p>${t("stopBody")}</p><p class="small muted">${t("stopSub")}</p></div>`;
    lastText=""; return;
  }
  const T=target(), d=+st.day||0, B=build(T.t,d);
  const food=r1(B.total-B.supp), max=Math.max(T.t,B.total)*1.08;
  const short=T.t-B.total>2;
  const cost=B.plan.filter(p=>p.supp).reduce((a,p)=>a+p.cost(),0);
  const kcal=B.plan.reduce((a,p)=>a+p.kcal,0);
  const byMeal=MEALS.map(([k,tm])=>({k,tm,items:B.plan.filter(p=>p.meal===k)})).filter(m=>m.items.length);
  const wheyCost=Math.round(B.supp*PRICES.importedWheyPerG);

  const edited=Object.keys(st.mult).length||Object.keys(st.swap).length||st.removed.length;
  const L_=li();

  R.innerHTML=`
  ${st.note?`<div class="alert" style="background:var(--mung-soft);border-color:var(--mung)"><b>${t("docNoteHead")}:</b> ${esc(st.note)}</div>`:""}
  <div class="target">
    <div><div class="lbl" style="margin-bottom:4px">${t("target")}</div><div class="big num">${T.t}<small>${t("perDay")}</small></div></div>
    <div class="why"><span>${T.why}</span>${T.bmiNote?`<span class="muted">${T.bmiNote}</span>`:""}</div>
  </div>
  <div style="display:flex;flex-direction:column;gap:8px">
    <div class="bar" role="img" aria-label="${B.total} g of ${T.t} g">
      <span class="f" style="width:${food/max*100}%"></span><span class="s" style="width:${B.supp/max*100}%;${B.supp?"":"display:none"}"></span><span class="mark" style="left:${T.t/max*100}%"></span>
    </div>
    <div class="legend num"><span><i style="background:var(--mung)"></i>${t("legHome")} ${food} g</span><span><i style="background:var(--saffron)"></i>${t("legSupp")} ${B.supp} g</span><span><i style="background:var(--fg);width:2px"></i>${t("legTarget")} ${T.t} g</span><span><b style="color:var(--fg)">${t("legTotal")} ${B.total} g</b></span></div>
  </div>
  ${short?`<div class="alert">${t("short",{total:B.total,gap:r1(T.t-B.total)})}</div>`:""}
  <div class="panel" style="gap:10px">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap"><h2>${t("yourDay")}</h2>${edited?`<button type="button" class="mini warn" id="reset">${t("reset")}</button>`:""}</div>
    <div class="days" role="tablist">${t("days").map((n,i)=>`<button type="button" role="tab" data-d="${i}" aria-pressed="${i===d}">${n}</button>`).join("")}</div>
    <p class="hint dayNote">${t("dayNote")}</p>
    <div class="meals">${byMeal.map(m=>`
      <div class="meal"><div class="when">${t("m_"+m.k)}<span class="t">${m.tm}</span></div>
      <div class="items">${m.items.map(p=>{
        const ed=st.mult[p.k]||Object.values(st.swap).includes(p.k);
        return `<div class="item" data-k="${p.k}">
          <button type="button" class="line" aria-expanded="${openEditor===p.k}"><div class="nm"><b>${p.n[L_]}</b>${p.supp?`<span class="tag">${t("legSupp")}</span>`:""}${ed?`<span class="tag ed">${t("edited")}</span>`:""}<span class="gu">${p.q[L_]}${p.m!==1?` × ${p.m}`:""}${L_?` · ${p.n[0]}`:` · ${p.n[1]}`}</span></div><span class="pg num ${p.supp?"supp":""}">${p.p} g</span></button>
          ${openEditor===p.k?editorHTML(p,B,d):""}</div>`}).join("")}</div></div>`).join("")}
    </div>
  </div>
  <div class="stats">
    <div class="stat"><div class="lbl">${t("stProtein")}</div><div class="v num">${B.total} g</div><div class="small muted">${r1(B.total/T.we)} ${t("perKg")}</div></div>
    <div class="stat"><div class="lbl">${t("stKcal")}</div><div class="v num">${Math.round(kcal/10)*10}</div><div class="small muted">${t("kcalSub")}</div></div>
    <div class="stat"><div class="lbl">${t("stCost")}</div><div class="v num">₹${Math.round(cost)}${t("perDayCost")}</div><div class="small muted">${cost?t("monthly",{m:Math.round(cost*30).toLocaleString("en-IN"),w:wheyCost}):t("noSupp")}</div></div>
  </div>
  ${B.plan.some(p=>p.supp)?`<div class="panel" style="gap:8px"><h3>${t("buy")}</h3><ul class="notes">${B.plan.filter(p=>p.supp).map(p=>`<li><b>${p.n[L_]}</b>: ${whereText(p.where)}. ₹${p.p?r1(p.cost()/p.p):0} ${t("perG")}.</li>`).join("")}</ul></div>`:""}
  <div class="panel" style="gap:8px"><h3>${t("keep")}</h3><ul class="notes">${N.map(n=>`<li>${n}</li>`).join("")}</ul></div>

    <button class="btn ghost" id="copyWeek" type="button">${t("copyWeek")}</button>

  const copy=(txt)=>{ const done=()=>{$("#copyMsg").textContent=t("copied");};
    const fb=()=>{ $("#copyFb").hidden=false; const a=$("#copyText"); a.value=txt; a.focus(); a.select(); $("#copyMsg").textContent=t("copyFallback"); };
    try{ navigator.clipboard.writeText(txt).then(done,fb); }catch(e){ fb(); } };
  $("#copy").onclick=()=>copy(lastText);
  $("#copyWeek").onclick=()=>copy(weekText);
  if($("#shareBtn")) $("#shareBtn").onclick=()=>navigator.share({text:lastText}).catch(()=>{});

  $$(".item .line").forEach(b=>b.onclick=()=>{ const k=b.parentElement.dataset.k; openEditor=openEditor===k?null:k; renderPlan(); });
  $$(".editor [data-m]").forEach(b=>b.onclick=()=>{ const k=b.closest(".item").dataset.k; const m=+b.dataset.m; if(m===1) delete st.mult[k]; else st.mult[k]=m; save(); renderPlan(); });
  $$(".editor [data-swap]").forEach(b=>b.onclick=()=>{ const k=b.closest(".item").dataset.k; const to=b.dataset.swap;
    const orig=Object.keys(st.swap).find(o=>st.swap[o]===k)||k; delete st.swap[k]; st.swap[orig]=to; delete st.mult[k]; openEditor=to; save(); renderPlan(); });
  $$(".editor [data-remove]").forEach(b=>b.onclick=()=>{ const k=b.closest(".item").dataset.k; const orig=Object.keys(st.swap).find(o=>st.swap[o]===k); if(orig){ delete st.swap[orig]; if(!st.removed.includes(orig)) st.removed.push(orig); } if(!st.removed.includes(k)) st.removed.push(k); delete st.mult[k]; openEditor=null; save(); renderPlan(); });
  $$(".editor [data-close]").forEach(b=>b.onclick=()=>{ openEditor=null; renderPlan(); });

function editorHTML(p,B,d){
  const alts=altsFor(p.k,B,d);
  const m=p.m;
  return `<div class="editor">
    <div class="row"><span class="lbl">${t("portion")}</span>${[[0.5,"half"],[1,"one"],[1.5,"oneHalf"],[2,"two"]].map(([v,k])=>`<button type="button" class="mini" data-m="${v}" aria-pressed="${m===v}">${t(k)}</button>`).join("")}</div>
    ${alts.length?`<div class="row"><span class="lbl">${t("swap")}</span>${alts.map(k=>{const s=resolve(k,d);return `<button type="button" class="mini" data-swap="${k}">${s.n[li()]} <span class="muted">${s.p} g</span></button>`}).join("")}</div>`:""}
    <div class="row"><button type="button" class="mini warn" data-remove>${t("remove")}</button><button type="button" class="mini" data-close>${t("close")}</button></div></div>`;
}

/* ============ CONTROLS ============ */
function seg(id,key){ $$("#"+id+" button").forEach(b=>{ b.setAttribute("aria-pressed",String(b.dataset.v===String(st[key]))); b.onclick=()=>{ st[key]=b.dataset.v; save(); sync(); }; }); }
function chips(id,key){ $$("#"+id+" button").forEach(b=>{ b.setAttribute("aria-pressed",String(st[key].includes(b.dataset.v))); b.onclick=()=>{ const a=st[key]; const i=a.indexOf(b.dataset.v); i<0?a.push(b.dataset.v):a.splice(i,1); save(); sync(); }; }); }
function applyText(){
  document.documentElement.lang=lang;
  const cl=document.getElementById("clinicLine");if(cl)cl.textContent=clinicName();
  $$("[data-t]").forEach(e=>{ e.textContent=t(e.dataset.t); });
  $$("[data-ph]").forEach(e=>{ e.placeholder=t(e.dataset.ph); });
  $("#excl").innerHTML=EXCL.map(v=>`<button type="button" class="chip" data-v="${v}">${t("x_"+v)}</button>`).join("");
  $("#lang").value=lang;
  document.title=(clinicName()?clinicName()+" · ":"")+t("appName");
  $("#priceGrid").innerHTML=Object.keys(PRICE_DEF).map(k=>`<label for="pr_${k}">${t("p_"+k)}</label><input id="pr_${k}" type="number" min="0" step="0.5" value="${PRICES[k]}">`).join("");
  Object.keys(PRICE_DEF).forEach(k=>{ $("#pr_"+k).oninput=e=>{ PRICES[k]=+e.target.value||PRICE_DEF[k]; try{localStorage.setItem("mpp-prices",JSON.stringify(PRICES));}catch(x){} renderPlan(); renderValue(); }; });
  renderValue();
}
function sync(){
  if(st.mode==="gen"&&st.method==="auto") st.method="perkg";
  $("#triBox").hidden=st.mode!=="preg"; $("#lactBox").hidden=st.mode!=="lact";
  $('#method [data-v="auto"]').hidden=st.mode==="gen";
  $("#perkgBox").hidden=st.method!=="perkg"; $("#fixedBox").hidden=st.method!=="fixed";
  $("#perkgOut").textContent=(+st.perkg).toFixed(2)+" g/kg";
  $("#methodHint").textContent=t(st.method==="auto"?"hintAuto":st.method==="perkg"?"hintPerkg":"hintFixed");
  $("#suppHint").textContent=t({none:"hNone",balanced:"hBal",easy:"hEasy"}[st.supp]);
  $("#shopHint").textContent=t(st.shop==="local"?"hShopLocal":"hShopOnline");
  ["mode","tri","lact","method","diet","eggs","supp","shop"].forEach(k=>seg(k,k));
  renderCustom();
  chips("excl","excl"); chips("cond","cond");
  $("#wt").value=st.wt; $("#ht").value=st.ht; $("#perkg").value=st.perkg; $("#fixed").value=st.fixed; $("#pname").value=st.name; $("#pnote").value=st.note;
  $("#banner").hidden=!st.fromDoc;
  $("#bannerText").innerHTML=t("banner",{name:st.name?t("bannerFor",{name:esc(st.name)}):""});
  $("#form").hidden=st.fromDoc;
  renderPlan(); renderTally();
}
$("#wt").oninput=e=>{st.wt=e.target.value;save();renderPlan();renderTally();};
$("#ht").oninput=e=>{st.ht=e.target.value;save();renderPlan();};
$("#perkg").oninput=e=>{st.perkg=e.target.value;$("#perkgOut").textContent=(+st.perkg).toFixed(2)+" g/kg";save();renderPlan();renderTally();};
$("#fixed").oninput=e=>{st.fixed=e.target.value;save();renderPlan();renderTally();};
$("#pname").oninput=e=>{st.name=e.target.value;save();renderPlan();};
$("#pnote").oninput=e=>{st.note=e.target.value;save();renderPlan();};
$("#lang").onchange=e=>{ lang=e.target.value; st.lang=lang; save(); applyText(); sync(); renderFoods(); };
$("#bannerEdit").onclick=()=>{ st.fromDoc=false; save(); sync(); };

/* doctor-added supplements */
function renderCustom(){
  $('#cw option[value="local"]').textContent=t("shopLocal"); $('#cw option[value="online"]').textContent=t("shopOnline");
  $("#custList").innerHTML=(st.custom||[]).map((c,i)=>`<span class="chip">${esc(c.n)} · ${c.p} g · ₹${c.c} <button type="button" class="mini" data-cdel="${i}" style="padding:0 6px;margin-left:4px">×</button></span>`).join("");
  $$("[data-cdel]").forEach(b=>b.onclick=()=>{ st.custom.splice(+b.dataset.cdel,1); save(); sync(); renderValue(); });
}
$("#cadd").onclick=()=>{ const n=$("#cn").value.trim(), p=+$("#cp").value, c=+$("#cc").value; if(!n||!p) return; (st.custom=st.custom||[]).push({n,p,c,w:$("#cw").value}); $("#cn").value=""; $("#cp").value=""; $("#cc").value=""; save(); sync(); renderValue(); };
/* doctor link */
function makeLink(){
  const o={}; for(const k of ["mode","tri","lact","method","perkg","fixed","diet","eggs","supp","wt","ht","excl","cond","shop","custom","mult","swap","removed","name","note"]) o[k]=st[k]; o.lang=lang;
  const b=btoa(unescape(encodeURIComponent(JSON.stringify(o)))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
  return location.origin+location.pathname+"#p="+b;
}
$("#copyLink").onclick=()=>{ const u=makeLink(); const ok=()=>{$("#linkMsg").textContent=t("linkCopied");}; const fb=()=>{$("#linkMsg").textContent=u;}; try{navigator.clipboard.writeText(u).then(ok,fb);}catch(e){fb();} };
$("#waLink").onclick=()=>{ const T=target(); const msg=`${t("waHead")}\n${st.name?st.name+"\n":""}${t("waTarget")}: ${T.t} g/${t("waDay").toLowerCase()}\n${makeLink()}`; window.open("https://wa.me/?text="+encodeURIComponent(msg),"_blank"); };

const CATS=[...new Set(FOODS.map(f=>f[0]))];
const catOpts=()=>`<option value="">${t("allCats")}</option>`+CATS.map(c=>`<option value="${c}">${t("c_"+c)}</option>`).join("");
const fst={tag:"all"};
$$("#ftag button").forEach(b=>b.onclick=()=>{fst.tag=b.dataset.v;$$("#ftag button").forEach(x=>x.setAttribute("aria-pressed",String(x===b)));renderFoods();});
$("#fq").oninput=renderFoods; $("#fcat").onchange=renderFoods;
function renderFoods(){
  const sel=$("#fcat"); const cur=sel.value; sel.innerHTML=catOpts(); sel.value=cur;
  const q=$("#fq").value.trim().toLowerCase(), c=sel.value;
  const rows=FOODS.filter(f=>(!c||f[0]===c)&&(fst.tag==="all"||f[1]===fst.tag)&&(!q||(f[2]+" "+f[3]).toLowerCase().includes(q)));
  $("#flist").innerHTML=`<div class="frow head"><span>${t("colFood")}</span><span class="srv">${t("colServe")}</span><span class="p" style="color:inherit">${t("colProt")}</span><span class="k">kcal</span></div>`+
   (rows.length?rows.map(f=>`<div class="frow"><span><span class="dot ${f[1]}"></span><b>${f[2]}</b><span class="gu muted small" style="display:block">${f[3]}</span></span><span class="srv small">${f[4]}</span><span class="p num">${f[5]} g</span><span class="k num">${f[6]??"–"}</span>${f[7]?`<span class="fnote">${f[7]}</span>`:""}</div>`).join("")
   :`<p class="muted">${t("noMatch")}</p>`);
}

/* ============ TODAY'S TALLY ============ */
let tally={date:"",counts:{}};
try{ tally=JSON.parse(localStorage.getItem("mpp2-tally")||"{}")||tally; }catch(e){}
const today=()=>new Date().toISOString().slice(0,10);
if(tally.date!==today()){ tally={date:today(),counts:{}}; }
const saveT=()=>{ try{localStorage.setItem("mpp2-tally",JSON.stringify(tally));}catch(e){} };
$("#tq").oninput=renderTally; $("#tcat").onchange=renderTally;
$("#tclear").onclick=()=>{ tally={date:today(),counts:{}}; saveT(); renderTally(); };
function renderTally(){
  if(tally.date!==today()){ tally={date:today(),counts:{}}; saveT(); }
  const T=target();
  const total=r1(Object.entries(tally.counts).reduce((a,[i,n])=>a+FOODS[i][5]*n,0));
  const gap=r1(T.t-total), max=Math.max(T.t,total)*1.08;
  const nv=st.diet==="nonveg", eg=st.eggs==="yes", gdm=st.cond.includes("gdm");
  let sug=[];
  if(gap>0){
    const cands=FOODS.map((f,i)=>({f,i})).filter(({f})=>f[5]>=3&&(f[1]==="veg"||(f[1]==="egg"&&eg)||(f[1]==="nonveg"&&nv))&&!(f[0]==="Supplements"&&st.supp==="none")&&!(gdm&&/sugar|sweetener/i.test(f[7]))&&!(st.cond.includes("lactose")&&/milk/i.test(f[2])));
    const fits=cands.filter(c=>c.f[5]>=gap).sort((a,b)=>a.f[5]-b.f[5]).slice(0,3);
    sug=fits.length?fits:cands.sort((a,b)=>b.f[5]-a.f[5]).slice(0,3);
  }
  $("#tallyTop").innerHTML=`
    <div class="target" style="padding:14px 18px"><div><div class="lbl">${t("todayTotal")}</div><div class="big num" style="font-size:2.6rem">${total}<small>g</small></div></div>
    <div class="why"><b>${gap>0?t("gapLeft",{gap,t:T.t}):t("gapDone")}</b>
    ${sug.length?`<span class="small muted">${t("suggest")}</span><div class="sugg">${sug.map(c=>`<button type="button" class="mini" data-add="${c.i}">+ ${c.f[2]} <span class="muted">${c.f[5]} g</span></button>`).join("")}</div>`:""}</div></div>
    <div class="bar" role="img" aria-label="${total} g of ${T.t} g"><span class="f" style="width:${Math.min(100,total/max*100)}%"></span><span class="mark" style="left:${T.t/max*100}%"></span></div>`;
  const sel=$("#tcat"); const cur=sel.value; sel.innerHTML=catOpts(); sel.value=cur;
  const q=$("#tq").value.trim().toLowerCase(), c=sel.value;
  const rows=FOODS.map((f,i)=>({f,i})).filter(({f,i})=>(tally.counts[i]||!c||f[0]===c)&&(tally.counts[i]||!q||(f[2]+" "+f[3]).toLowerCase().includes(q)));
  rows.sort((a,b)=>(tally.counts[b.i]?1:0)-(tally.counts[a.i]?1:0));
  $("#tlist").innerHTML=rows.map(({f,i})=>{const n=tally.counts[i]||0;return `<div class="trow ${n?"has":""}"><div><span class="dot ${f[1]}"></span><b>${f[2]}</b> <span class="muted small">${f[4]} · ${f[5]} g</span><span class="gu muted small" style="display:block">${f[3]}</span></div>
    <div class="ctr"><button type="button" data-dec="${i}" aria-label="−">−</button><output class="num">${n||""}</output><button type="button" data-inc="${i}" aria-label="+">+</button></div></div>`;}).join("");
  const bump=(i,dx)=>{ const n=Math.max(0,(tally.counts[i]||0)+dx); if(n) tally.counts[i]=n; else delete tally.counts[i]; tally.date=today(); saveT(); renderTally(); };
  $$("[data-inc]").forEach(b=>b.onclick=()=>bump(+b.dataset.inc,1));
  $$("[data-dec]").forEach(b=>b.onclick=()=>bump(+b.dataset.dec,-1));
  $$("[data-add]").forEach(b=>b.onclick=()=>bump(+b.dataset.add,1));
}

   ["Amul Whey, plain sachet",r1(price.whey()/25),"s"],["Amul High Protein Milk",r1(price.hpMilk()/35),"s"],["Milky Mist Skyr",r1(price.skyr()/11),"s"],["Amul Kool Protein Shake",r1(price.kool()/10),"s"],
   ["Protinex Mama",4.1,"x"],["Prohance Mom",5.3,"x"],["Milky Mist Greek Yogurt",6.6,"s"],["Imported whey (₹15,000 / 2 kg)",+PRICES.importedWheyPerG,"x"],
   ...(st.custom||[]).filter(c=>c.p).map(c=>[c.n,r1(c.c/c.p),"s"])
  ].sort((a,b)=>a[1]-b[1]);
  const mx=Math.max(...VAL.map(v=>v[1]))*1.05;
  $("#vbars").innerHTML=VAL.map(([n,v,k])=>`<div class="vrow"><span>${n}</span><div class="track"><span class="${k}" style="width:${v/mx*100}%"></span></div><span class="val num">₹${v.toFixed(2)}</span></div>`).join("");
}
